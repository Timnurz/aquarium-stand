function renderTests(M){
  const r = M.fertRes;
  const fmt = v => (Math.round(v * 1000) / 1000).toString().replace('.', ',');
  const grp = t => `<tr><td colspan="4" style="padding:16px 0 6px;font:600 10.5px/1 inherit;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)">${t}</td></tr>`;
  const rowT = ([name, v, lo, hi, unit, dec]) => {
    let st, cls, val;
    if(v == null){ st = 'нет данных'; cls = 'mut'; val = '—'; }
    else {
      val = fmt(v) + (unit ? ` <span class="mut">${unit}</span>` : '');
      if(v < lo){ st = 'низко'; cls = 'badge-warn'; }
      else if(v > hi){ st = 'высоко'; cls = 'badge-bad'; }
      else { st = 'норма'; cls = 'badge-ok'; }
    }
    const norm = lo === 0 ? `до ${fmt(hi)}` : `${fmt(lo)}–${fmt(hi)}`;
    return `<tr><td>${name}</td><td class="num">${val}</td><td class="mut">${norm} ${unit}</td><td><span class="${cls}">${st}</span></td></tr>`;
  };
  const T = r.TPAR;
  const recRows = r.fertRec.map(([txt, lvl]) => {
    const cls = lvl === 'bad' ? 'badge-bad' : (lvl === 'warn' ? 'badge-warn' : 'badge-ok');
    return `<li style="margin-bottom:8px"><span class="${cls}">•</span> ${txt}</li>`;
  }).join('');
  const wcut = r.WCUT.length
    ? r.WCUT.map(([n, pct]) => `<tr><td>${n}</td><td class="num">${pct} %</td></tr>`).join('')
    : `<tr><td colspan="2" class="mut">Ничего выводить не нужно — всё в норме или неизвестно.</td></tr>`;

  $('#secFert').innerHTML = `
    <div class="two">
      <section class="card">
        <h2 class="ct">Показатели <span class="hint">${r.okN} из ${r.knownN} в норме</span></h2>
        <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>Параметр</th><th>Сейчас</th><th>Норма</th><th></th></tr></thead>
          <tbody>
            ${grp('Вода')}${T.slice(0,6).map(rowT).join('')}
            ${grp('Азот и фосфор')}${T.slice(6,10).map(rowT).join('')}
            ${grp('Минералы')}${T.slice(10).map(rowT).join('')}
          </tbody>
        </table></div>
        <p class="note">CO₂ считается по pH и KH: CO₂ = 3 × KH × 10<sup>(7 − pH)</sup>. Пустое поле — нет теста.</p>
      </section>

      <section class="card">
        <h2 class="ct">Рекомендации</h2>
        <ul style="list-style:none;margin:6px 0 0;padding:0;font-size:13px;line-height:1.5;color:var(--tx2)">${recRows}</ul>
      </section>
    </div>

    <section class="card">
      <h2 class="ct">Подмены <span class="hint">чтобы вернуть в норму</span></h2>
      <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>Параметр</th><th>Подменить</th></tr></thead>
        <tbody>${wcut}</tbody>
      </table></div>
      <p class="note">Доля от объёма, если в подменной воде этого вещества нет. Для аммиака и нитрита подмену делают сразу, не дожидаясь расчёта.</p>
    </section>`;
}

function renderUdo(M){
  const r = M.fertRes, f = r.f, g = r.TGT;
  const all = [
    ['Калиевая селитра', 'KNO₃', r.mKNO3, `+${f1(r.no3FromK)} мг/л NO₃, +${f1(r.kUsed)} K`],
    ['Кальциевая селитра', 'Ca(NO₃)₂ · 4H₂O', r.mCaNO3, `+${f1(r.no3FromCa)} мг/л NO₃, +${f1(r.caUsed)} Ca`],
    ['Мочевина, карбамид', 'CO(NH₂)₂', r.mUrea, `+${f1(r.no3FromUrea)} мг/л NO₃`],
    ['Монофосфат калия', 'KH₂PO₄', r.mKH2PO4, `+${f1(r.dP)} мг/л PO₄`],
    ['Сульфат калия', 'K₂SO₄', r.mK2SO4, 'калий до цели'],
    ['Магнезия, сульфат магния', 'MgSO₄ · 7H₂O', r.mMgSO4, 'магний до цели'],
    ['Микро + железо, хелат', 'CSM+B / Fe-DTPA', r.mCSM, 'железо до цели']
  ].filter(x => x[2] > 0.001);

  const grams = g0 => g0 < 0.01 ? '&lt; 0,01' : (g0 < 1 ? f2(g0) : f1(g0));
  const rows = all.length
    ? all.map(([n, fm, gram, what]) =>
      `<tr><td>${n}</td><td class="mut">${fm}</td><td class="num">${grams(gram)} <span class="mut">г</span></td><td class="num">${grams(gram/3)} <span class="mut">г</span></td><td class="mut">${what}</td></tr>`).join('')
    : `<tr><td colspan="5" class="mut">Всё в цели — вносить нечего.</td></tr>`;

  const deficit = [
    ['NO₃', f.no3, g.no3], ['PO₄', f.po4, g.po4], ['K', f.k, g.k],
    ['Ca', f.ca, g.ca], ['Mg', f.mg, g.mg], ['Fe', f.fe, g.fe]
  ].map(([n, cur, tgt]) => {
    const d = tgt - cur;
    const cls = d > 0.001 ? 'badge-warn' : (d < -0.001 ? 'mut' : 'badge-ok');
    return `<span style="margin-right:14px;white-space:nowrap">${n}: <b class="${cls}">${d > 0.001 ? '+' : ''}${f1(d)}</b></span>`;
  }).join('');

  $('#secUdo').innerHTML = `
    <section class="card">
      <h2 class="ct">Рецепт <span class="hint">на ${f0(M.waterV)} л</span></h2>
      <p class="note" style="margin-top:0">${deficit}</p>
      <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>В магазине</th><th>Формула</th><th>Разовая правка</th><th>На приём (3 раза в неделю)</th><th>Что даёт</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      <p class="note">Селитры берут столько, сколько позволяет запас по калию и кальцию (потолки ${f0(Math.max(30, g.k))} и ${f0(Math.max(60, g.ca))} мг/л), остаток азота уходит мочевиной. Не хотите поднимать кальций — весь азот дайте мочевиной.</p>
      <p class="note">Каждую соль — в отдельной бутылке, недельную массу в 500 мл, делить на 3 приёма. Фосфат не смешивать с кальцием, магнием и микро — выпадет осадок. Садовая селитра 98–99 %, добавьте 1–2 % к массе.</p>
    </section>`;
}

function renderNow(M){
  const sec = state.section || 'tank';
  let big = '', sub = '', dots = '';
  if(sec === 'tank'){
    big = `${f0(M.waterV)} л воды`;
    sub = `Стекло ${M.glass.w} / ${M.glass.b} мм · грунт ${f0(M.soilV(50))} л · вес ${f0(M.tankW)} кг`;
  } else if(sec === 'stand'){
    big = `${M.n} ${pl(M.n,'секция','секции','секций')} · ${f0(M.clear)} мм`;
    sub = `Дверцы ${f0(M.doorW)}×${f0(M.doorH)} · ${M.sheets.length} ${pl(M.sheets.length,'лист','листа','листов')} фанеры`;
  } else if(sec === 'gear'){
    big = `${f0(M.gear.flowMin)}–${f0(M.gear.flowMax)} л/ч`;
    sub = `Реальный поток · свет ${f0(M.gear.lmMin)}–${f0(M.gear.lmMax)} лм · обогрев до ${f0(Math.max(25, Math.round(M.gear.heatMax/25)*25))} Вт`;
  } else if(sec === 'bio'){
    big = `${f1(M.bioRes.capTAN)} г TAN/сут`;
    sub = `Загрузка ${Math.round(M.bioRes.load*100)} % · рыба до ${f1(M.bioRes.fishCap/1000)} кг`;
  } else if(sec === 'fert' || sec === 'udo'){
    const r = M.fertRes;
    if(sec === 'fert'){
      big = `${r.okN} из ${r.knownN} в норме`;
      sub = r.okN === r.knownN ? 'Все известные показатели в эталоне' : `${r.knownN - r.okN} вне нормы — смотрите рекомендации`;
    } else {
      const nSalts = [r.mKNO3, r.mCaNO3, r.mUrea, r.mKH2PO4, r.mK2SO4, r.mMgSO4, r.mCSM].filter(v => v > 0.001).length;
      big = nSalts ? `${nSalts} ${pl(nSalts,'соль','соли','солей')} в рецепте` : 'Ничего вносить не нужно';
      const d = [];
      if(r.dN > 0.01) d.push(`NO₃ +${f1(r.dN)}`);
      if(r.dP > 0.01) d.push(`PO₄ +${f1(r.dP)}`);
      sub = d.length ? d.join(' · ') + ' до цели' : 'Всё на цели';
    }
    const bad = r.TPAR.filter(v => v[1] != null && (v[1] < v[2] || v[1] > v[3]));
    dots = bad.length
      ? bad.slice(0,6).map(([n,v,lo,hi]) => `<span class="dot ${v < lo ? 'warn' : 'bad'}"><i></i>${n.replace(' (расчёт)','')}</span>`).join('')
      : `<span class="dot ok"><i></i>всё в норме</span>`;
  }
  $('#cardNow').innerHTML = `<div class="nk">Сейчас</div><div class="big">${big}</div><div class="sub">${sub}</div>${dots ? `<div class="dots">${dots}</div>` : ''}`;
}

function setSection(sec){
  state.section = sec;
  $('#segs').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s===sec));
  $('#secTank').classList.toggle('hide', sec!=='tank');
  $('#secStand').classList.toggle('hide', sec!=='stand');
  $('#secGear').classList.toggle('hide', sec!=='gear');
  $('#secBio').classList.toggle('hide', sec!=='bio');
  $('#secFert').classList.toggle('hide', sec!=='fert');
  $('#secUdo').classList.toggle('hide', sec!=='udo');
  /* ввод стоит перед результатом на «Тестах» и «Удо» */
  const udoBox = $('#udoInputs');
  const mainEl = document.querySelector('.main');
  const onIn = (sec === 'fert' || sec === 'udo');
  if(sec === 'fert') mainEl.insertBefore(udoBox, $('#secFert'));
  else if(sec === 'udo') mainEl.insertBefore(udoBox, $('#secUdo'));
  udoBox.classList.toggle('hide', !onIn);
  udoBox.classList.toggle('three', onIn);
  if(onIn){
    ['cardWater','cardNP','cardMin','cardGoal'].forEach(id => {
      const el = document.getElementById(id);
      if(el && el.parentElement !== udoBox) udoBox.appendChild(el);
    });
    udoBox.querySelectorAll('.f-extra').forEach(el => el.classList.toggle('hide', sec !== 'fert'));
  }
  $('#cardWater').classList.toggle('hide', sec !== 'fert');
  $('#cardNP').classList.toggle('hide', !onIn);
  $('#cardMin').classList.toggle('hide', !onIn);
  $('#cardGoal').classList.toggle('hide', sec !== 'udo');
  $('#cardTank').classList.toggle('hide', sec==='fert');
  $('#kpis').classList.toggle('hide', sec==='fert' || sec==='udo');
  $('#sideSpec').classList.toggle('hide', sec!=='stand');
  $('#cardStand').classList.toggle('hide', sec!=='stand');
  $('#cardBio').classList.toggle('hide', sec!=='bio');
  const HINTS = {
    tank: 'Стекло, грунт и вес по размерам аквариума.',
    stand: 'Корпус, раскрой фанеры и порядок сборки.',
    gear: 'Фильтр, свет, аэрация и обогрев под объём воды.',
    bio: 'Сколько азота перерабатывает фильтр и сколько рыбы это кормит.',
    fert: 'Ваши показатели против эталона травника.',
    udo: 'Сколько и каких солей добавить до цели.'
  };
  $('#seghint').textContent = HINTS[sec] || '';
  if(MODEL){ renderKpis(MODEL); renderNow(MODEL); }
}

const SAVE_IDS = ['inL','inD','inH','inHS','inSheet','inMedia','inMV','inTemp','inProt','inRate','inFish',
  'inNO3','inPO4','inK','inCa','inMg','inFe','inPH','inKH','inGH','inNH3','inNO2','inCu','inTDS','inEC',
  'inGNO3','inGPO4','inGK','inGCa','inGMg','inGFe'];
function saveState(){
  try{
    const o = { __color: state.color };
    SAVE_IDS.forEach(id => { const el = document.getElementById(id); if(el) o[id] = el.value; });
    localStorage.setItem('aqua-calc', JSON.stringify(o));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem('aqua-calc');
    if(!raw) return;
    const o = JSON.parse(raw);
    SAVE_IDS.forEach(id => { const el = document.getElementById(id); if(el && o[id] != null) el.value = o[id]; });
    if(o.__color === 'black' || o.__color === 'beige'){
      state.color = o.__color;
      document.querySelectorAll('#colors .sw').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.c === state.color)));
    }
  }catch(e){}
}

function renderAll(){
  const L  = clamp(+$('#inL').value || 1200, 300, 4200);
  const D  = clamp(+$('#inD').value || 500, 300, 1200);
  const Ht = clamp(+$('#inH').value || 500, 200, 1200);
  const H  = +$('#inHS').value || 900;
  const [SW, SH] = $('#inSheet').value.split(',').map(Number);
  const bio = {
    media: $('#inMedia').value,
    mv: clamp(+$('#inMV').value || 5, 0.5, 100),
    t: +$('#inTemp').value || 25,
    prot: clamp(+$('#inProt').value || 40, 20, 60),
    rate: clamp(+$('#inRate').value || 2, 0.5, 5),
    fish: clamp(+$('#inFish').value || 300, 10, 10000)
  };
  const numIn = id => { const el = document.getElementById(id); return (el && el.value !== '') ? +el.value : null; };
  const fert = {
    no3: numIn('inNO3'), po4: numIn('inPO4'), k: numIn('inK'), ca: numIn('inCa'), mg: numIn('inMg'), fe: numIn('inFe'),
    ph: numIn('inPH'), kh: numIn('inKH'), gh: numIn('inGH'), nh3: numIn('inNH3'), no2: numIn('inNO2'),
    cu: numIn('inCu'), tds: numIn('inTDS'), ec: numIn('inEC')
  };
  const goal = {
    no3: clamp(+$('#inGNO3').value || 0, 0, 200),
    po4: clamp(+$('#inGPO4').value || 0, 0, 50),
    k:   clamp(+$('#inGK').value || 0, 0, 200),
    ca:  clamp(+$('#inGCa').value || 0, 0, 200),
    mg:  clamp(+$('#inGMg').value || 0, 0, 100),
    fe:  clamp(+$('#inGFe').value || 0, 0, 2)
  };
  MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal);
  renderKpis(MODEL);
  renderSide(MODEL);
  renderTank(MODEL);
  renderView(MODEL);
  renderCalc(MODEL);
  renderCut(MODEL);
  renderAsm(MODEL);
  renderGear(MODEL);
  renderBio(MODEL);
  renderTests(MODEL);
  renderUdo(MODEL);
  setSection(state.section);
  saveState();
}

/* ---------- пресеты ---------- */
const PRESETS = [
  [600,300,300],[800,350,400],[1000,400,500],[1200,500,500],
  [1500,500,600],[1800,600,600],[2000,600,700],[2400,600,700]
];
$('#presets').innerHTML = PRESETS.map(([L,D,Ht])=>`<button data-p="${L},${D},${Ht}">${L/10}×${D/10}×${Ht/10}</button>`).join('');
$('#presets').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const [L,D,Ht] = b.dataset.p.split(',').map(Number);
  $('#inL').value=L; $('#inD').value=D; $('#inH').value=Ht;
  renderAll();
});

/* ---------- ввод ---------- */
let tmr=null;
['inL','inD','inH'].forEach(id=>{
  document.getElementById(id).addEventListener('input', ()=>{
    clearTimeout(tmr);
    tmr = setTimeout(renderAll, 130);
  });
});
$('#inHS').addEventListener('change', renderAll);
['inGNO3','inGPO4','inGK','inGCa','inGMg','inGFe'].forEach(id=>{
  document.getElementById(id).addEventListener('input', ()=>{ clearTimeout(tmr); tmr = setTimeout(renderAll, 130); });
});
['inNO3','inPO4','inK','inCa','inMg','inFe','inPH','inKH','inGH','inNH3','inNO2','inCu','inTDS','inEC'].forEach(id=>{
  document.getElementById(id).addEventListener('input', ()=>{ clearTimeout(tmr); tmr = setTimeout(renderAll, 130); });
});
['inMV','inProt','inRate','inFish','inTemp','inMedia'].forEach(id=>{
  document.getElementById(id).addEventListener('input', ()=>{ clearTimeout(tmr); tmr = setTimeout(renderAll, 130); });
  document.getElementById(id).addEventListener('change', renderAll);
});
$('#inSheet').addEventListener('change', renderAll);
$('#colors').querySelectorAll('.sw').forEach(b=>b.onclick=()=>{
  state.color = b.dataset.c;
  $('#colors').querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  renderView(MODEL);
});

const hashTab = location.hash.replace('#','');
if(['tumba','frame','front','side','detail'].includes(hashTab)){
  state.tab = hashTab;
  state.section = 'stand';
} else if(['tank','stand','gear','bio','fert','udo'].includes(hashTab)){
  state.section = hashTab;
}

$('#segs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
  setSection(b.dataset.s);
  history.replaceState(null,'','#'+b.dataset.s);
});

try{
  const qp = new URLSearchParams(location.search);
  if(qp.get('l')) $('#inL').value = qp.get('l');
  if(qp.get('d')) $('#inD').value = qp.get('d');
  if(qp.get('h')) $('#inH').value = qp.get('h');
  if(qp.get('H')) $('#inHS').value = qp.get('H');
  if(qp.get('sheet')) $('#inSheet').value = qp.get('sheet');
  if(qp.get('color')==='black'){ state.color='black'; $('#colors').querySelectorAll('.sw').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.c==='black'))); }
}catch(e){}

loadState();
renderAll();
</script>
