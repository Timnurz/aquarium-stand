function sheetSVG(M, sh, idx){
  const W=520, Hh=300, pad=16;
  const sc = Math.min((W-2*pad)/M.SW, (Hh-2*pad-18)/M.SH);
  const w = M.SW*sc, h = M.SH*sc;
  const ox = (W-w)/2, oy = 8;
  let s = `<rect x="${ox}" y="${oy}" width="${w}" height="${h}" fill="#ffffff" stroke="#d8dae1" stroke-width="1.2"/>`;
  sh.items.forEach(it=>{
    const col = PAL[(it.id-1)%PAL.length];
    const x = ox + it.x*sc, y = oy + it.y*sc, ww = it.w*sc, hh = it.h*sc;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,ww-0.6).toFixed(1)}" height="${Math.max(1,hh-0.6).toFixed(1)}" fill="${col}" fill-opacity=".13" stroke="${col}" stroke-opacity=".9" stroke-width="1"/>`;
    if(ww > 30 && hh > 15)
      s += `<text x="${(x+ww/2).toFixed(1)}" y="${(y+hh/2+4).toFixed(1)}" text-anchor="middle" fill="${col}" font-size="12" font-weight="700" font-family="Segoe UI">${it.id}</text>`;
    if(ww > 80 && hh > 36)
      s += `<text x="${(x+ww/2).toFixed(1)}" y="${(y+hh/2+18).toFixed(1)}" text-anchor="middle" fill="#8b919b" font-size="9.5" font-family="Consolas">${Math.round(it.w)}×${Math.round(it.h)}</text>`;
  });
  s += `<text x="${ox+4}" y="${oy+h+13}" fill="#8b919b" font-size="10.5" font-family="Consolas">${M.SW} × ${M.SH} · ${LANG==='en' ? 'sheet' : 'лист'} ${idx+1}</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

function wavyLine(x1,y1,x2,y2,amp,step){
  amp = amp || 2.6; step = step || 7;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const n=Math.max(2, Math.round(len/step));
  let d='';
  for(let i=0;i<=n;i++){
    const t=i/n, s=Math.sin(t*Math.PI*2*(n/2))*amp;
    const x=x1+dx*t+nx*s, y=y1+dy*t+ny*s;
    d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
  }
  return `<path d="${d}" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>`;
}

const edgeSides = mode => ({all:4, front_lr:3, front_l:2, front_r:2, front:1}[mode] || 0);
const fmtDim = v => Math.abs(v - Math.round(v)) < 0.05 ? f0(v) : f1(v);

function drillCard(p,M){
  const W=900, H=360, maxW=780, maxH=230;
  const sc=Math.min(maxW/Math.max(p.w,1), maxH/Math.max(p.h,1));
  const rw=Math.max(24, p.w*sc), rh=Math.max(24, p.h*sc);
  const ox=(W-rw)/2, oy=40+(maxH-rh)/2;
  const X=mm=>ox+mm*sc, Y=mm=>oy+mm*sc;
  const pcs = LANG==='en' ? 'pcs' : 'шт';
  let out='';
  out += `<rect x="${ox.toFixed(1)}" y="${oy.toFixed(1)}" width="${rw.toFixed(1)}" height="${rh.toFixed(1)}" fill="#f8f4ec" stroke="#7d6a50" stroke-width="1.2" rx="2"/>`;
  /* dimensions */
  out += `<text x="${(ox+rw/2).toFixed(1)}" y="${(oy-8).toFixed(1)}" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#5e5141">${f0(p.w)}</text>`;
  out += `<text transform="rotate(-90 ${(ox+rw+14).toFixed(1)} ${(oy+rh/2).toFixed(1)})" x="${(ox+rw+14).toFixed(1)}" y="${(oy+rh/2).toFixed(1)}" text-anchor="middle" font-size="14" font-family="Consolas,monospace" fill="#5e5141">${f0(p.h)}</text>`;
  /* edge banding */
  if(p.edgeMode==='all'){
    out += wavyLine(ox,oy,ox+rw,oy)+wavyLine(ox+rw,oy,ox+rw,oy+rh)+wavyLine(ox+rw,oy+rh,ox,oy+rh)+wavyLine(ox,oy+rh,ox,oy);
  } else if(p.edgeMode){
    const front = ()=>wavyLine(ox,oy+rh,ox+rw,oy+rh);
    if(p.edgeMode==='front_lr'){ out += front()+wavyLine(ox,oy,ox,oy+rh)+wavyLine(ox+rw,oy,ox+rw,oy+rh); }
    else if(p.edgeMode==='front_l'){ out += front()+wavyLine(ox,oy,ox,oy+rh); }
    else if(p.edgeMode==='front_r'){ out += front()+wavyLine(ox+rw,oy,ox+rw,oy+rh); }
    else if(p.edgeMode==='front'){ out += front(); }
  }
  /* bottom: no holes in the end; all holes are in the face, 3 sides,
     plus rows at internal partitions in a solid carcass */
  if(p.role==='bottom'){
    const cps=[], dps=[];
    const seq=L=>{
      for(let d=32; d<=L/2; d+=352){ cps.push(d, L-d); dps.push(d+32, L-(d+32)); }
    };
    const uniq=a=>Array.from(new Set(a.map(v=>Math.round(v)))).filter(v=>v>=0 && v<=Math.max(p.w,p.h));
    const face=(x,y,kind)=>{
      if(kind==='c') return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#fff" stroke="#7d6a50" stroke-width=".9"/><path d="M${(x-1.6).toFixed(1)},${(y-1.6).toFixed(1)}L${(x+1.6).toFixed(1)},${(y+1.6).toFixed(1)}M${(x+1.6).toFixed(1)},${(y-1.6).toFixed(1)}L${(x-1.6).toFixed(1)},${(y+1.6).toFixed(1)}" stroke="#7d6a50" stroke-width=".7"/>`;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.3" fill="#fff" stroke="#7d6a50" stroke-width=".9"/>`;
    };
    const drawRow=(fix,vals,vertical)=>{
      const cs=uniq(vals.c), ds=uniq(vals.d);
      cs.forEach(v=>out += vertical ? face(fix,Y(v),'c') : face(X(v),fix,'c'));
      ds.forEach(v=>out += vertical ? face(fix,Y(v),'d') : face(X(v),fix,'d'));
    };
    /* left and right edges, along depth */
    cps.length=0; dps.length=0; seq(p.h);
    drawRow(ox+7,{c:cps,d:dps},true);
    drawRow(ox+rw-7,{c:cps,d:dps},true);
    /* back edge, along length */
    cps.length=0; dps.length=0; seq(p.w);
    drawRow(oy+7,{c:cps,d:dps},false);
    /* internal partitions in a solid bottom */
    if(!M.modular){
      M.uprights.filter(u=>u.kind!=='side').forEach(u=>{
        const x=X((u.x0+u.x1)/2);
        cps.length=0; dps.length=0; seq(p.h);
        uniq(cps).forEach(v=>out+=face(x,Y(v),'c'));
        uniq(dps).forEach(v=>out+=face(x,Y(v),'d'));
      });
    }
  /* cup holes in doors */
  } else if(p.role==='door'){
    const ys = [100, p.h-100];
    const cx = X(22), rr = Math.max(4, 17.5*sc);
    ys.forEach((yy,i)=>{
      const cy = Y(yy);
      out += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${rr.toFixed(1)}" fill="#fff" stroke="#7d6a50" stroke-width="1"/>`;
      out += `<path d="M${(cx-rr*0.7).toFixed(1)},${cy.toFixed(1)}L${(cx+rr*0.7).toFixed(1)},${cy.toFixed(1)}M${cx.toFixed(1)},${(cy-rr*0.7).toFixed(1)}L${cx.toFixed(1)},${(cy+rr*0.7).toFixed(1)}" stroke="#7d6a50" stroke-width=".8"/>`;
      if(i===0) out += `<text x="${(cx+rr+4).toFixed(1)}" y="${(cy+3).toFixed(1)}" font-size="8" font-family="Consolas,monospace" fill="#7d6a50">Ø35</text>`;
    });
    out += `<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" font-family="Segoe UI" fill="#8a7b66">${LANG==='en'?'Ø35 cup, 22 mm from edge':'чашка Ø35, 22 мм от кромки'}</text>`;
  } else if(p.role==='intop'){
    /* front edge is banded; the other three sides are drilled in the end.
       In a solid carcass there are also face holes under the internal uprights. */
    const seq=L=>{
      const c=[], d=[];
      for(let x=32; x<=L/2; x+=352){ c.push(x, L-x); d.push(x+32, L-(x+32)); }
      const uniq=a=>Array.from(new Set(a.map(v=>Math.round(v)))).filter(v=>v>=0 && v<=L);
      return {c:uniq(c), d:uniq(d)};
    };
    const dashX=(x,y,len)=>out += `<line x1="${(x-len/2).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+len/2).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#7d6a50" stroke-width="2.4"/>`;
    const dashY=(x,y,len)=>out += `<line x1="${x.toFixed(1)}" y1="${(y-len/2).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y+len/2).toFixed(1)}" stroke="#7d6a50" stroke-width="2.4"/>`;
    /* left and right ends: long = confirmat, short = dowel */
    const hh=seq(p.h), ww=seq(p.w);
    hh.c.forEach(v=>{ dashX(ox, Y(v), 8); dashX(ox+rw, Y(v), 8); });
    hh.d.forEach(v=>{ dashX(ox, Y(v), 4); dashX(ox+rw, Y(v), 4); });
    /* back end */
    ww.c.forEach(v=>{ dashY(X(v), oy, 8); });
    ww.d.forEach(v=>{ dashY(X(v), oy, 4); });
    /* solid: face holes under internal uprights */
    if(!M.modular){
      M.uprights.filter(u=>u.kind!=='side').forEach(u=>{
        const x=X((u.x0+u.x1)/2);
        [32, p.h-32].forEach(y=>{
          out += `<circle cx="${x.toFixed(1)}" cy="${Y(y).toFixed(1)}" r="2.6" fill="#fff" stroke="#7d6a50" stroke-width=".9"/>`;
        });
      });
    }
    out += `<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" font-family="Segoe UI" fill="#8a7b66">${LANG==='en'?'3 sides in the end; 32 / 32 / 352 mm':'3 стороны в торец; 32 / 32 / 352 мм'}${M.modular ? '' : (LANG==='en'?' + face under uprights':' + пласти под стойки')}</text>`;
  } else if(p.role==='side'){
    /* side: bottom end -> bottom (dashes), top -> inset top (face circles) */
    const seq=L=>{
      const c=[], d=[];
      for(let x=32; x<=L/2; x+=352){ c.push(x, L-x); d.push(x+32, L-(x+32)); }
      const uniq=a=>Array.from(new Set(a.map(v=>Math.round(v)))).filter(v=>v>=0 && v<=L);
      return {c:uniq(c), d:uniq(d)};
    };
    const dash=(x,y,len)=>out += `<line x1="${(x-len/2).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+len/2).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#7d6a50" stroke-width="2.4"/>`;
    const hh=seq(p.h);
    /* bottom end — only one end, holes in the end */
    hh.c.forEach(v=>dash(ox, Y(v), 8));
    hh.d.forEach(v=>dash(ox, Y(v), 4));
    /* top — mating holes in the face for the inset top */
    const fx=ox+rw-10;
    const face=(x,y,kind)=>{
      if(kind==='c') return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="#fff" stroke="#7d6a50" stroke-width=".9"/><path d="M${(x-1.7).toFixed(1)},${(y-1.7).toFixed(1)}L${(x+1.7).toFixed(1)},${(y+1.7).toFixed(1)}M${(x+1.7).toFixed(1)},${(y-1.7).toFixed(1)}L${(x-1.7).toFixed(1)},${(y+1.7).toFixed(1)}" stroke="#7d6a50" stroke-width=".7"/>`;
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.4" fill="#fff" stroke="#7d6a50" stroke-width=".9"/>`;
    };
    hh.c.forEach(v=>out += face(fx, Y(v), 'c'));
    hh.d.forEach(v=>out += face(fx, Y(v), 'd'));
    /* back — inset back panel, so holes are in the side face */
    const ww=seq(p.w);
    ww.c.forEach(v=>out += face(X(v), oy+9, 'c'));
    ww.d.forEach(v=>out += face(X(v), oy+9, 'd'));
    out += `<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" font-family="Segoe UI" fill="#8a7b66">${LANG==='en'?'bottom: end; top/back: face':'низ: торец; верх и зад: пласть'}</text>`;
  } else if(p.role==='part'){
    /* internal upright: both ends are drilled in the end */
    const seq=L=>{
      const c=[], d=[];
      for(let x=32; x<=L/2; x+=352){ c.push(x, L-x); d.push(x+32, L-(x+32)); }
      const uniq=a=>Array.from(new Set(a.map(v=>Math.round(v)))).filter(v=>v>=0 && v<=L);
      return {c:uniq(c), d:uniq(d)};
    };
    const dash=(x,y,len)=>out += `<line x1="${(x-len/2).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+len/2).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#7d6a50" stroke-width="2.4"/>`;
    const hh=seq(p.h);
    hh.c.forEach(v=>{ dash(ox, Y(v), 8); dash(ox+rw, Y(v), 8); });
    hh.d.forEach(v=>{ dash(ox, Y(v), 4); dash(ox+rw, Y(v), 4); });
    /* rear end: holes into the end for the inset back panel */
    const dashY=(x,y,len)=>out += `<line x1="${x.toFixed(1)}" y1="${(y-len/2).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y+len/2).toFixed(1)}" stroke="#7d6a50" stroke-width="2.4"/>`;
    const ww=seq(p.w);
    ww.c.forEach(v=>dashY(X(v), oy, 8));
    ww.d.forEach(v=>dashY(X(v), oy, 4));
    out += `<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" font-family="Segoe UI" fill="#8a7b66">${LANG==='en'?'both ends + rear end: long confirmat / short dowel':'оба торца + задний торец: длинный конфирмат / короткий шкант'}</text>`;
  } else if(p.role==='back'){
    /* back: bottom end (dashes) + face holes at the top under the inset top */
    const seq=L=>{
      const c=[], d=[];
      for(let x=32; x<=L/2; x+=352){ c.push(x, L-x); d.push(x+32, L-(x+32)); }
      const uniq=a=>Array.from(new Set(a.map(v=>Math.round(v)))).filter(v=>v>=0 && v<=L);
      return {c:uniq(c), d:uniq(d)};
    };
    const dash=(x,y,len)=>out += `<line x1="${x.toFixed(1)}" y1="${(y-len/2).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y+len/2).toFixed(1)}" stroke="#7d6a50" stroke-width="2.4"/>`;
    const ww=seq(p.w);
    ww.c.forEach(v=>dash(X(v), oy+rh, 8));
    ww.d.forEach(v=>dash(X(v), oy+rh, 4));
    /* left and right ends into the sides */
    const hh=seq(p.h);
    const dashX=(x,y,len)=>out += `<line x1="${(x-len/2).toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x+len/2).toFixed(1)}" y2="${y.toFixed(1)}" stroke="#7d6a50" stroke-width="2.4"/>`;
    hh.c.forEach(v=>{ dashX(ox, Y(v), 8); dashX(ox+rw, Y(v), 8); });
    hh.d.forEach(v=>{ dashX(ox, Y(v), 4); dashX(ox+rw, Y(v), 4); });
    ww.c.forEach(v=>out += `<circle cx="${X(v).toFixed(1)}" cy="${(oy+9).toFixed(1)}" r="2.7" fill="#fff" stroke="#7d6a50" stroke-width=".9"/><path d="M${(X(v)-1.6).toFixed(1)},${(oy+7.4).toFixed(1)}L${(X(v)+1.6).toFixed(1)},${(oy+10.6).toFixed(1)}M${(X(v)+1.6).toFixed(1)},${(oy+7.4).toFixed(1)}L${(X(v)-1.6).toFixed(1)},${(oy+10.6).toFixed(1)}" stroke="#7d6a50" stroke-width=".7"/>`);
    ww.d.forEach(v=>out += `<circle cx="${X(v).toFixed(1)}" cy="${(oy+9).toFixed(1)}" r="2.3" fill="#fff" stroke="#7d6a50" stroke-width=".9"/>`);
    /* face holes by number of uprights */
    const stands = M.modular ? 2 : M.uprights.length;
    const xs = M.modular
      ? [32, p.w-32]
      : M.uprights.map(u=>Math.max(32, Math.min(p.w-32, (u.x0+u.x1)/2 - M.T)));
    const yMid = oy + rh/2;
    xs.forEach(x=>{
      out += `<circle cx="${X(x).toFixed(1)}" cy="${yMid.toFixed(1)}" r="2.8" fill="#fff" stroke="#7d6a50" stroke-width=".9"/><path d="M${(X(x)-1.7).toFixed(1)},${(yMid-1.7).toFixed(1)}L${(X(x)+1.7).toFixed(1)},${(yMid+1.7).toFixed(1)}M${(X(x)+1.7).toFixed(1)},${(yMid-1.7).toFixed(1)}L${(X(x)-1.7).toFixed(1)},${(yMid+1.7).toFixed(1)}" stroke="#7d6a50" stroke-width=".7"/>`;
    });
    out += `<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" font-family="Segoe UI" fill="#8a7b66">${LANG==='en'?`bottom/sides: end; top: face; uprights: ${stands}`:`низ и бока: торец; верх: пласть; стоек: ${stands}`}</text>`;
  } else if(p.role==='shelf'){
    /* shelf pins in the face */
    [[32,32],[p.w-32,32],[32,p.h-32],[p.w-32,p.h-32]].forEach(([x,y])=>{
      out += `<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="2.8" fill="#fff" stroke="#7d6a50" stroke-width=".9"/>`;
    });
    out += `<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" font-family="Segoe UI" fill="#8a7b66">${LANG==='en'?'4 shelf pins':'4 полкодержателя'}</text>`;
  } else {
    out += `<text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="12" font-family="Segoe UI" fill="#8a7b66">${LANG==='en'?'no drilling':'без присадки'}</text>`;
  }
  return `<div style="width:100%;margin:0 0 26px">
    <div style="font:700 15px/1.2 inherit;color:var(--tx);margin-bottom:3px">${p.id}. ${tstr(p.name)}</div>
    <div style="font:400 12.5px/1.3 inherit;color:var(--tx3);margin-bottom:6px">${p.qty} ${pcs} · ${p.edge ? (LANG==='en'?'with edge':'с кромкой') : (LANG==='en'?'finished size':'чистовой размер')} ${f0(p.w)} × ${f0(p.h)}${p.edge ? ' · ' + tstr('Кромка') + ' ' + f1(p.edge) + (edgeSides(p.edgeMode)>1?' × '+edgeSides(p.edgeMode):'') : ''}</div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" xmlns="http://www.w3.org/2000/svg">${out}</svg>
  </div>`;
}

function downloadCSV(){
  const M = MODEL;
  const rows = [LANG==='en'
    ? ['№','Part','Finished length, mm','Finished width, mm','Cut length, mm','Cut width, mm','Edge, mm','Qty','Area, m²','Note']
    : ['№','Деталь','Длина, мм','Ширина, мм','Заготовка, длина, мм','Заготовка, ширина, мм','Кромка, мм','Кол-во','Площадь, м²','Примечание']];
  M.parts.forEach(p=>rows.push([p.id,tstr(p.name),Math.round(p.w),Math.round(p.h),p.cutW,p.cutH,
    p.edge ? `${p.edge}${edgeSides(p.edgeMode)>1?'×'+edgeSides(p.edgeMode):''}` : '',p.qty,(p.cutW*p.cutH*p.qty/1e6).toFixed(3),tstr(p.note)]));
  rows.push([]);
  rows.push([LANG==='en' ? 'Total area, m²' : 'Итого площади, м²', M.area.toFixed(3)]);
  rows.push([LANG==='en' ? `Sheets ${M.SW}x${M.SH}` : `Листов ${M.SW}x${M.SH}`, M.sheets.length]);
  rows.push([LANG==='en' ? 'Design weight, kg' : 'Расчётный вес, кг', Math.round(M.wDesign)]);
  const csv = String.fromCharCode(65279) + rows.map(r=>r.join(';')).join(String.fromCharCode(13,10));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = LANG==='en' ? 'cutting-stand.csv' : 'раскрой-тумба.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

    <h2 class="ct" style="margin-top:26px">${tstr('Инструменты')}</h2>
    <ul class="tools">${tools.map(x=>`<li>${x}</li>`).join('')}</ul>
    <h2 class="ct" style="margin-top:26px">${tstr('Сборка')}</h2>
    <ol class="steps">${steps.map(([h,p])=>`<li><h5>${tstr(h)}</h5><p>${p}</p></li>`).join('')}</ol>
    <div class="warnbox" style="border-color:#e6e7ec;background:#f8f9fb;color:#5b616b">
      ${purpose('Uprights carry the weight in compression; the fasteners only resist shear. Put a 5–10 mm mat under the aquarium.','Стойки передают вес сжатием, крепёж держит только от сдвига. Под аквариум — подложка 5–10 мм.')}
    </div>`;

}

function renderView(M){
  const tabs = [
    ['tumba', LANG==='en' ? 'Stand' : 'Тумба'],
    ['frame', LANG==='en' ? 'Frame' : 'Каркас'],
    ['front', LANG==='en' ? 'Front' : 'Спереди'],
    ['side', LANG==='en' ? 'Side' : 'Сбоку'],
    ['detail', LANG==='en' ? 'Shelf detail' : 'Узел полки']
  ];
  const I = M.idOf, leg = [];
  const addLeg = (n, t) => { if(n) leg.push([n, `${n} — ${t}`]); };
  addLeg(I.top, tstr('крышка накладная'));
  addLeg(I.intop, tstr('крышка вкладная'));
  addLeg(I.side, tstr('боковина'));
  addLeg(I.part, tstr('стойка'));
  addLeg(I.bottom, tstr('дно'));
  addLeg(I.back, tstr('задняя стенка'));
  addLeg(I.shelf, tstr('полка'));
  leg.sort((a,b)=>a[0]-b[0]);
  const legTxt = leg.map(x=>x[1]).join(' · ');

  const caps = {
    tumba: LANG==='en'
      ? `${M.modular ? `${M.modules.length} modules` : `${M.n} section${M.n===1?'':'s'} of ${f0(M.pitch)} mm`}. Doors ${f0(M.doorW)}×${f0(M.doorH)}. Top panel ${f0(M.topW)}×${f0(M.topD)}. Height ${M.H}.`
      : `${M.modular ? `${M.modules.length} модулей` : `${M.n} ${pl(M.n,'секция','секции','секций')} по ${f0(M.pitch)} мм`}. Дверцы ${f0(M.doorW)}×${f0(M.doorH)}. Крышка ${f0(M.topW)}×${f0(M.topD)}. Высота ${M.H}.`,
    frame: LANG==='en'
      ? `${legTxt}. Doors removed (${M.doorN} pcs), top raised, feet not shown.`
      : `${legTxt}. Сняты дверцы (${M.doorN} шт), крышка поднята, опоры не показаны.`,
    front: LANG==='en'
      ? `Bays ${f0(M.clear)}. Door gap ${K.DGAP} mm. Shadow line ${K.TGAP} mm. Height ${M.H}.`
      : `Секции ${f0(M.clear)}. Зазор дверец ${K.DGAP} мм. Теневая линия ${K.TGAP} мм. Высота ${M.H}.`,
    side: LANG==='en'
      ? `Depth ${f0(M.D)}. Door ${M.T}, carcass ${f0(M.C)}. Shelf ${f0(M.parts.find(p=>p.role==='shelf').w)}×${f0(M.parts.find(p=>p.role==='shelf').h)} at ${f0(M.shelfZ0)} mm.`
      : `Глубина ${f0(M.D)}. Дверца ${M.T}, корпус ${f0(M.C)}. Полка ${f0(M.parts.find(p=>p.role==='shelf').w)}×${f0(M.parts.find(p=>p.role==='shelf').h)} на ${f0(M.shelfZ0)} мм.`,
    detail: ``
  };
  $('#vtabs').innerHTML = tabs.map(([k,n])=>`<button data-tab="${k}" class="${state.tab===k?'on':''}">${n}</button>`).join('');
  $('#vtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.tab=b.dataset.tab;
    history.replaceState(null,'','#'+state.tab);
    renderView(MODEL);
  });
  const capTxt = caps[state.tab] || '';
  $('#vcap').innerHTML = capTxt;
  $('#vcap').style.display = capTxt ? '' : 'none';

  let svg='';
  if(state.tab==='tumba')      svg = drawIso(M, {feet:true, plinth:true, doors:true, tank:true, dims:true, color:state.color});
  else if(state.tab==='frame') svg = drawIso(M, {feet:true, plinth:true, doors:false, tank:false, badges:true, explode:240, color:state.color});
  else if(state.tab==='front') svg = drawFront(M, {color:state.color});
  else if(state.tab==='side')  svg = drawSide(M, {color:state.color});
  else                         svg = drawDetail(M);
  $('#stage').innerHTML = svg;
}

function drawTank(M){
  const W=1000, Hh=520;
  const g=M.glass;
  let s='';
  /* ---- фронт ---- */
  const sF = Math.min(430/M.L, 340/M.Ht);
  const ox = 90 + (470 - M.L*sF)/2, oy = 70 + (340 - M.Ht*sF)/2;
  const X=x=>ox+x*sF, Y=z=>oy+(M.Ht-z)*sF;
  const R=(x0,z0,x1,z1,at)=>`<rect x="${X(x0).toFixed(1)}" y="${Y(z1).toFixed(1)}" width="${((x1-x0)*sF).toFixed(1)}" height="${((z1-z0)*sF).toFixed(1)}" ${at}/>`;
  s += R(0,0,M.L,M.Ht,'fill="rgba(150,215,235,.18)" stroke="#4f9fbb" stroke-width="1.4"');
  s += R(g.w,g.b,M.L-g.w,M.hw,'fill="rgba(70,150,180,.26)"');
  s += R(g.w,g.b,M.L-g.w,M.soilD,'fill="#5c4b38"');
  if(g.ribs) s += R(0,M.Ht-22,M.L,M.Ht,'fill="none" stroke="#8d9096" stroke-width="2" stroke-dasharray="7 4"');
  if(g.braces){
    for(let i=1;i<=g.braces;i++){
      const x=M.L*i/(g.braces+1);
      s += `<line x1="${X(x).toFixed(1)}" y1="${Y(M.Ht).toFixed(1)}" x2="${X(x).toFixed(1)}" y2="${Y(M.Ht-34).toFixed(1)}" stroke="#5b6068" stroke-width="3"/>`;
    }
  }
  /* размеры */
  s += `<line x1="${X(0)}" y1="${Y(0)+30}" x2="${X(M.L)}" y2="${Y(0)+30}" stroke="#b3b9c4"/>`;
  s += `<text x="${(X(0)+X(M.L))/2}" y="${Y(0)+44}" class="lbl" text-anchor="middle">${f0(M.L)}</text>`;
  s += `<line x1="${X(0)-34}" y1="${Y(0)}" x2="${X(0)-34}" y2="${Y(M.Ht)}" stroke="#b3b9c4"/>`;
  s += `<text x="${X(0)-40}" y="${(Y(0)+Y(M.Ht))/2}" class="lbl" text-anchor="end">${f0(M.Ht)}</text>`;
  /* выноски */
  s += `<text x="${X(M.L)-4}" y="${Y(M.hw)-8}" class="lbl2" text-anchor="end">${LANG==='en' ? 'water' : 'вода'} ${f0(M.hw)}</text>`;

  /* ---- план ---- */
  const px=650, py=90, pw=300, ph=250;
  const sP = Math.min(pw/M.L, ph/M.D);
  const PX=x=>px+(pw-M.L*sP)/2+x*sP, PZ=y=>py+(ph-M.D*sP)/2+y*sP;
  const Q=(x0,y0,x1,y1,at)=>`<rect x="${PX(x0).toFixed(1)}" y="${PZ(y0).toFixed(1)}" width="${((x1-x0)*sP).toFixed(1)}" height="${((y1-y0)*sP).toFixed(1)}" ${at}/>`;
  s += `<text x="${px}" y="${py-16}" class="sub">${LANG==='en' ? 'plan' : 'план'}</text>`;
  s += Q(0,0,M.L,M.D,'fill="rgba(150,215,235,.10)" stroke="#4f9fbb" stroke-width="1.2"');
  s += Q(g.w,g.w,M.L-g.w,M.D-g.w,'fill="none" stroke="#7fc0d6" stroke-width="1" stroke-dasharray="4 3"');
  if(g.braces){
    for(let i=1;i<=g.braces;i++){
      const x=M.L*i/(g.braces+1);
      s += `<line x1="${PX(x).toFixed(1)}" y1="${PZ(0).toFixed(1)}" x2="${PX(x).toFixed(1)}" y2="${PZ(M.D).toFixed(1)}" stroke="#5b6068" stroke-width="2.5"/>`;
    }
  }
  s += `<text x="${PX(M.L/2)}" y="${PZ(M.D)+22}" class="lbl" text-anchor="middle">${f0(M.L)}</text>`;
  s += `<text x="${PX(M.L)+10}" y="${PZ(M.D/2)}" class="lbl">${f0(M.D)}</text>`;
  s += `<text x="${px}" y="${py+ph+48}" class="lbl2">${LANG==='en' ? `glass ${g.w} mm, bottom ${g.b} mm${g.braces ? ', braces '+g.braces : ''}` : `стекло ${g.w} мм, дно ${g.b} мм${g.braces ? ', стяжек '+g.braces : ''}`}</text>`;
  return svgWrap(W,Hh,s);
}

/* ---------- стеклянные детали: фронт + план ---------- */
function glassPartsHtml(M){
  const P = M.glassParts;
  const rows = P.rows.map(function(r){
    const k = Math.min(150 / Math.max(r.w, 1), 120 / Math.max(r.h, 1));

      + '<div style="height:132px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px">'
      + '<div style="width:' + w + 'px;height:' + h + 'px;border:1.5px solid #7fc0d6;background:rgba(150,215,235,.16);border-radius:3px"></div>'
      + '</div>'
      + '<div style="font:600 13px/1.25 inherit;color:var(--tx)">' + r.key + '</div>'
      + '<div style="font:400 13px/1.25 var(--mono);color:var(--tx2);margin-top:3px">' + f0(r.w) + ' × ' + f0(r.h) + '</div>'

function drawGlass(M){
  const W=1000, Hh=640;
  const g=M.glass, P=M.glassParts;
  const tW=g.w, tB=g.b, sn=P.seam;

  /* ---- фронтальная проекция ---- */
  const fx=96, fw=560, fy=60, fh=290;
  const sF=Math.min(fw/M.L, fh/M.Ht);
  const ox=fx+(fw-M.L*sF)/2, oy=fy+(fh-M.Ht*sF)/2;
  const X=x=>ox+x*sF, Y=z=>oy+(M.Ht-z)*sF;
  const RX=(x0,z0,x1,z1,at)=>`<rect x="${X(x0).toFixed(1)}" y="${Y(z1).toFixed(1)}" width="${Math.max(.6,(x1-x0)*sF).toFixed(1)}" height="${Math.max(.6,(z1-z0)*sF).toFixed(1)}" ${at}/>`;
  const tck=(x1,y1,x2,y2)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#b3b9c4"/>`;
  const swF=Math.max(1.5, sn*sF);

  let s='';
  s += `<text x="${fx}" y="${fy-18}" class="sub">${LANG==='en' ? 'front' : 'фронт'}</text>`;
  s += RX(0,0,M.L,M.Ht,'fill="rgba(150,215,235,.10)" stroke="#4f9fbb" stroke-width="1.2"');
  s += RX(0,0,M.L,tB,'fill="#c9e3ed" stroke="#7fb6c9" stroke-width=".9"');
  s += RX(0,tB,tW,M.Ht,'fill="#dceff6" stroke="#7fb6c9" stroke-width=".9"');
  s += RX(M.L-tW,tB,M.L,M.Ht,'fill="#dceff6" stroke="#7fb6c9" stroke-width=".9"');
  s += RX(tW+sn,tB,M.L-tW-sn,M.Ht,'fill="rgba(168,222,240,.34)" stroke="#4f9fbb" stroke-width="1"');
  s += `<rect x="${X(tW).toFixed(1)}" y="${Y(M.Ht).toFixed(1)}" width="${swF.toFixed(1)}" height="${Math.max(1,(M.Ht-tB)*sF).toFixed(1)}" fill="#d6dbe4"/>`;
  s += `<rect x="${(X(M.L-tW)-swF).toFixed(1)}" y="${Y(M.Ht).toFixed(1)}" width="${swF.toFixed(1)}" height="${Math.max(1,(M.Ht-tB)*sF).toFixed(1)}" fill="#d6dbe4"/>`;

  /* общая высота */
  const dL=X(0)-44, midY=(Y(0)+Y(M.Ht))/2;
  s += tck(dL,Y(0),dL,Y(M.Ht));
  s += tck(dL-4,Y(0),dL+4,Y(0));
  s += tck(dL-4,Y(M.Ht),dL+4,Y(M.Ht));
  s += `<text transform="rotate(-90 ${(dL-10).toFixed(1)} ${midY.toFixed(1)})" x="${(dL-10).toFixed(1)}" y="${midY.toFixed(1)}" class="lbl" text-anchor="middle">Ht ${f0(M.Ht)}</text>`;

  /* высота стенки */
  const dR=X(M.L)+46, midW=(Y(tB)+Y(M.Ht))/2;
  s += tck(dR,Y(tB),dR,Y(M.Ht));
  s += tck(dR-4,Y(tB),dR+4,Y(tB));
  s += tck(dR-4,Y(M.Ht),dR+4,Y(M.Ht));
  s += `<text x="${(dR+8).toFixed(1)}" y="${midW.toFixed(1)}" class="lbl" text-anchor="start" dominant-baseline="central">Ht−tB ${f0(P.wallH)}</text>`;

  /* длина передней/задней детали */
  const dy=Y(0)+32, xa=X(tW+sn), xb=X(M.L-tW-sn);
  s += tck(xa,dy,xb,dy);
  s += tck(xa,dy-4,xa,dy+4);
  s += tck(xb,dy-4,xb,dy+4);
  s += `<text x="${((xa+xb)/2).toFixed(1)}" y="${(dy+15).toFixed(1)}" class="lbl" text-anchor="middle">L−2tW−2g ${f0(P.frontW)}</text>`;

  /* ---- вид сверху ---- */
  const px=96, pw=430, py=430, ph=160;
  const sP=Math.min(pw/M.L, ph/M.D);
  const PX=x=>px+(pw-M.L*sP)/2+x*sP, PZ=y=>py+(ph-M.D*sP)/2+y*sP;
  const Q=(x0,y0,x1,y1,at)=>`<rect x="${PX(x0).toFixed(1)}" y="${PZ(y0).toFixed(1)}" width="${Math.max(.6,(x1-x0)*sP).toFixed(1)}" height="${Math.max(.6,(y1-y0)*sP).toFixed(1)}" ${at}/>`;
  const swP=Math.max(1.6, sn*sP), hP=Math.max(3, tW*sP);
  s += `<text x="${px}" y="${py-16}" class="sub">${LANG==='en' ? 'plan' : 'план'}</text>`;
  s += Q(0,0,M.L,M.D,'fill="rgba(150,215,235,.08)" stroke="#4f9fbb" stroke-width="1.2"');
  s += Q(0,0,tW,M.D,'fill="#dceff6" stroke="#7fb6c9" stroke-width=".9"');
  s += Q(M.L-tW,0,M.L,M.D,'fill="#dceff6" stroke="#7fb6c9" stroke-width=".9"');
  s += Q(tW+sn,0,M.L-tW-sn,tW,'fill="rgba(168,222,240,.34)" stroke="#4f9fbb" stroke-width="1"');
  s += Q(tW+sn,M.D-tW,M.L-tW-sn,M.D,'fill="rgba(168,222,240,.34)" stroke="#4f9fbb" stroke-width="1"');
  s += `<rect x="${PX(tW).toFixed(1)}" y="${PZ(0).toFixed(1)}" width="${swP.toFixed(1)}" height="${hP.toFixed(1)}" fill="#d6dbe4"/>`;
  s += `<rect x="${PX(tW).toFixed(1)}" y="${(PZ(M.D)-hP).toFixed(1)}" width="${swP.toFixed(1)}" height="${hP.toFixed(1)}" fill="#d6dbe4"/>`;
  s += `<rect x="${(PX(M.L-tW)-swP).toFixed(1)}" y="${PZ(0).toFixed(1)}" width="${swP.toFixed(1)}" height="${hP.toFixed(1)}" fill="#d6dbe4"/>`;
  s += `<rect x="${(PX(M.L-tW)-swP).toFixed(1)}" y="${(PZ(M.D)-hP).toFixed(1)}" width="${swP.toFixed(1)}" height="${hP.toFixed(1)}" fill="#d6dbe4"/>`;

  /* глубина боковины */
  const dX=PX(M.L)+24, dY0=PZ(0), dY1=PZ(M.D);
  s += tck(dX,dY0,dX,dY1);
  s += tck(dX-4,dY0,dX+4,dY0);
  s += tck(dX-4,dY1,dX+4,dY1);
  s += `<text x="${(dX+8).toFixed(1)}" y="${((dY0+dY1)/2).toFixed(1)}" class="lbl" text-anchor="start" dominant-baseline="central">D ${f0(M.D)}</text>`;

  /* длина */
  const yL=PZ(M.D)+26;
  s += tck(PX(0),yL,PX(M.L),yL);
  s += tck(PX(0),yL-4,PX(0),yL+4);
  s += tck(PX(M.L),yL-4,PX(M.L),yL+4);
  s += `<text x="${((PX(0)+PX(M.L))/2).toFixed(1)}" y="${(yL+15).toFixed(1)}" class="lbl" text-anchor="middle">L ${f0(M.L)}</text>`;

  /* условные обозначения */
  const lx=640;
  const lg=(y,fill,txt,st)=>`<rect x="${lx}" y="${y}" width="13" height="9" rx="2" fill="${fill}" stroke="${st||'#8fb9c9'}" stroke-width=".8"/><text x="${lx+19}" y="${y+8}" class="lbl2">${txt}</text>`;
  s += `<text x="${lx}" y="440" class="sub">${LANG==='en' ? 'parts' : 'детали'}</text>`;
  s += lg(452,'#c9e3ed',tstr('Дно'));
  s += lg(476,'#dceff6',tstr('Боковина'));
  s += lg(500,'rgba(168,222,240,.34)',LANG==='en' ? 'front & back' : 'передняя и задняя');
  s += lg(524,'#d6dbe4',LANG==='en' ? 'silicone seam' : 'силиконовый шов','#aab1bd');
  s += `<text x="${lx}" y="560" class="lbl2">${LANG==='en' ? 'wall height = Ht − tB' : 'высота стенки = Ht − tB'}</text>`;

  return svgWrap(W,Hh,s);
}

function renderTank(M){
  const g = M.glass;
  const gp = M.glassParts;
  const cell = (k,v) => `<div><dt>${tstr(k)}</dt><dd>${v}</dd></div>`;
  const gpNum = v => LANG === 'en' ? String(v) : String(v).replace('.', ',');
  const gpQty = n => `${n} ${LANG==='en' ? (n===1 ? 'pc' : 'pcs') : 'шт'}`;
  const gpRows = gp.rows.map(r=>{
    const note = r.seamNote
      ? `${tstr(r.note)}, ${LANG==='en' ? 'seam' : 'шов'} ${gpNum(gp.seam)} ${tstr('мм')}`
      : tstr(r.note);
    return `<tr><td>${tstr(r.key)}</td><td class="num">${f0(r.w)} × ${f0(r.h)}</td><td class="num">${gpQty(r.qty)}</td><td class="mut">${note}</td></tr>`;
  }).join('');
  const gpScheme = LANG === 'en'
    ? `Scheme: walls on the bottom${gp.big ? ', extra-strong bottom seam' : ''}`
    : `Схема: стенки на дне${gp.big ? ', шов по низу усиленный' : ''}`;
  const gpWarn = [];
  if(gp.big) gpWarn.push(LANG === 'en'
    ? 'Butt joints are not used: the edges are ground and the bottom sits on a tray.'
    : 'Встык не применяется — кромки шлифуются, низ сажается на поддон.');
  if(gp.huge) gpWarn.push(LANG === 'en'
    ? 'Top rim bracing and cross-braces are required; without them the lid and the walls will not hold.'
    : 'Требуется отбортовка по верху и стяжки; без них крышка и стенки не держат.');
  const gpWarnHtml = gpWarn.length ? `<div class="warnbox">${gpWarn.join('<br>')}</div>` : '';
  const soilRows = M.SOILS.map(([name, rho])=>{
    const cells = [30,50,70].map(d=>`<td class="num">${f0(M.soilV(d)*rho)} ${tstr('кг')}</td>`).join('');
    return `<tr><td>${tstr(name)}<span class="mut"> · ${f1(rho)} ${tstr('кг/л')}</span></td>${cells}</tr>`;
  }).join('');

  const specHtml = LANG === 'en' ? `<p><b>How to read.</b> Below is the full glass calculation. First the meaning and assumptions, then the formulas. Dimensions are in mm, stresses in MPa, masses in kg. Symbols: L, D, Ht — external length, depth and height; t<sub>w</sub> — wall thickness; t<sub>b</sub> — bottom thickness; h<sub>w</sub> — water level; s<sub>s</sub> — seam; β — shape coefficient; σ — stress; n — safety factor.</p>

<h3>1. Water and dimensions.</h3><p> Water level h<sub>w</sub> = max(120, Ht − 30) mm. The 30 mm is freeboard: water must not reach the rim. Internal dimensions: L<sub>i</sub> = L − 2t<sub>w</sub>, D<sub>i</sub> = D − 2t<sub>w</sub>. Water pressure grows with depth, so the calculation uses h<sub>w</sub>, not the full height Ht. Densities: glass 2500 kg/m³, water 1000 kg/m³, substrate from the table; g = 9.81 m/s².</p>

<h3>2. Where the stress comes from.</h3><p> The wall is treated as a plate supported on three sides: the bottom and the two side edges. The longer the span and the deeper the water, the greater the bending moment. The bending strength of sheet glass is σ<sub>b</sub> = 40 MPa. The safety factor n = 3.8 is an engineering margin: it covers the error of the empirical formula, load unevenness and ageing; it is not a manufacturer's datasheet. Allowable stress σ<sub>a</sub> = 40 / 3.8 = 10.53 MPa = 10.53·10<sup>6</sup> Pa. Empirical coefficient β<sub>0</sub> = 0.15. Required thickness without reinforcement:</p>
<p><code>s<sub>0</sub> = (L/1000) · √(β<sub>0</sub> · 1000 · g · (h<sub>w</sub>/1000) / σ<sub>a</sub>) · 1000</code></p>
<p>With rim bracing and cross-braces: β = β<sub>0</sub> · k<sub>r</sub> · k<sub>b</sub>, k<sub>r</sub> = 0.8, k<sub>b</sub> = 0.7. Then s<sub>req</sub> is the same formula with β. Actual stress at the selected t<sub>w</sub>:</p>
<p><code>σ = β · 1000 · g · (h<sub>w</sub>/1000) · (L/1000)<sup>2</sup> / (t<sub>w</sub>/1000)<sup>2</sup></code></p>
<p>σ is in Pa; divide by 10<sup>6</sup> for MPa. Actual safety n<sub>f</sub> = 40 / σ. If n<sub>f</sub> &lt; 3.8, the thickness is insufficient. Glass deflection is not calculated separately in this model: the criterion is stress.</p>

<h3>3. Thickness selection.</h3><p> Standard thickness series: 4, 5, 6, 8, 10, 12, 15, 19, 24 mm; thinner sheets are not considered. t<sub>w</sub> is the first value ≥ s<sub>req</sub>. t<sub>b</sub> is the first ≥ max(t<sub>w</sub> + 2, s<sub>req</sub> + 2). Why the bottom is thicker: the walls stand on it, the lower seam is more loaded and the bending moment near the bottom is higher. Why a series rather than an arbitrary number: sheet glass is made in standard thicknesses. If s<sub>req</sub> > 24 mm, the calculation is capped at 24 mm — a technologist is needed.</p>

<h3>4. Rim bracing, cross-braces, partitions.</h3><p> Rim bracing is a 60 mm strip around the top perimeter; it is enabled when L > 800 mm or h<sub>w</sub> > 400 mm: two strips front/back and two at the sides. Cross-braces are transverse 60 mm braces; they are enabled when L ≥ 900 mm, count n<sub>b</sub> = max(1, round(L/700) − 1). They tie the top and reduce the design span, hence k<sub>r</sub> = 0.8 and k<sub>b</sub> = 0.7. Internal partitions are not part of the model: they do not affect thickness selection; their mass and local loads are calculated separately.</p>

<h3>5. Seam and parts.</h3><p> Seam s<sub>s</sub>: 1.5 mm for t<sub>w</sub> ≤ 8; 2 mm for t<sub>w</sub> ≤ 12; 2.5 mm for t<sub>w</sub> > 12; 3 mm when L ≥ 2000 or Ht ≥ 700. The seam depends on glass thickness and size: a thicker sheet and a larger tank need a wider silicone layer. Parts: bottom L × D; sides D × (Ht − t<sub>b</sub>); front and back (L − 2t<sub>w</sub> − 2s<sub>s</sub>) × (Ht − t<sub>b</sub>). The seam is already deducted from the front/back width; do not subtract it again. Wall height is Ht minus bottom thickness.</p>

<h3>6. Weight.</h3><p> Glass mass: m<sub>g</sub> = ((2LHt + 2DHt)t<sub>w</sub> + LD·t<sub>b</sub>) · 10<sup>−9</sup> · 2500. This is an upper estimate: the seam and edges are not deducted. Water volume: V<sub>w</sub> = L<sub>i</sub>D<sub>i</sub>(h<sub>w</sub> − h<sub>s</sub>) · 10<sup>−6</sup> l; water mass equals V<sub>w</sub> in kg. Substrate: V<sub>s</sub> = L<sub>i</sub>D<sub>i</sub>h<sub>s</sub> · 10<sup>−6</sup> l, m<sub>s</sub> = V<sub>s</sub>ρ<sub>s</sub>. Actual weight M = m<sub>g</sub> + V<sub>w</sub> + m<sub>s</sub>. For loads M<sub>design</sub> = 1.1 · M(5 cm substrate) — the maximum; glass and stand use M<sub>design</sub> even when another layer is selected. The 10 % covers hardware, reinforcement and uneven load.</p>

<h3>7. Tolerances and limits.</h3><p> This is an engineering estimate, not a manufacturer's datasheet. Included: safety factor 3.8; +10 % weight; nominal thickness; 30 mm freeboard. Not included: impact and thermal loads, edge quality, silicone strength, sheet thickness tolerance, internal partitions and water dynamics. For L > 1500 mm, have the calculation checked by a glass workshop.</p>

<h3>8. Example 1200 × 500 × 500.</h3><p> The same steps on concrete numbers.</p>

<tbody>
<tr><td>h<sub>w</sub></td><td>470 mm</td></tr>
<tr><td>β</td><td>0.084</td></tr>
<tr><td>s<sub>0</sub> / s<sub>req</sub></td><td>9.73 / 7.28 mm</td></tr>
<tr><td>t<sub>w</sub> / t<sub>b</sub></td><td>8 / 10 mm</td></tr>
<tr><td>σ / n<sub>f</sub></td><td>8.71 MPa / ×4.59</td></tr>
<tr><td>Seam</td><td>1.5 mm</td></tr>
<tr><td>Rim bracing / cross-braces</td><td>yes / 1</td></tr>
<tr><td>Front and back</td><td>1181 × 490 mm</td></tr>
<tr><td>Side</td><td>500 × 490 mm</td></tr>
<tr><td>Glass / water / substrate</td><td>49 / 241 / 43 kg</td></tr>
<tr><td>M / M<sub>design</sub></td><td>333 / 366 kg</td></tr>
</tbody></table>

<h3>9. Calculation order.</h3><p> 1) h<sub>w</sub>; 2) β and s<sub>0</sub>/s<sub>req</sub>; 3) t<sub>w</sub>/t<sub>b</sub>; 4) seam and parts; 5) masses; 6) M and M<sub>design</sub>. If length or water height changes, all steps are recalculated; the thickness may move to the next standard value.</p>` : `<p><b>Как читать.</b> Ниже — полный расчёт стекла. Сначала смысл и допущения, затем формулы. Размеры в мм, напряжения в МПа, массы в кг. Обозначения: L, D, Ht — наружные длина, глубина и высота; t<sub>w</sub> — толщина стенки; t<sub>b</sub> — толщина дна; h<sub>w</sub> — уровень воды; s<sub>ш</sub> — шов; β — коэффициент формы; σ — напряжение; n — запас.</p>

<h3>1. Вода и размеры.</h3><p> Уровень воды h<sub>w</sub> = max(120, Ht − 30) мм. 30 мм — свободный борт: вода не должна доходить до кромки. Внутренние размеры: L<sub>i</sub> = L − 2t<sub>w</sub>, D<sub>i</sub> = D − 2t<sub>w</sub>. Вода давит на стенку тем сильнее, чем глубже, поэтому в расчёт идёт h<sub>w</sub>, а не полная высота Ht. Плотности: стекло 2500 кг/м³, вода 1000 кг/м³, грунт — по таблице; g = 9,81 м/с².</p>

<h3>2. Откуда напряжение.</h3><p> Стенка рассматривается как пластина, опёртая по трём сторонам: низ и две боковые кромки. Чем длиннее пролёт и глубже вода, тем больше изгибающий момент. Предел изгиба листового стекла σ<sub>изг</sub> = 40 МПа. Запас n = 3,8 — инженерный: он покрывает неточность эмпирической формулы, неравномерность нагрузки и старение; это не паспорт производителя. Допускаемое напряжение σ<sub>доп</sub> = 40 / 3,8 = 10,53 МПа = 10,53·10<sup>6</sup> Па. Эмпирический коэффициент β<sub>0</sub> = 0,15. Требуемая толщина без усиления:</p>
<p><code>s<sub>без</sub> = (L/1000) · √(β<sub>0</sub> · 1000 · g · (h<sub>w</sub>/1000) / σ<sub>доп</sub>) · 1000</code></p>
<p>С отбортовкой и стяжками: β = β<sub>0</sub> · k<sub>отб</sub> · k<sub>стяж</sub>, k<sub>отб</sub> = 0,8, k<sub>стяж</sub> = 0,7. Тогда s<sub>нуж</sub> — та же формула с β. Фактическое напряжение при выбранной t<sub>w</sub>:</p>
<p><code>σ = β · 1000 · g · (h<sub>w</sub>/1000) · (L/1000)<sup>2</sup> / (t<sub>w</sub>/1000)<sup>2</sup></code></p>
<p>σ получается в Па; в МПа — делить на 10<sup>6</sup>. Фактический запас n<sub>ф</sub> = 40 / σ. Если n<sub>ф</sub> &lt; 3,8, толщина недостаточна. Прогиб стекла в этой модели отдельно не считается: критерий — напряжение.</p>

<h3>3. Выбор толщины.</h3><p> Ряд стандартных толщин: 4, 5, 6, 8, 10, 12, 15, 19, 24 мм; более тонкие листы не рассматриваются. t<sub>w</sub> — первый элемент ряда ≥ s<sub>нуж</sub>. t<sub>b</sub> — первый ≥ max(t<sub>w</sub> + 2, s<sub>нуж</sub> + 2). Почему дно толще: на нём лежат стенки, нижний шов нагружен сильнее, а изгибающий момент у дна больше. Почему ряд, а не произвольное число: листовое стекло выпускается стандартных толщин. Если s<sub>нуж</sub> > 24 мм, расчёт упирается в 24 мм — нужен технолог.</p>

<h3>4. Отбортовка, стяжки, перегородки.</h3><p> Отбортовка — полоса 60 мм по верхнему периметру; включается при L > 800 мм или h<sub>w</sub> > 400 мм: две полосы спереди/сзади и две по бокам. Стяжки — поперечные распорки 60 мм; включаются при L ≥ 900 мм, количество n<sub>с</sub> = max(1, round(L/700) − 1). Они стягивают верх и уменьшают расчётный пролёт, поэтому k<sub>отб</sub> = 0,8 и k<sub>стяж</sub> = 0,7. Внутренние перегородки в модель не входят: они не участвуют в выборе толщины; их масса и локальные нагрузки считаются отдельно.</p>

<h3>5. Шов и детали.</h3><p> Шов s<sub>ш</sub>: 1,5 мм при t<sub>w</sub> ≤ 8; 2 мм при t<sub>w</sub> ≤ 12; 2,5 мм при t<sub>w</sub> > 12; 3 мм при L ≥ 2000 или Ht ≥ 700. Шов зависит от толщины стекла и размера: чем толще лист и больше аквариум, тем шире слой силикона. Детали: дно L × D; боковины D × (Ht − t<sub>b</sub>); передняя и задняя (L − 2t<sub>w</sub> − 2s<sub>ш</sub>) × (Ht − t<sub>b</sub>). Шов уже вычтен из ширины передней/задней; не вычитайте его повторно. Высота стенки — Ht минус толщина дна.</p>

<h3>6. Вес.</h3><p> Масса стекла: m<sub>g</sub> = ((2LHt + 2DHt)t<sub>w</sub> + LD·t<sub>b</sub>) · 10<sup>−9</sup> · 2500. Это верхняя оценка: шов и кромки не вычитаются. Объём воды: V<sub>w</sub> = L<sub>i</sub>D<sub>i</sub>(h<sub>w</sub> − h<sub>s</sub>) · 10<sup>−6</sup> л; масса воды численно равна V<sub>w</sub> в кг. Грунт: V<sub>s</sub> = L<sub>i</sub>D<sub>i</sub>h<sub>s</sub> · 10<sup>−6</sup> л, m<sub>s</sub> = V<sub>s</sub>ρ<sub>s</sub>. Фактический вес M = m<sub>g</sub> + V<sub>w</sub> + m<sub>s</sub>. Для нагрузок M<sub>расч</sub> = 1,1 · M(5 см грунта) — максимум; стекло и тумба считаются по M<sub>расч</sub>, даже если выбран другой слой. 10 % — запас на крепёж, арматуру и неравномерность.</p>

<h3>7. Допуски и ограничения.</h3><p> Это инженерная оценка, не паспорт производителя. Учитываются: запас 3,8; +10 % веса; номинальная толщина; 30 мм свободного борта. Не учитываются: ударные и температурные нагрузки, качество кромки, прочность силикона, отклонение толщины листа, внутренние перегородки и динамика воды. Для L > 1500 мм расчёт нужно проверить у технолога.</p>

<h3>8. Пример 1200 × 500 × 500.</h3><p> Ниже — те же шаги на конкретных числах.</p>

          ${row('Аэрация', `${f1(g.lpmMin)}–${f1(g.lpmMax)} ${tstr('л/мин')}`, '0,5–1 л/мин на 100 л')}
          ${row('Освещение, световой поток', `${f0(g.lmMin)}–${f0(g.lmMax)} ${tstr('лм')}`, '20–35 лм на литр')}

        <thead><tr><th>${tstr('Бренд')}</th><th>${tstr('Тип')}</th><th>${tstr('Модель')}</th><th>${tstr('Паспорт, л/ч')}</th><th>${tstr('Реально, л/ч')}</th><th>${tstr('Мощность, Вт')}</th><th>${tstr('Засыпка, л')}</th></tr></thead>
        <tbody>${fRows}</tbody>

        <li><h5>${tstr('Оборудование')}</h5><p>${LANG==='en' ? `Filter and aeration 24/7, heater at 25 °C.` : `Фильтр и аэрация круглосуточно, обогреватель на 25 °C.`}</p></li>
        <li><h5>${tstr('Запуск бактерий')}</h5><p>${LANG==='en' ? `The best start is a squeeze from a sponge of a running tank. Off-the-shelf cultures do not always help. Wait for zero ammonia and nitrite, usually 4–6 weeks.` : `Лучший старт — выжимка из губки рабочего аквариума. Готовые культуры помогают не всегда. Ждать до нулей по аммиаку и нитриту, обычно 4–6 недель.`}</p></li>
        <li><h5>${tstr('Рыба')}</h5><p>${LANG==='en' ? `No more than 2–3 cm of fish per 10 l at first.` : `Не больше 2–3 см рыбы на 10 л на первом этапе.`}</p></li>
      </ol>

  $('#secGear').querySelectorAll('.mv').forEach(el=>{
    el.onclick = ()=>{ $('#inMV').value = el.dataset.mv; state.section = 'bio'; renderAll(); };
  });
}

  });
  const avgPct = totalWeight ? totalFood/totalWeight*100 : 0;

      ? (LANG==='en' ? 'at the limit' : 'впритык')

          ${cell('Площадь', `${f1(b.areaM)} <small>${tstr('м²')}</small>`)}
          ${cell('Скорость', `${f2(b.vtr)} <small>${tstr('г/м²·сут')}</small>`)}
          ${cell('Мощность', `${f1(b.capTAN)} <small>${tstr('г TAN/сут')}</small>`)}
          ${cell('Корм', `${f0(b.feedCap)} <small>${tstr('г/сут')}</small>`)}
          ${cell('Рыба', `${f1(b.fishCap/1000)} <small>${tstr('кг')}</small>`)}
        </div>
        <p class="note">${LANG==='en' ? `Temperature ${b.t} °C, Q₁₀ = 2. The area is estimated from tests; materials differ by up to 5×.` : `Температура ${b.t} °C, Q₁₀ = 2. Площадь — оценка по тестам, разброс между материалами в 5 раз.`}</p>
      </section>

      <section class="card">
        <h2 class="ct">${tstr('Нагрузка')}</h2>
        <div class="chk">
          ${cell('Рыба', `${f0(b.fish)} <small>${tstr('г')}</small>`)}
          ${cell('Корм', `${f1(b.feedDay)} <small>${tstr('г/сут')}</small>`)}
          ${cell('Аммиак', `${f2(b.tanDay)} <small>${tstr('г/сут')}</small>`)}
          ${cell('Загрузка', `<span class="${loadCls}">${loadPct} %</span>`)}
          ${cell('Белок', `${b.prot} <small>%</small>`)}
          ${cell('Кормление', `${f1(b.rate)} <small>${tstr('% массы')}</small>`)}

        <p class="note">${LANG==='en' ? `1 g of feed at ${b.prot} % protein yields ${f1(b.tanPerFeed*1000)} mg of ammonia nitrogen. ${loadTxt[0].toUpperCase()+loadTxt.slice(1)}.` : `1 г корма при ${b.prot} % белка даёт ${f1(b.tanPerFeed*1000)} мг аммиака по азоту. ${loadTxt[0].toUpperCase()+loadTxt.slice(1)}.`}</p>

    <section class="card">
      <h2 class="ct">${tstr('Вода')} <span class="hint">${tstr('без растений и подмен')}</span></h2>

        ${cell('Нитрат', `${f1(b.no3Week)} <small>${tstr('мг/л·нед')}</small>`)}
        ${cell('Фосфат', `${f2(b.po4Week)} <small>${tstr('мг/л·нед')}</small>`)}
        ${cell('NO₃ : PO₄', `${f1(b.npRatio)} : 1`)}

      <p class="note">${LANG==='en' ? `In feed, nitrogen and phosphorus come at about 5–6 : 1 by mass; plants take up about 7 : 1. A water change lowers both equally and does not change the ratio — shift it with a dose of nitrogen or phosphate.` : `В корме азот и фосфор идут в отношении ~5–6 : 1 по массе, растения забирают ~7 : 1. Подмена снижает оба одинаково и соотношение не меняет — его сдвигают дозой азота или фосфата.`}</p>
    </section>

    <section class="card">
      <h2 class="ct">${tstr('Сколько рыб')} <span class="hint">${tstr('по нагрузке, не по комфорту')}</span></h2>
      <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>${tstr('Рыба')}</th><th>${LANG==='en'?'Weight, g':'Вес, г'}</th><th>${LANG==='en'?'Feed, % body':'Корм, % массы'}</th><th>${tstr('По фильтру, шт')}</th><th>${tstr('По объёму, шт')}</th><th>${LANG==='en'?'In cart, pcs':'В корзине, шт'}</th><th>${LANG==='en'?'Total, g feed':'Итог, г корма'}</th></tr></thead>

        : 'Итог = шт × вес × процент / 100 в сутки. Проценты — ориентир: зависят от температуры, возраста и корма. Корзина обновляет поля «Рыба» и «Кормление» в блоке «Фильтр»; оба поля остаются редактируемыми. Вес взрослой особи — ориентир. Рыба-клоун — морская, в пресном расчёте приведена справочно.'}</p>
      <div class="warnbox" style="border-color:#e6e7ec;background:#f8f9fb;color:#5b616b">
        ${LANG==='en'
          ? `<b>This is dry mathematics.</b> Only the biological load on the nitrogen cycle is counted.
        Shoaling, territoriality, swimming space, cover and fish comfort are not considered.
        The 'by filter' column is the nitrification limit, the 'by volume' column is a dense stocking of 1 g/l.
        Both figures are an upper bound, not a recommendation.`
          : `<b>Это сухой математический расчёт.</b> Учтена только биологическая нагрузка на азотный цикл.

      </div>
    </section>`;

  $('#secBio').querySelectorAll('.cart-in').forEach(inp => {

      const i = +inp.dataset.i;

      let tw = 0, tf = 0;

        $('#inRate').value = (tf/tw*100).toFixed(1);

    });
  });
}

function renderTests(M){
  const r = M.fertRes;
  const fmt = v => (Math.round(v * 1000) / 1000).toString().replace('.', ',');
  const grp = t => `<tr><td colspan="4" style="padding:16px 0 6px;font:600 10.5px/1 inherit;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)">${tstr(t)}</td></tr>`;
  const rowT = ([name, v, lo, hi, unit, dec]) => {
    let st, cls, val;
    if(v == null){ st = 'нет данных'; cls = 'mut'; val = '—'; }
    else {
      val = fmt(v) + (unit ? ` <span class="mut">${tstr(unit)}</span>` : '');
      if(v < lo){ st = 'низко'; cls = 'badge-warn'; }
      else if(v > hi){ st = 'высоко'; cls = 'badge-bad'; }
      else { st = 'норма'; cls = 'badge-ok'; }
    }
    const norm = lo === 0 ? (LANG==='en' ? `up to ${fmt(hi)}` : `до ${fmt(hi)}`) : `${fmt(lo)}–${fmt(hi)}`;
    return `<tr><td>${tstr(name)}</td><td class="num">${val}</td><td class="mut">${norm} ${tstr(unit)}</td><td><span class="${cls}">${tstr(st)}</span></td></tr>`;
  };
  const T = r.TPAR;
  const recRows = r.fertRec.map(([txt, lvl]) => {
    const cls = lvl === 'bad' ? 'badge-bad' : (lvl === 'warn' ? 'badge-warn' : 'badge-ok');
    return `<li style="margin-bottom:8px"><span class="${cls}">•</span> ${txt}</li>`;
  }).join('');
  const wcut = r.WCUT.length
    ? r.WCUT.map(([n, pct]) => `<tr><td>${tstr(n)}</td><td class="num">${pct} %</td></tr>`).join('')
    : `<tr><td colspan="2" class="mut">${tstr('Ничего выводить не нужно — всё в норме или неизвестно.')}</td></tr>`;

  $('#secFert').innerHTML = `
    <div class="two">
      <section class="card">
        <h2 class="ct">${tstr('Показатели')} <span class="hint">${r.okN} ${LANG==='en' ? 'of' : 'из'} ${r.knownN} ${LANG==='en' ? 'in range' : 'в норме'}</span></h2>
        <div style="overflow-x:auto">
        <table class="tbl">
          <thead><tr><th>${tstr('Параметр')}</th><th>${tstr('Сейчас')}</th><th>${tstr('Норма')}</th><th></th></tr></thead>
          <tbody>
            ${grp('Вода')}${T.slice(0,6).map(rowT).join('')}
            ${grp('Азот и фосфор')}${T.slice(6,10).map(rowT).join('')}
            ${grp('Минералы')}${T.slice(10).map(rowT).join('')}
          </tbody>
        </table></div>
        <p class="note">${LANG==='en' ? `CO₂ is calculated from pH and KH: CO₂ = 3 × KH × 10<sup>(7 − pH)</sup>. An empty field means no test.` : `CO₂ считается по pH и KH: CO₂ = 3 × KH × 10<sup>(7 − pH)</sup>. Пустое поле — нет теста.`}</p>
      </section>

      <section class="card">
        <h2 class="ct">${tstr('Рекомендации')}</h2>
        <ul style="list-style:none;margin:6px 0 0;padding:0;font-size:13px;line-height:1.5;color:var(--tx2)">${recRows}</ul>
      </section>
    </div>

    <section class="card">
      <h2 class="ct">${tstr('Подмены')} <span class="hint">${LANG==='en'?'to norm or target':'к норме или цели'}</span></h2>
      <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>${tstr('Параметр')}</th><th>${tstr('Подменить')}</th></tr></thead>
        <tbody>${wcut}</tbody>
      </table></div>
      <p class="note">${LANG==='en' ? `The share of the volume, assuming the replacement water does not contain this substance. For ammonia and nitrite, change water at once without waiting for the calculation.` : `Доля от объёма, если в подменной воде этого вещества нет. Для аммиака и нитрита подмену делают сразу, не дожидаясь расчёта.`}</p>
    </section>`;
}

function renderUdo(M){
  const r = M.fertRes, f = r.f, g = r.TGT;
  const all = [
    ['Калиевая селитра', 'KNO₃', r.mKNO3, LANG==='en' ? `+${f1(r.no3FromK)} mg/l NO₃, +${f1(r.kUsed)} K` : `+${f1(r.no3FromK)} мг/л NO₃, +${f1(r.kUsed)} K`],
    ['Кальциевая селитра', 'Ca(NO₃)₂ · 4H₂O', r.mCaNO3, LANG==='en' ? `+${f1(r.no3FromCa)} mg/l NO₃, +${f1(r.caUsed)} Ca` : `+${f1(r.no3FromCa)} мг/л NO₃, +${f1(r.caUsed)} Ca`],
    ['Мочевина, карбамид', 'CO(NH₂)₂', r.mUrea, LANG==='en' ? `+${f1(r.no3FromUrea)} mg/l NO₃` : `+${f1(r.no3FromUrea)} мг/л NO₃`],
    ['Монофосфат калия', 'KH₂PO₄', r.mKH2PO4, LANG==='en' ? `+${f1(r.dP)} mg/l PO₄` : `+${f1(r.dP)} мг/л PO₄`],
    ['Сульфат калия', 'K₂SO₄', r.mK2SO4, tstr('калий до цели')],
    ['Магнезия, сульфат магния', 'MgSO₄ · 7H₂O', r.mMgSO4, tstr('магний до цели')],
    ['Микро + железо, хелат', 'CSM+B / Fe-DTPA', r.mCSM, tstr('железо до цели')]
  ].filter(x => x[2] > 0.001);

  const grams = g0 => g0 < 0.01 ? '&lt; 0,01' : (g0 < 1 ? f2(g0) : f1(g0));
  const ML = LANG==='en' ? 'ml' : 'мл';
  const mlPart = (g, formula) => {
    const st = STOCK_BY[formula];
    if(!st) return '';
    const v = g / (st.g / 0.5) * 1000;
    const t = v < 0.1 ? f2(v) : (v < 10 ? f1(v) : f0(v));
    return ` / ${t} <span class="mut">${ML}</span>`;
  };
  const rows = all.length
    ? all.map(([n, fm, gram, what]) =>
      `<tr><td>${tstr(n)}</td><td class="mut">${fm}</td><td class="num">${grams(gram)} <span class="mut">${tstr('г')}</span>${mlPart(gram, fm)}</td><td class="num">${grams(gram/3)} <span class="mut">${tstr('г')}</span>${mlPart(gram/3, fm)}</td><td class="mut">${what}</td></tr>`).join('')
    : `<tr><td colspan="5" class="mut">${tstr('Всё в цели — вносить нечего.')}</td></tr>`;

  const deficit = [
    ['NO₃', f.no3, g.no3], ['PO₄', f.po4, g.po4], ['K', f.k, g.k],
    ['Ca', f.ca, g.ca], ['Mg', f.mg, g.mg], ['Fe', f.fe, g.fe]
  ].map(([n, cur, tgt]) => {
    const d = tgt - cur;
    const cls = d > 0.001 ? 'badge-warn' : (d < -0.001 ? 'mut' : 'badge-ok');
    return `<span style="margin-right:14px;white-space:nowrap">${n}: <b class="${cls}">${d > 0.001 ? '+' : ''}${f1(d)}</b></span>`;
  }).join('');

  const kCls = r.finalK > r.TGT.k + 0.01 ? 'badge-warn' : 'badge-ok';
  const caCls = r.finalCa > r.TGT.ca + 0.01 ? 'badge-warn' : 'badge-ok';
  const nh3Cls = r.nh3Mass > 0.05 ? 'badge-warn' : 'badge-ok';
  const ammoniaRows = r.mUrea > 0.001 ? `
        <tr><td>NH₃ (${LANG==='en'?'free':'свободный'})</td><td class="num"><b class="${nh3Cls}">+${f2(r.nh3Mass)}</b></td><td class="num">—</td><td class="num">—</td></tr>
        <tr><td>NH₄⁺</td><td class="num">+${f2(r.nh4Mass)}</td><td class="num">—</td><td class="num">—</td></tr>
        <tr><td>NH₃ + NH₄ (TAN)</td><td class="num">+${f2(r.tanUrea)} <small>N</small></td><td class="num">—</td><td class="num">—</td></tr>` : '';
  const sideHtml = `<div style="overflow-x:auto;margin-top:12px">
    <table class="tbl">
      <thead><tr><th>${LANG==='en'?'Side substance':'Побочное вещество'}</th><th>${LANG==='en'?'Adds, mg/l':'Внесёт, мг/л'}</th><th>${LANG==='en'?'Final':'Итог'}</th><th>${LANG==='en'?'Target':'Цель'}</th></tr></thead>
      <tbody>
        <tr><td>K</td><td class="num">+${f1(r.kSide)}</td><td class="num"><b class="${kCls}">${f1(r.finalK)}</b></td><td class="num">${f1(r.TGT.k)}</td></tr>
        <tr><td>Ca</td><td class="num">+${f1(r.caSide)}</td><td class="num"><b class="${caCls}">${f1(r.finalCa)}</b></td><td class="num">${f1(r.TGT.ca)}</td></tr>
        <tr><td>SO₄</td><td class="num">+${f1(r.so4)}</td><td class="num">—</td><td class="num">—</td></tr>
        ${ammoniaRows}
      </tbody>
    </table></div>`;
  const sideNote = (r.kSide < 0.01 && r.caSide < 0.01 && r.so4 < 0.01 && r.mUrea <= 0.001)
    ? (r.mCSM > 0.001
        ? `<p class="note">${LANG==='en' ? 'Micro/iron also adds other trace elements (B, Mn, Mo, etc.) — not calculated.' : 'Микро/железо дополнительно даёт другие микроэлементы (B, Mn, Mo и др.) — не рассчитываются.'}</p>`
        : `<p class="note">${LANG==='en' ? 'No side substances — this recipe adds only the target element.' : 'Побочных веществ нет — рецепт даёт только целевой элемент.'}</p>`)
    : '';
  const ammoniaNote = r.mUrea > 0.001
    ? `<p class="note">${LANG==='en'
        ? `Urea hydrolyses to NH₃/NH₄⁺. At pH ${f1(r.phU)} and ${f0(r.tempC)} °C free NH₃ is ${f2(r.fNH3*100)} % of TAN, the rest is NH₄⁺. Nitrification then converts them to NO₃.${r.nh3Mass > 0.05 ? ' Free NH₃ is above 0.05 mg/l — dangerous; add urea in small portions.' : ''}`
        : `Мочевина при гидролизе даёт NH₃/NH₄⁺. При pH ${f1(r.phU)} и ${f0(r.tempC)} °C на свободный NH₃ приходится ${f2(r.fNH3*100)} % TAN, остальное — NH₄⁺. Дальше нитрификация переводит их в NO₃.${r.nh3Mass > 0.05 ? ' Свободный NH₃ выше 0,05 мг/л — опасно; вносите мочевину малыми порциями.' : ''}`}</p>`
    : '';
  const overK = r.finalK > r.TGT.k + 0.01, overCa = r.finalCa > r.TGT.ca + 0.01;
  const overNote = (overK || overCa)
    ? `<p class="note">${LANG==='en'
        ? (overK && overCa ? 'K and Ca are above target — fertilizers cannot lower them; a water change is the way.' : overK ? 'K is above target — fertilizers cannot lower it; a water change is the way.' : 'Ca is above target — fertilizers cannot lower it; a water change is the way.')
        : (overK && overCa ? 'K и Ca выше цели — удобрениями не снизить, нужна подмена.' : overK ? 'K выше цели — удобрениями не снизить, нужна подмена.' : 'Ca выше цели — удобрениями не снизить, нужна подмена.')}</p>`
    : '';

  /* постоянный справочник концентратов: не зависит от текущего расчёта */
  const stockRows = STOCK.map(s => `<tr>
      <td><b>${tstr(s.name)}</b></td>
      <td class="mut">${s.formula}</td>
      <td class="num">${f1(0.5)} ${LANG==='en'?'l':'л'} / ${f0(s.g)} ${LANG==='en'?'g':'г'}</td>
      <td class="num">${f0(s.g/0.5)} ${LANG==='en'?'g/l':'г/л'}</td>
    </tr>`).join('');
  const stockHtml = `<section class="card">
      <h2 class="ct">${LANG==='en'?'Stock recipes':'Рецепты концентратов'} <span class="hint">${LANG==='en'?'0.5 l · fixed':'0,5 л · постоянные'}</span></h2>
      <p class="note" style="margin-top:0">${LANG==='en'
        ? 'Amounts are per 0.5 l of ready solution. The ml doses are in the table above. All recipes are fixed and do not depend on the current calculation.'
        : 'Навеска — на 0,5 л готового раствора. Дозы в мл — в таблице выше. Все рецепты постоянные и не зависят от текущего расчёта.'}</p>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>${LANG==='en'?'Salt':'Соль'}</th><th>${LANG==='en'?'Formula':'Формула'}</th><th>${LANG==='en'?'Per 0.5 l':'На 0,5 л'}</th><th>${LANG==='en'?'Concentration':'Концентрация'}</th></tr></thead>
        <tbody>${stockRows}</tbody>
      </table></div>
      <p class="note">${LANG==='en'
        ? 'Keep each salt in its own bottle (0.5–0.75 l): never mix phosphate with calcium, magnesium or micro. Use distilled or RO water; macro solutions keep for several months, iron and micro for about a month, urea for 1–2 weeks. Stir until fully dissolved, shake before dosing. Garden nitrate is 98–99 %, add 1–2 % to the mass.'
        : 'Каждую соль — в отдельной бутылке (0,5–0,75 л): фосфат нельзя смешивать с кальцием, магнием и микро. Готовить на дистиллированной или осмотической воде; макро-растворы хранятся несколько месяцев, железо и микро — около месяца, мочевина — 1–2 недели. Размешивать до полного растворения, перед дозой взбалтывать. Садовая селитра 98–99 %, добавьте 1–2 % к массе.'}</p>
    </section>`;

  $('#secUdo').innerHTML = `
    <section class="card">
      <h2 class="ct">${tstr('Рецепт')} <span class="hint">${LANG==='en' ? `for ${f0(M.waterV)} l` : `на ${f0(M.waterV)} л`}</span></h2>
      <p class="note" style="margin-top:0">${deficit}</p>
      <p class="note">${LANG==='en' ? `The doses in the table are grams of dry salt / ml of stock solution. Fixed stock recipes are below.` : `В таблице — граммы сухой соли / мл готового раствора. Ниже — постоянные рецепты концентратов.`}</p>
      <div style="overflow-x:auto">
      <table class="tbl">
        <thead><tr><th>${tstr('В магазине')}</th><th>${tstr('Формула')}</th><th>${tstr('Разовая правка')}, ${LANG==='en'?'g / ml':'г / мл'}</th><th>${tstr('На приём (3 раза в неделю)')}, ${LANG==='en'?'g / ml':'г / мл'}</th><th>${tstr('Что даёт')}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
      ${sideHtml}${sideNote}${overNote}${ammoniaNote}
      <p class="note">${LANG==='en' ? `The nitrates take only up to the potassium and calcium targets (${f0(g.k)} and ${f0(g.ca)} mg/l); any remaining nitrogen goes in as urea. If you do not want to raise calcium, supply all nitrogen as urea.` : `Селитры берут только до целей по калию и кальцию (${f0(g.k)} и ${f0(g.ca)} мг/л); остаток азота уходит мочевиной. Не хотите поднимать кальций — весь азот дайте мочевиной.`}</p>
    </section>
    ${stockHtml}`;
}

function renderNow(M){
  const sec = state.section || 'tank';
  let big = '', sub = '', dots = '';
  if(sec === 'tank'){
    big = LANG==='en' ? `${f0(M.waterV)} l` : `${f0(M.waterV)} л`;
    sub = '';
  } else if(sec === 'stand'){
    big = LANG==='en'
      ? `${M.n} ${M.n===1?'section':'sections'} · ${f0(M.clear)} mm`
      : `${M.n} ${pl(M.n,'секция','секции','секций')} · ${f0(M.pitch)} мм`;
    sub = LANG==='en'
      ? `Doors ${f0(M.doorW)}×${f0(M.doorH)} · ${M.sheets.length} ${M.sheets.length===1?'sheet':'sheets'} of plywood`
      : `Дверцы ${f0(M.doorW)}×${f0(M.doorH)} · ${M.sheets.length} ${pl(M.sheets.length,'лист','листа','листов')} фанеры`;
  } else if(sec === 'gear'){
    big = LANG==='en' ? `${f0(M.gear.flowMin)}–${f0(M.gear.flowMax)} l/h` : `${f0(M.gear.flowMin)}–${f0(M.gear.flowMax)} л/ч`;
    sub = LANG==='en'
      ? `Real flow · light ${f0(M.gear.lmMin)}–${f0(M.gear.lmMax)} lm · heater up to ${f0(Math.max(25, Math.round(M.gear.heatMax/25)*25))} W`
      : `Реальный поток · свет ${f0(M.gear.lmMin)}–${f0(M.gear.lmMax)} лм · обогрев до ${f0(Math.max(25, Math.round(M.gear.heatMax/25)*25))} Вт`;
  } else if(sec === 'bio'){
    big = LANG==='en' ? `${f1(M.bioRes.capTAN)} g TAN/day` : `${f1(M.bioRes.capTAN)} г TAN/сут`;
    sub = LANG==='en'
      ? `Load ${Math.round(M.bioRes.load*100)} % · fish up to ${f1(M.bioRes.fishCap/1000)} kg`
      : `Загрузка ${Math.round(M.bioRes.load*100)} % · рыба до ${f1(M.bioRes.fishCap/1000)} кг`;
  } else if(sec === 'fert' || sec === 'udo'){
    const r = M.fertRes;
    if(sec === 'fert'){
      big = LANG==='en' ? `${r.okN} of ${r.knownN} in range` : `${r.okN} из ${r.knownN} в норме`;
      sub = LANG==='en'
        ? (r.okN === r.knownN ? 'All known parameters are on target' : `${r.knownN - r.okN} out of range — see the recommendations`)
        : (r.okN === r.knownN ? 'Все известные показатели в эталоне' : `${r.knownN - r.okN} вне нормы — смотрите рекомендации`);
    } else {
      const nSalts = [r.mKNO3, r.mCaNO3, r.mUrea, r.mKH2PO4, r.mK2SO4, r.mMgSO4, r.mCSM].filter(v => v > 0.001).length;
      big = LANG==='en'
        ? (nSalts ? `${nSalts} ${nSalts===1?'salt':'salts'} in the recipe` : 'Nothing to add')
        : (nSalts ? `${nSalts} ${pl(nSalts,'соль','соли','солей')} в рецепте` : 'Ничего вносить не нужно');
      const d = [];
      if(r.dN > 0.01) d.push(`NO₃ +${f1(r.dN)}`);
      if(r.dP > 0.01) d.push(`PO₄ +${f1(r.dP)}`);
      sub = d.length ? d.join(' · ') + (LANG==='en' ? ' to target' : ' до цели') : (LANG==='en' ? 'Everything is on target' : 'Всё на цели');
    }
    const bad = r.TPAR.filter(v => v[1] != null && (v[1] < v[2] || v[1] > v[3]));
    dots = bad.length
      ? bad.slice(0,6).map(([n,v,lo,hi]) => `<span class="dot ${v < lo ? 'warn' : 'bad'}"><i></i>${tstr(n.replace(' (расчёт)',''))}</span>`).join('')
      : `<span class="dot ok"><i></i>${LANG==='en' ? 'all in range' : 'всё в норме'}</span>`;
  }
  $('#cardNow').innerHTML = `<div class="nk">${sec === 'tank' ? tstr('Объём') : t("now_lbl")}</div><div class="big">${big}</div>${sub ? `<div class="sub">${sub}</div>` : ''}${dots ? `<div class="dots">${dots}</div>` : ''}`;
}

function setSection(sec){
  state.section = sec;
  $('#segs').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s===sec));
  /* на узком экране прокручиваем ленту разделов к активной вкладке */
  const segsEl = $('#segs');
  const segOn = segsEl.querySelector('button.on');
  if(segOn && segsEl.scrollWidth > segsEl.clientWidth + 1){
    const l = segOn.offsetLeft, r = l + segOn.offsetWidth;
    if(l < segsEl.scrollLeft || r > segsEl.scrollLeft + segsEl.clientWidth){
      segsEl.scrollLeft = Math.max(0, l - (segsEl.clientWidth - segOn.offsetWidth)/2);
    }
  }
  $('#secTank').classList.toggle('hide', sec!=='tank');
  $('#secStand').classList.toggle('hide', sec!=='stand');
  $('#secGear').classList.toggle('hide', sec!=='gear');
  $('#secBio').classList.toggle('hide', sec!=='bio');
  $('#secFert').classList.toggle('hide', sec!=='fert');
  $('#secUdo').classList.toggle('hide', sec!=='udo');
  /* ввод стоит перед результатом на «Тестах» и «Удо» */
  const udoBox = $('#udoInputs');
  const mainEl = document.querySelector('.main');
  const onIn = (sec === 'fert' || sec === 'udo');
  if(sec === 'fert'){
    const ref = $('#secFert');
    if(udoBox.nextElementSibling !== ref) mainEl.insertBefore(udoBox, ref);
  } else if(sec === 'udo'){
    const ref = $('#secUdo');
    if(udoBox.nextElementSibling !== ref) mainEl.insertBefore(udoBox, ref);
  }
  udoBox.classList.toggle('hide', !onIn);
  udoBox.classList.toggle('three', onIn);
  udoBox.classList.toggle('udo', sec === 'udo');
  if(onIn){
    const col1 = $('#udoCol1'), col2 = $('#udoCol2');
    ['cardWater','cardNP','cardMin'].forEach(id => {
      const el = document.getElementById(id);
      if(el && el.parentElement !== col1) col1.appendChild(el);
    });
    const goalEl = document.getElementById('cardGoal');
    if(goalEl && goalEl.parentElement !== col2) col2.appendChild(goalEl);
    udoBox.querySelectorAll('.f-extra').forEach(el => el.classList.toggle('hide', sec !== 'fert'));
  }
  $('#cardWater').classList.toggle('hide', sec !== 'fert');
  $('#cardNP').classList.toggle('hide', !onIn);
  $('#cardMin').classList.toggle('hide', !onIn);
  $('#cardGoal').classList.toggle('hide', sec !== 'udo');
  $('#cardTank').classList.toggle('hide', sec==='fert');
  $('#kpis').classList.toggle('hide', sec==='fert' || sec==='udo');
  $('#sideSpec').classList.toggle('hide', sec!=='stand');
  $('#cardStand').classList.toggle('hide', sec!=='stand');
  $('#soilField').classList.toggle('hide', sec === 'stand');
  document.querySelector('.side').classList.toggle('merge', sec === 'stand');
  $('#cardBio').classList.toggle('hide', sec!=='bio');
  $('#seghint').textContent = t('h_' + (sec === 'fert' ? 'test' : sec));
  if(MODEL){ renderKpis(MODEL); renderNow(MODEL); }
}

const SAVE_IDS = ['inL','inD','inH','inSoil','inHS','inBoard','inThick','inEdgeBody','inEdgeDoor','inBuild','inModDoors','inComp','inSheet','inMedia','inMV','inTemp','inProt','inRate','inFish',
  'inNO3','inPO4','inK','inCa','inMg','inFe','inPH','inKH','inGH','inNH3','inNO2','inCu','inTDS','inEC',
  'inGNO3','inGPO4','inGK','inGCa','inGMg','inGFe','inDoors'];
function saveState(){
  try{
    const o = { __color: state.color };
    SAVE_IDS.forEach(id => { const el = document.getElementById(id); if(el) o[id] = el.value; });
    localStorage.setItem('aqua-calc', JSON.stringify(o));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem('aqua-calc');
    if(!raw) return;
    const o = JSON.parse(raw);
    SAVE_IDS.forEach(id => { const el = document.getElementById(id); if(el && o[id] != null) el.value = o[id]; });
    if(o.__color === 'black' || o.__color === 'beige'){
      state.color = o.__color;
      document.querySelectorAll('#colors .sw').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.c === state.color)));
    }
  }catch(e){}
}

  const selD = $('#inDoors');
  const doorWant = +selD.value || 0;
  MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, doorWant, soilD, boardKey, thick, edgeBody, edgeDoor, buildType, modDoors, backWorks, compTop);
  /* список вариантов строится после расчёта: нижняя граница зависит от пролёта */
  const sig = MODEL.dMin + '-' + MODEL.dMax + LANG;
  if(selD.dataset.max !== sig){
    const keep = +selD.value;
    let opts = `<option value="0">${t('opt_auto')}</option>`;
    for(let i=MODEL.dMin;i<=MODEL.dMax;i++) opts += `<option value="${i}">${i}</option>`;
    selD.innerHTML = opts;
    selD.dataset.max = sig;
    selD.dataset.lang = LANG;
    const fits = keep >= MODEL.dMin && keep <= MODEL.dMax;
    selD.value = fits ? String(keep) : '0';
    if(!fits) MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, 0, soilD, boardKey, thick, edgeBody, edgeDoor, buildType, modDoors, backWorks, compTop);
  }
  /* модульная раскладка: не показываем варианты, где модуль перегружен */
  let modChoiceCount = 0;
  if(MODEL.modular){
    const validMd = md => {
      const test = build(L, D, Ht, H, SW, SH, bio, fert, goal, MODEL.doorN, soilD, boardKey, thick, edgeBody, edgeDoor, 'modular', md, backWorks, compTop);
      return test.spanOK && test.pitch <= K.RANGE[1] + 2;
    };
    let md = MODEL.modDoors;
    if(!validMd(md)){
      for(let k = md - 1; k >= 1; k--){
        if(validMd(k)){ MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, MODEL.doorN, soilD, boardKey, thick, edgeBody, edgeDoor, 'modular', k, backWorks, compTop); md = k; break; }
      }
    }
    if(!validMd(md)){
      MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, MODEL.doorN, soilD, boardKey, thick, edgeBody, edgeDoor, 'solid', 1, backWorks, compTop);
      $('#inBuild').value = 'solid';
    }
    $('#inModDoors').value = String(md);
    $('#inModDoors').querySelectorAll('option').forEach(o => {
      const ok = validMd(+o.value);
      o.hidden = !ok;
      o.disabled = !ok;
      if(ok) modChoiceCount++;
    });
  }
  $('#doorField').classList.toggle('hide', L < 800);
  $('#edgeField').classList.toggle('hide', boardKey !== 'ldsp');
  $('#edgeField').style.display = boardKey === 'ldsp' ? '' : 'none';
  $('#edgeDoorField').classList.toggle('hide', boardKey !== 'ldsp');
  $('#edgeDoorField').style.display = boardKey === 'ldsp' ? '' : 'none';
  const singleSection = MODEL.doorN === 1;
  if(singleSection && MODEL.modular){
    MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, 0, soilD, boardKey, thick, edgeBody, edgeDoor, 'solid', 1, backWorks, compTop);
  }
  if(singleSection) $('#inBuild').value = 'solid';
  $('#buildField').classList.toggle('hide', singleSection);
  $('#buildField').style.display = singleSection ? 'none' : '';
  $('#modField').classList.toggle('hide', singleSection || !MODEL.modular);
  $('#modField').style.display = (!singleSection && MODEL.modular && modChoiceCount > 1) ? '' : 'none';
  $('#doorHint').textContent = L >= 800 ? `${t('door_def')} ${MODEL.doorSug}` : '';
  renderKpis(MODEL);
  renderSide(MODEL);
  renderTank(MODEL);
  renderView(MODEL);
  renderCalc(MODEL);
  renderCut(MODEL);
  renderAsm(MODEL);
  renderGear(MODEL);
  renderBio(MODEL);
  renderTests(MODEL);
  renderUdo(MODEL);
  setSection(state.section);
  translateDom(document.querySelector('.main'));
  translateDom(document.querySelector('.side'));
  saveState();
}
