function buildUdoGrid(){
  const wrap = document.getElementById('ugrid');
  if(!wrap) return;
  const gdef = (AquaCore.PROFILES.hi || {}).goals || {};
  const unit = u => !u ? '' : (u === 'u_mgl' ? '<em data-i18n="u_mgl">мг/л</em>' : `<em>${u}</em>`);
  const rows = UDO_ROWS.map(r => {
    if(r.g) return `<div class="ugrp" data-i18n="${r.g}"></div>`;
    const id = r.id || ('in' + r.k.toUpperCase());
    const fact = r.type === 'temp'
      ? `<select id="${id}"><option>22</option><option>24</option><option selected>25</option><option>26</option><option>27</option><option>28</option><option>30</option></select>`
      : `<input id="${id}" type="number" value="" placeholder="—" min="${r.min}" max="${r.max}" step="${r.step}">`;
    const goal = r.goal
      ? `<div class="uval"><div class="inp"><input id="${r.gid}" type="number" value="${gdef[r.k] != null ? gdef[r.k] : ''}" min="${r.min}" max="${r.max}" step="${r.step}">${unit(r.unit)}</div></div>`
      : `<div class="uval uempty">—</div>`;
    return `<div class="urow">
      <div class="ulabel"><span data-i18n="${r.label}"></span><i class="fs" data-k="${r.k}"></i><span class="rng" data-rng="${r.k}"></span></div>
      <div class="uval"><div class="inp">${fact}${unit(r.unit)}</div></div>
      ${goal}
    </div>`;
  }).join('');
  wrap.innerHTML = `<div class="uhead"><span data-i18n="u_param">Параметр</span><span data-i18n="u_fact">Факт</span><span data-i18n="u_goal">Цель</span></div>` + rows;
}

function updateUdoStatus(ev){
  document.querySelectorAll('#ugrid .fs').forEach(el => {
    const r = ev.rows.find(x => x.key === el.dataset.k);
    if(!r || r.value == null){ el.className = 'fs'; el.title = tstr('нет данных'); return; }
    const tol = (AquaCore.META[r.key] && AquaCore.META[r.key].tol) || 0;
    let st = (r.status === 'ok') ? 'ok' : r.severity;
    if (r.goal != null && st !== 'bad') st = (Math.abs(r.value - r.goal) <= tol + 1e-9) ? 'ok' : 'warn';
    el.className = 'fs ' + st;
    const norm = r.norm ? `${L('норма', 'range')} ${fmtD(r.norm[0], r.dec)}–${fmtD(r.norm[1], r.dec)}` : '';
    const goal = r.goal != null ? ` · ${L('цель', 'target')} ${fmtD(r.goal, r.dec)}` : '';
    el.title = `${stLabel(r.status)} · ${fmtD(r.value, r.dec)} ${tstr(r.unit)} · ${norm}${goal}`;
  });
  document.querySelectorAll('#ugrid .rng').forEach(el => {
    const r = ev.rows.find(x => x.key === el.dataset.rng);
    el.textContent = (r && r.norm) ? `${fmtD(r.norm[0], r.dec)}–${fmtD(r.norm[1], r.dec)}` : '';
  });
}

function renderTests(M){
  const ev = M.fertRes.ev, c = ev.counts, wc = M.fertRes.wc || [];
  const prof = AquaCore.PROFILES[ev.profile] || AquaCore.PROFILES.hi;
  const tolOf = r => (AquaCore.META[r.key] && AquaCore.META[r.key].tol) || 0;
  const issues = ev.rows.filter(r => {
    if (r.value == null) return false;
    if (r.goal != null) return Math.abs(r.value - r.goal) > tolOf(r) + 1e-9;
    return r.status === 'low' || r.status === 'high';
  }).sort((a, b) => (a.severity === 'bad' ? 0 : 1) - (b.severity === 'bad' ? 0 : 1));

  const acts = issues.length ? issues.map(r => {
    const goalMode = r.goal != null;
    const dir = goalMode
      ? (r.value < r.goal ? L('ниже цели', 'below target') : L('выше цели', 'above target'))
      : (r.status === 'low' ? L('ниже нормы', 'below range') : L('выше нормы', 'above range'));
    const key = goalMode ? (r.value < r.goal ? 'low' : 'high') : r.status;
    const h = r.hint && r.hint[key];
    const note = h ? TX(h) : L('Проверьте тест и подмену воды.', 'Check the test and change some water.');
    const sev = r.severity === 'bad' ? 'bad' : 'warn';
    const target = goalMode ? ` (${L('цель', 'target')} ${fmtD(r.goal, r.dec)})` : '';
    return `<li class="act ${sev}"><b>${TX(r.label)}</b> — ${dir}: ${fmtD(r.value, r.dec)} ${tstr(r.unit)}${target}. ${note}</li>`;
  }).join('') : (c.known <= 1
    ? `<li class="act">${L('Заполните тесты или нажмите «Пример».', 'Fill in the tests or press Example.')}</li>`
    : `<li class="act ok">${L('Отклонений нет.', 'No deviations.')}</li>`);

  const rel = ev.relations.map(r => {
    const v = f1(r.value);
    const txt = r.code === 'ca_mg' ? `Ca : Mg = ${v}` : r.code === 'k_ca' ? `K : Ca = ${v}` : `N : P = ${v}`;
    return `<span class="rel ${r.ok ? 'ok' : 'warn'}">${txt}</span>`;
  }).join('');

  const wcRows = wc.length ? wc.map(x => {
    const r = ev.rows.find(y => y.key === x.key);
    return `<tr><td>${r ? TX(r.label) : x.key}</td><td class="num">${x.pct} %</td><td class="mut">≤ ${fmtD(x.target, r ? r.dec : 1)}</td></tr>`;
  }).join('') : `<tr><td colspan="3" class="mut">${L('Ничего выводить не нужно — всё в норме или неизвестно.', 'Nothing to remove — everything is in range or unknown.')}</td></tr>`;

  $('#fertBar').innerHTML = `
    <div class="toolbar">
      <div class="seg" id="profSeg">
        ${Object.keys(AquaCore.PROFILES).map(k => `<button data-p="${k}" class="${k === ev.profile ? 'on' : ''}">${TX(AquaCore.PROFILES[k].name)}</button>`).join('')}
      </div>
      <div class="btnrow">
        <button class="btn" id="btnSample">${L('Пример', 'Example')}</button>
        <button class="btn" id="btnClear">${L('Очистить', 'Clear')}</button>
      </div>
    </div>
    <p class="note" style="margin:0 0 12px">${c.known <= 1
      ? L('Пусто = нет теста. Заполните поля или нажмите «Пример» — нормы показаны в строке параметра.', 'Empty = no test. Fill in the fields or press Example — the ranges are shown next to each parameter.')
      : `${L('Заполнено', 'Filled')} ${c.known} ${L('из', 'of')} ${c.total} · ${c.ok} ${L('в норме', 'in range')} · ${c.warn + c.bad} ${plural(c.warn + c.bad, 'отклонение', 'отклонения', 'отклонений', 'issue', 'issues')}. ${L('Норма', 'Range')} — ${L('эталон профиля', 'profile reference')}, ${L('цель', 'target')} — ${L('то, к чему ведёт рецепт', 'what the recipe drives to')}.`}</p>`;

  $('#secFert').innerHTML = `
    <div class="two">
      <section class="card">
        <h2 class="ct">${L('Что делать', 'What to do')} <span class="hint">${issues.length ? issues.length + ' ' + plural(issues.length, 'замечание', 'замечания', 'замечаний', 'note', 'notes') : L('чисто', 'clear')}</span></h2>
        <ul class="acts">${acts}</ul>
        ${rel ? `<div class="rels">${rel}</div>` : ''}
      </section>
      <section class="card">
        <h2 class="ct">${L('Подмены', 'Water changes')} <span class="hint">${L('к норме или цели', 'to range or target')}</span></h2>
        <div style="overflow-x:auto"><table class="tbl">
          <thead><tr><th>${L('Параметр', 'Parameter')}</th><th>${L('Подменить', 'Change')}</th><th>${L('До', 'To')}</th></tr></thead>
          <tbody>${wcRows}</tbody>
        </table></div>
        <p class="note">${L('Доля от объёма, если в подменной воде этого вещества нет. Для аммиака и нитрита подмену делают сразу, не дожидаясь расчёта.', 'Share of the volume assuming the replacement water contains none. For ammonia and nitrite, change water at once.')}</p>
      </section>
    </div>`;

  $('#profSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
    state.profile = b.dataset.p;
    saveState();
    renderAll();
  });
  $('#btnSample').onclick = fillSample;
  $('#btnClear').onclick = clearTests;
  updateUdoStatus(ev);
}

function renderUdo(M){
  const ev = M.fertRes.ev, rec = M.fertRes.rec;
  const prof = AquaCore.PROFILES[ev.profile] || AquaCore.PROFILES.hi;

  const addTxt = s => {
    const a = s.adds || {}, p = [];
    if (a.no3 != null) p.push('NO₃ +' + f1(a.no3));
    if (a.po4 != null) p.push('PO₄ +' + f2(a.po4));
    if (a.k != null) p.push('K +' + f1(a.k));
    if (a.ca != null) p.push('Ca +' + f0(a.ca));
    if (a.mg != null) p.push('Mg +' + f1(a.mg));
    if (a.fe != null) p.push('Fe +' + f2(a.fe));
    if (a.kh != null) p.push('KH +' + f1(a.kh));
    if (a.so4 != null) p.push('SO₄ +' + f1(a.so4));
    if (a.cl != null) p.push('Cl +' + f1(a.cl));
    if (a.tan != null) p.push('TAN +' + f2(a.tan));
    return p.join(' · ');
  };
  const gfmt = v => v < 0.01 ? ('< ' + (LANG === 'en' ? '0.01' : '0,01')) : (v < 1 ? f2(v) : f1(v));
  const mfmt = v => v < 0.1 ? f2(v) : (v < 10 ? f1(v) : f0(v));

  const saltRows = rec.salts.map(s => `<tr>
      <td><b>${TX(s.name)}</b></td>
      <td class="mut">${s.formula}</td>
      <td class="num">${gfmt(s.grams)} <span class="mut">${L('г', 'g')}</span> / ${mfmt(s.ml)} <span class="mut">${L('мл', 'ml')}</span>${s.bottles > 1 ? ` <span class="badge-warn">×${s.bottles}</span>` : ''}</td>
      <td class="num">${gfmt(s.grams / 3)} <span class="mut">${L('г', 'g')}</span> / ${mfmt(s.ml / 3)} <span class="mut">${L('мл', 'ml')}</span></td>
      <td class="mut">${addTxt(s)}</td>
    </tr>`).join('');

  const finKeys = ['ph', 'kh', 'gh', 'no3', 'po4', 'k', 'ca', 'mg', 'fe'];
  const finRows = finKeys.map(k => {
    const r = ev.rows.find(x => x.key === k);
    if (!r) return '';
    if (k === 'ph') {
      return `<tr><td>${TX(r.label)}</td><td class="num">${fmtD(r.value, r.dec)}</td><td class="mut">${L('не солями', 'not by salts')}</td><td class="mut">${r.goal != null ? fmtD(r.goal, r.dec) : '—'}</td><td><span class="st none">CO₂</span></td></tr>`;
    }
    const after = rec.final[k];
    const tol = (AquaCore.META[k] && AquaCore.META[k].tol) || 0;
    const ok = (after != null && r.goal != null) ? after >= r.goal - tol : null;
    return `<tr><td>${TX(r.label)}</td><td class="num">${fmtD(r.value, r.dec)}</td><td class="num"><b>${fmtD(after, r.dec)}</b></td><td class="mut">${r.goal != null ? fmtD(r.goal, r.dec) : '—'}</td><td>${ok == null ? '' : `<span class="st ${ok ? 'ok' : 'warn'}">${ok ? L('цель', 'target') : L('недобор', 'short')}</span>`}</td></tr>`;
  }).join('');

  const warnText = w => {
    const r = ev.rows.find(x => x.key === w.key) || {};
    const lab = r.label ? TX(r.label) : (w.key || '');
    const dec = r.dec == null ? 1 : r.dec;
    if (w.code === 'no_test') return `${L('Нет теста', 'No test')}: ${lab} — ${L('доза не рассчитана', 'dose not calculated')}.`;
    if (w.code === 'goal_out') return `${L('Цель', 'Target')} ${lab} = ${fmtD(w.value, dec)} ${L('вне нормы', 'outside range')} ${fmtD(w.norm[0], dec)}–${fmtD(w.norm[1], dec)}.`;
    if (w.code === 'above_goal') return `${lab} ${L('уже выше цели', 'is already above target')} (${fmtD(w.value, dec)} > ${fmtD(w.goal, dec)}) — ${L('снизить можно только подменой', 'only a water change lowers it')}.`;
    if (w.code === 'kh_down') return `${L('KH выше цели', 'KH is above target')} — ${L('снизить можно только подменой или осмосом', 'only a water change or RO lowers it')}.`;
    if (w.code === 'gh_down') return `${L('GH выше цели', 'GH is above target')} — ${L('снизить можно только подменой или осмосом', 'only a water change or RO lowers it')}.`;
    if (w.code === 'gh_conflict') return `${L('GH после дозы', 'GH after dosing')} ${fmtD(w.value, 1)} ${L('не совпадает с целью', 'does not match target')} ${fmtD(w.goal, 1)}: ${L('цели Ca и Mg задают другой GH', 'the Ca and Mg targets define another GH')}.`;
    if (w.code === 'ph_goal_out') return `${L('Цель pH', 'pH target')} ${fmtD(w.value, 2)} ${L('вне рабочего диапазона 6,0–8,5', 'outside the working range 6.0–8.5')}.`;
    if (w.code === 'ph_co2_high') return `${L('Для этой цели pH нужен CO₂', 'This pH target needs CO₂')} ${f1(w.value)} ${tstr('мг/л')} — ${L('опасно для рыбы', 'dangerous for fish')}.`;
    if (w.code === 'ph_co2_low') return `${L('Для этой цели pH нужен CO₂', 'This pH target needs CO₂')} ${f1(w.value)} ${tstr('мг/л')} — ${L('мало для растений', 'too low for plants')}.`;
    if (w.code === 'urea_tan') return `${L('Мочевина даст', 'Urea will give')} TAN +${f2(w.value)} ${tstr('мг/л')}, ${L('свободного NH₃', 'free NH₃')} ${f3(w.nh3)} ${tstr('мг/л')}.`;
    if (w.code === 'urea_nh3') return `${L('Мочевина даст', 'Urea will give')} ${f3(w.value)} ${tstr('мг/л')} ${L('свободного NH₃', 'free NH₃')} — ${L('вносите дробно', 'add in portions')}.`;
    if (w.code === 'bottles') return `${L('Навеска больше флакона', 'Batch exceeds one bottle')}: ${w.bottles} × ${w.key}.`;
    return '';
  };
  const warns = rec.warnings.map(w => `<li>${warnText(w)}</li>`).filter(Boolean).join('');

  const goalsSet = ['ph', 'kh', 'gh', 'no3', 'po4', 'k', 'ca', 'mg', 'fe'].filter(k => M.fertRes.goal[k] != null).length;
  const missLabels = rec.missing.map(k => { const r = ev.rows.find(x => x.key === k); return r ? TX(r.label) : k; });
  const emptyReason = rec.missing.length
    ? `${L('Не хватает тестов', 'Missing tests')}: ${missLabels.join(', ')}.`
    : (goalsSet === 0 ? L('Цели не заданы — заполните колонку «Цель».', 'No targets set — fill in the Target column.') : L('Всё уже на цели — вносить нечего.', 'Everything is on target — nothing to add.'));

  const phCard = rec.ph ? `<section class="card">
      <h2 class="ct">${L('pH и CO₂', 'pH and CO₂')}</h2>
      <p class="note" style="margin-top:0">${L('Солями pH не меняется. Чтобы держать', 'Salts do not change pH. To hold')} pH ${fmtD(rec.ph.goal, 2)} ${L('при KH', 'at KH')} ${fmtD(rec.ph.kh, 1)}, ${L('CO₂ должен быть', 'CO₂ should be')} ≈ ${f1(rec.ph.co2Target)} ${tstr('мг/л')}${rec.ph.co2Now != null ? ` (${L('сейчас', 'now')} ${f1(rec.ph.co2Now)})` : ''}.</p>
    </section>` : '';

  const body = rec.empty ? `<section class="card"><div class="emptybox"><b>${L('Рецепт не нужен', 'No recipe needed')}</b><p>${emptyReason}</p></div></section>` : `
    <section class="card">
      <h2 class="ct">${L('Рецепт', 'Recipe')} <span class="hint">${L('на', 'for')} ${f0(rec.volume)} ${L('л', 'l')} · ${TX(prof.name)}</span></h2>
      <p class="note" style="margin-top:0">${L('Граммы — сухая соль. Миллилитры — готовый концентрат 0,5 л. Вторая колонка — та же доза, растянутая на неделю в три приёма.', 'Grams are dry salt. Millilitres are the 0.5 l stock solution. The second column is the same dose spread over a week in three parts.')}</p>
      <div style="overflow-x:auto"><table class="tbl recipe">
        <thead><tr><th>${L('Соль', 'Salt')}</th><th>${L('Формула', 'Formula')}</th><th>${L('Разово', 'One-off')}</th><th>${L('За неделю, 3 приёма', 'Per week, 3 doses')}</th><th>${L('Что даёт', 'Provides')}</th></tr></thead>
        <tbody>${saltRows || `<tr><td colspan="5" class="mut">${L('Всё в цели — вносить нечего.', 'Everything is on target — nothing to add.')}</td></tr>`}</tbody>
      </table></div>
    </section>
    <section class="card">
      <h2 class="ct">${L('После дозы', 'After dosing')}</h2>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>${L('Параметр', 'Parameter')}</th><th>${L('Сейчас', 'Now')}</th><th>${L('Станет', 'Becomes')}</th><th>${L('Цель', 'Target')}</th><th></th></tr></thead>
        <tbody>${finRows}</tbody>
      </table></div>
      ${warns ? `<ul class="warns">${warns}</ul>` : ''}
    </section>
    ${phCard}`;

  const stock = AquaCore.SALTS.map(s => `<tr><td><b>${TX(s.name)}</b></td><td class="mut">${s.formula}</td><td class="num">${f0(s.stockG)} ${L('г', 'g')} / ${f1(s.stockL)} ${L('л', 'l')}</td><td class="num">${f0(s.stockG / s.stockL)} ${L('г/л', 'g/l')}</td></tr>`).join('');

  $('#secFert').insertAdjacentHTML('beforeend', `
    ${body}
    <section class="card">
      <h2 class="ct">${L('Концентраты', 'Stock solutions')} <span class="hint">${L('0,5 л · постоянные', '0.5 l · fixed')}</span></h2>
      <p class="note" style="margin-top:0">${L('Каждую соль — в отдельной бутылке: фосфат нельзя смешивать с кальцием, магнием и микро. Готовить на дистиллированной или осмотической воде. Макро — несколько месяцев, железо и микро — около месяца, мочевина — 1–2 недели, сода — растворять перед внесением.', 'Keep each salt in its own bottle: never mix phosphate with calcium, magnesium or micro. Use distilled or RO water. Macro keeps for months, iron and micro about a month, urea 1–2 weeks; dissolve baking soda just before use.')}</p>
      <div style="overflow-x:auto"><table class="tbl">
        <thead><tr><th>${L('Соль', 'Salt')}</th><th>${L('Формула', 'Formula')}</th><th>${L('Навеска', 'Batch')}</th><th>${L('Концентрация', 'Concentration')}</th></tr></thead>
        <tbody>${stock}</tbody>
      </table></div>
    </section>`);

  updateUdoStatus(ev);
}

function renderNow(M){
  const sec = state.section || 'tank';
  let big = '', sub = '', dots = '';
  if(sec === 'tank'){
    big = LANG==='en' ? `${f0(M.waterV)} l` : `${f0(M.waterV)} л`;
    sub = '';
  } else if(sec === 'stand'){
    big = LANG==='en'
      ? `${M.n} ${M.n===1?'section':'sections'} · ${f0(M.clear)} mm`
      : `${M.n} ${pl(M.n,'секция','секции','секций')} · ${f0(M.pitch)} мм`;
    sub = LANG==='en'
      ? `Doors ${f0(M.doorW)}×${f0(M.doorH)} · ${M.sheets.length} ${M.sheets.length===1?'sheet':'sheets'} of plywood`
      : `Дверцы ${f0(M.doorW)}×${f0(M.doorH)} · ${M.sheets.length} ${pl(M.sheets.length,'лист','листа','листов')} фанеры`;
  } else if(sec === 'gear'){
    big = LANG==='en' ? `${f0(M.gear.flowMin)}–${f0(M.gear.flowMax)} l/h` : `${f0(M.gear.flowMin)}–${f0(M.gear.flowMax)} л/ч`;
    sub = LANG==='en'
      ? `Real flow · light ${f0(M.gear.lmMin)}–${f0(M.gear.lmMax)} lm · heater up to ${f0(Math.max(25, Math.round(M.gear.heatMax/25)*25))} W`
      : `Реальный поток · свет ${f0(M.gear.lmMin)}–${f0(M.gear.lmMax)} лм · обогрев до ${f0(Math.max(25, Math.round(M.gear.heatMax/25)*25))} Вт`;
  } else if(sec === 'bio'){
    big = LANG==='en' ? `${f1(M.bioRes.capTAN)} g TAN/day` : `${f1(M.bioRes.capTAN)} г TAN/сут`;
    sub = LANG==='en'
      ? `Load ${Math.round(M.bioRes.load*100)} % · fish up to ${f1(M.bioRes.fishCap/1000)} kg`
      : `Загрузка ${Math.round(M.bioRes.load*100)} % · рыба до ${f1(M.bioRes.fishCap/1000)} кг`;
  } else if(sec === 'fert'){
    const ev = M.fertRes.ev;
    const tolOf = r => (AquaCore.META[r.key] && AquaCore.META[r.key].tol) || 0;
    const goalRows = ev.rows.filter(r => r.goal != null && r.value != null);
    const hit = goalRows.filter(r => Math.abs(r.value - r.goal) <= tolOf(r) + 1e-9).length;
    big = ev.counts.known <= 1 ? L('нет тестов', 'no tests')
      : (goalRows.length
        ? `${hit} ${L('из', 'of')} ${goalRows.length} ${plural(goalRows.length, 'цели', 'целей', 'целей', 'target', 'targets')}`
        : `${ev.counts.ok} ${L('из', 'of')} ${ev.counts.known} ${L('в норме', 'in range')}`);
    sub = ev.counts.known <= 1 ? L('заполните поля', 'fill in the fields')
      : `${ev.counts.ok} ${L('из', 'of')} ${ev.counts.known} ${L('в норме', 'in range')}`;
    const bad = ev.rows.filter(v => {
      if (v.value == null) return false;
      if (v.goal != null) return Math.abs(v.value - v.goal) > tolOf(v) + 1e-9;
      return v.status !== 'ok';
    });
    dots = bad.length
      ? bad.slice(0, 6).map(v => `<span class="dot ${v.severity === 'bad' ? 'bad' : 'warn'}"><i></i>${TX(v.label)}</span>`).join('')
      : `<span class="dot ok"><i></i>${L('всё в норме', 'all in range')}</span>`;
    if (ev.counts.known <= 1) dots = '';
  }
  $('#cardNow').innerHTML = `<div class="nk">${sec === 'tank' ? tstr('Объём') : t("now_lbl")}</div><div class="big">${big}</div>${sub ? `<div class="sub">${sub}</div>` : ''}${dots ? `<div class="dots">${dots}</div>` : ''}`;
}

function setSection(sec){
  state.section = sec;
  $('#segs').querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.s===sec));
  const segsEl = $('#segs');
  const segOn = segsEl.querySelector('button.on');
  if(segOn && segsEl.scrollWidth > segsEl.clientWidth + 1){
    const l = segOn.offsetLeft, r = l + segOn.offsetWidth;
    if(l < segsEl.scrollLeft || r > segsEl.scrollLeft + segsEl.clientWidth){
      segsEl.scrollLeft = Math.max(0, l - (segsEl.clientWidth - segOn.offsetWidth)/2);
    }
  }
  $('#secTank').classList.toggle('hide', sec!=='tank');
  $('#secStand').classList.toggle('hide', sec!=='stand');
  $('#secGear').classList.toggle('hide', sec!=='gear');
  $('#secBio').classList.toggle('hide', sec!=='bio');
  $('#secFert').classList.toggle('hide', sec!=='fert');
  const onIn = (sec === 'fert');
  $('#udoInputs').classList.toggle('hide', !onIn);
  $('#cardTank').classList.toggle('hide', onIn);
  $('#kpis').classList.toggle('hide', onIn);
  $('#sideSpec').classList.toggle('hide', sec!=='stand');
  $('#cardStand').classList.toggle('hide', sec!=='stand');
  $('#soilField').classList.toggle('hide', sec === 'stand');
  document.querySelector('.side').classList.toggle('merge', sec === 'stand');
  $('#cardBio').classList.toggle('hide', sec!=='bio');
  $('#seghint').textContent = t('h_' + (sec === 'fert' ? 'test' : sec));
  if(MODEL){ renderKpis(MODEL); renderNow(MODEL); }
}

const SAVE_IDS = ['inL','inD','inH','inSoil','inHS','inBoard','inThick','inEdgeBody','inEdgeDoor','inBuild','inModDoors','inSheet','inMedia','inMV','inTemp','inProt','inRate','inFish',
  'inNO3','inPO4','inK','inCa','inMg','inFe','inPH','inKH','inGH','inNH3','inNO2','inCu','inTDS','inEC',
  'inGPH','inGKH','inGGH','inGNO3','inGPO4','inGK','inGCa','inGMg','inGFe','inDoors'];
function saveState(){
  try{
    const o = { __color: state.color, __profile: state.profile };
    SAVE_IDS.forEach(id => { const el = document.getElementById(id); if(el) o[id] = el.value; });
    localStorage.setItem('aqua-calc', JSON.stringify(o));
  }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem('aqua-calc');
    if(!raw) return;
    const o = JSON.parse(raw);
    SAVE_IDS.forEach(id => { const el = document.getElementById(id); if(el && o[id] != null) el.value = o[id]; });
    if(o.__color === 'black' || o.__color === 'beige'){
      state.color = o.__color;
      document.querySelectorAll('#colors .sw').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.c === state.color)));
    }
    if(o.__profile === 'hi' || o.__profile === 'low' || o.__profile === 'fish') state.profile = o.__profile;
  }catch(e){}
}

function fillSample(){
  const S = { inPH: 6.8, inKH: 4, inGH: 7, inTDS: 180, inEC: 300, inNH3: 0.02, inNO2: 0, inNO3: 5, inPO4: 1, inK: 12, inCa: 30, inMg: 8, inFe: 0.05, inCu: 0 };
  Object.keys(S).forEach(id => { const el = document.getElementById(id); if(el) el.value = String(S[id]); });
  const g = AquaCore.PROFILES[state.profile || 'hi'].goals;
  const map = { ph: 'inGPH', kh: 'inGKH', gh: 'inGGH', no3: 'inGNO3', po4: 'inGPO4', k: 'inGK', ca: 'inGCa', mg: 'inGMg', fe: 'inGFe' };
  Object.keys(map).forEach(k => { const el = document.getElementById(map[k]); if(el) el.value = String(g[k]); });
  renderAll();
}
function clearTests(){
  ['inPH','inKH','inGH','inTDS','inEC','inNH3','inNO2','inNO3','inPO4','inK','inCa','inMg','inFe','inCu'].forEach(id => {
    const el = document.getElementById(id); if(el) el.value = '';
  });
  renderAll();
}

function renderAll(){
  const L  = clamp(+$('#inL').value || 1200, 300, 4200);
  const D  = clamp(+$('#inD').value || 500, 300, 1200);
  const Ht = clamp(+$('#inH').value || 500, 200, 1200);
  const H  = +$('#inHS').value || 900;
  const soilEl = $('#inSoil');
  const soilVal = soilEl ? +soilEl.value : 50;
  const soilD = Number.isFinite(soilVal) ? clamp(soilVal, 0, 100) : 50;
  const boardKey = $('#inBoard').value === 'ldsp' ? 'ldsp' : ($('#inBoard').value === 'mdf' ? 'mdf' : 'plywood');
  const thick = +$('#inThick').value === 16 ? 16 : 18;
  const edgeBody = boardKey === 'ldsp' ? clamp(+$('#inEdgeBody').value || 0.4, 0.4, 2) : 0;
  const edgeDoor = boardKey === 'ldsp' ? clamp(+$('#inEdgeDoor').value || 1, 0.4, 2) : 0;
  const buildType = $('#inBuild').value === 'modular' ? 'modular' : 'solid';
  const modDoors = clamp(+$('#inModDoors').value || 1, 1, 3);
  const backWorks = true;
  const compTop = true;                      /* крышка всегда считается склеенной */
  const [SW, SH] = $('#inSheet').value.split(',').map(Number);
  const bio = {
    media: $('#inMedia').value,
    mv: clamp(+$('#inMV').value || 5, 0.5, 100),
    t: +$('#inTemp').value || 25,
    prot: clamp(+$('#inProt').value || 40, 20, 60),
    rate: clamp(+$('#inRate').value || 2, 0.5, 5),
    fish: clamp(+$('#inFish').value || 300, 1, 10000)
  };
  const numIn = id => { const el = document.getElementById(id); return (el && el.value !== '') ? +el.value : null; };
  const fert = {
    no3: numIn('inNO3'), po4: numIn('inPO4'), k: numIn('inK'), ca: numIn('inCa'), mg: numIn('inMg'), fe: numIn('inFe'),
    ph: numIn('inPH'), kh: numIn('inKH'), gh: numIn('inGH'), tan: numIn('inNH3'), no2: numIn('inNO2'),
    cu: numIn('inCu'), tds: numIn('inTDS'), ec: numIn('inEC')
  };
  const gIn = (id, max) => { const el = document.getElementById(id); if(!el || el.value === '') return null; return clamp(+el.value, 0, max); };
  const goal = {
    ph:  (() => { const v = gIn('inGPH', 10); return v == null ? null : clamp(v, 4, 10); })(),
    kh:  gIn('inGKH', 30),
    gh:  gIn('inGGH', 40),
    no3: gIn('inGNO3', 200),
    po4: gIn('inGPO4', 50),
    k:   gIn('inGK', 200),
    ca:  gIn('inGCa', 200),
    mg:  gIn('inGMg', 100),
    fe:  gIn('inGFe', 2)
  };
  const selD = $('#inDoors');
  const doorWant = +selD.value || 0;
  MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, doorWant, soilD, boardKey, thick, edgeBody, edgeDoor, buildType, modDoors, backWorks, compTop);
  /* список вариантов строится после расчёта: нижняя граница зависит от пролёта */
  const sig = MODEL.dMin + '-' + MODEL.dMax + LANG;
  if(selD.dataset.max !== sig){
    const keep = +selD.value;
    let opts = `<option value="0">${t('opt_auto')}</option>`;
    for(let i=MODEL.dMin;i<=MODEL.dMax;i++) opts += `<option value="${i}">${i}</option>`;
    selD.innerHTML = opts;
    selD.dataset.max = sig;
    selD.dataset.lang = LANG;
    const fits = keep >= MODEL.dMin && keep <= MODEL.dMax;
    selD.value = fits ? String(keep) : '0';
    if(!fits) MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, 0, soilD, boardKey, thick, edgeBody, edgeDoor, buildType, modDoors, backWorks, compTop);
  }
  /* модульная раскладка: не показываем варианты, где модуль перегружен */
  let modChoiceCount = 0;
  if(MODEL.modular){
    const validMd = md => {
      const test = build(L, D, Ht, H, SW, SH, bio, fert, goal, MODEL.doorN, soilD, boardKey, thick, edgeBody, edgeDoor, 'modular', md, backWorks, compTop);
      return test.spanOK && test.pitch <= K.RANGE[1] + 2;
    };
    let md = MODEL.modDoors;
    if(!validMd(md)){
      for(let k = md - 1; k >= 1; k--){
        if(validMd(k)){ MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, MODEL.doorN, soilD, boardKey, thick, edgeBody, edgeDoor, 'modular', k, backWorks, compTop); md = k; break; }
      }
    }
    if(!validMd(md)){
      MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, MODEL.doorN, soilD, boardKey, thick, edgeBody, edgeDoor, 'solid', 1, backWorks, compTop);
      $('#inBuild').value = 'solid';
    }
    $('#inModDoors').value = String(md);
    $('#inModDoors').querySelectorAll('option').forEach(o => {
      const ok = validMd(+o.value);
      o.hidden = !ok;
      o.disabled = !ok;
      if(ok) modChoiceCount++;
    });
  }
  /* селектор числа дверей нужен, только если вариантов больше одного */
  const hideDoors = L < 800 || MODEL.dMax <= MODEL.dMin;
  if(hideDoors) selD.value = '0';
  $('#doorField').classList.toggle('hide', hideDoors);
  $('#doorField').style.display = hideDoors ? 'none' : '';
  $('#edgeField').classList.toggle('hide', boardKey !== 'ldsp');
  $('#edgeField').style.display = boardKey === 'ldsp' ? '' : 'none';
  $('#edgeDoorField').classList.toggle('hide', boardKey !== 'ldsp');
  $('#edgeDoorField').style.display = boardKey === 'ldsp' ? '' : 'none';
  const singleSection = MODEL.doorN === 1;
  if(singleSection && MODEL.modular){
    MODEL = build(L, D, Ht, H, SW, SH, bio, fert, goal, 0, soilD, boardKey, thick, edgeBody, edgeDoor, 'solid', 1, backWorks, compTop);
  }
  if(singleSection) $('#inBuild').value = 'solid';
  $('#buildField').classList.toggle('hide', singleSection);
  $('#buildField').style.display = singleSection ? 'none' : '';
  $('#modField').classList.toggle('hide', singleSection || !MODEL.modular);
  $('#modField').style.display = (!singleSection && MODEL.modular && modChoiceCount > 1) ? '' : 'none';
  $('#doorHint').textContent = L >= 800 ? `${t('door_def')} ${MODEL.doorSug}` : '';
  renderKpis(MODEL);
  renderSide(MODEL);
  renderTank(MODEL);
  renderView(MODEL);
  renderCalc(MODEL);
  renderCut(MODEL);
  renderAsm(MODEL);
  renderGear(MODEL);
  renderBio(MODEL);
  renderTests(MODEL);
  renderUdo(MODEL);
  setSection(state.section);
  translateDom(document.querySelector('.main'));
  translateDom(document.querySelector('.side'));
  saveState();
}
