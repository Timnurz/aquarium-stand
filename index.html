  s += `<text x="24" y="30" class="ttl">${LANG==='en' ? 'Shelf detail — section' : 'Узел полки — разрез'}</text>`;
  s += `<text x="24" y="49" class="sub">${LANG==='en' ? 'shelf on pins, removable' : 'полка на цилиндрах, снимается'}</text>`;
  const scl = 3.2, ox = 250, oy = 300;
  const X = mm => ox + mm*scl;
  const Y = mm => oy - mm*scl;
  s += `<rect x="${X(-40).toFixed(1)}" y="${Y(26).toFixed(1)}" width="${(40*scl).toFixed(1)}" height="${(52*scl).toFixed(1)}" fill="url(#hatch)" stroke="#b99f7c" stroke-width="1"/>`;
  s += `<rect x="${X(2).toFixed(1)}" y="${Y(18).toFixed(1)}" width="${(68*scl).toFixed(1)}" height="${(18*scl).toFixed(1)}" fill="#e0c093" stroke="#b08c5e" stroke-width="1.1"/>`;
  s += `<rect x="${X(0).toFixed(1)}" y="${Y(0).toFixed(1)}" width="${(7*scl).toFixed(1)}" height="${(5*scl).toFixed(1)}" rx="2" fill="#8d9096" stroke="#6f7378"/>`;
  s += `<rect x="${X(-12).toFixed(1)}" y="${Y(0).toFixed(1)}" width="${(12*scl).toFixed(1)}" height="${(5*scl).toFixed(1)}" fill="none" stroke="#8d9096" stroke-dasharray="3 2"/>`;
  const call = (ax,ay,bx,by,n) => `<line x1="${ax.toFixed(1)}" y1="${ay.toFixed(1)}" x2="${bx.toFixed(1)}" y2="${by.toFixed(1)}" stroke="#4d6bfe" stroke-width="1" stroke-dasharray="3 2" opacity=".7"/><circle cx="${bx.toFixed(1)}" cy="${by.toFixed(1)}" r="10" fill="#fff" stroke="#4d6bfe" stroke-width="1.3"/><text x="${bx.toFixed(1)}" y="${by.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="11" font-weight="700" fill="#3a55df">${n}</text>`;
  s += call(X(4), Y(2.5), 336, 352, 1);
  s += call(X(1), Y(9), 352, 198, 2);
  s += call(X(-7), Y(2.5), 148, 168, 3);
  s += `<text x="24" y="404" class="lbl2">${LANG==='en' ? '1 — shelf pin Ø5×16, 7 mm reach' : '1 — полкодержатель Ø5×16, вылет 7'}</text>`;
  s += `<text x="24" y="422" class="lbl2">${LANG==='en' ? '2 — 2 mm clearance at the sides' : '2 — зазор 2 мм по бокам'}</text>`;
  s += `<text x="24" y="440" class="lbl2">${LANG==='en' ? '3 — Ø5×12 hole in the upright' : '3 — отверстие Ø5×12 в стойке'}</text>`;

  s += `<line x1="510" y1="24" x2="510" y2="450" stroke="#e6e7ec"/>`;
  s += `<text x="538" y="30" class="ttl">${LANG==='en' ? 'Bay plan' : 'План секции'}</text>`;
  s += `<text x="538" y="49" class="sub">${LANG==='en' ? '4 pins, 2 mm clearance' : '4 цилиндра, зазор 2 мм'}</text>`;
  const pw = 396, ph = 250;
  const sc2 = Math.min(pw/M.clear, ph/M.inD);
  const px0 = 560, py0 = 88;
  const qx = mm => px0 + mm*sc2;
  const qy = mm => py0 + mm*sc2;
  s += `<rect x="${(qx(0)-18*sc2).toFixed(1)}" y="${qy(0).toFixed(1)}" width="${(18*sc2).toFixed(1)}" height="${(M.inD*sc2).toFixed(1)}" fill="url(#hatch)" stroke="#b99f7c"/>`;
  s += `<rect x="${qx(M.clear).toFixed(1)}" y="${qy(0).toFixed(1)}" width="${(18*sc2).toFixed(1)}" height="${(M.inD*sc2).toFixed(1)}" fill="url(#hatch)" stroke="#b99f7c"/>`;
  s += `<rect x="${qx(0).toFixed(1)}" y="${(qy(M.inD)-18*sc2).toFixed(1)}" width="${(M.clear*sc2).toFixed(1)}" height="${(18*sc2).toFixed(1)}" fill="#e2d2b8" stroke="#c3ac8b"/>`;
  s += `<rect x="${qx(2).toFixed(1)}" y="${qy(30).toFixed(1)}" width="${((M.clear-4)*sc2).toFixed(1)}" height="${((M.inD-30)*sc2).toFixed(1)}" fill="#e0c093" stroke="#b08c5e" stroke-width="1.2"/>`;
  [[3.5,80],[3.5,M.inD-50],[M.clear-3.5,80],[M.clear-3.5,M.inD-50]].forEach(([x,y])=>{
    s += `<circle cx="${qx(x).toFixed(1)}" cy="${qy(y).toFixed(1)}" r="3" fill="#8d9096" stroke="#6f7378"/>`;
  });
  s += `<text x="${qx(M.clear/2).toFixed(1)}" y="${qy(M.inD/2).toFixed(1)}" class="lbl" text-anchor="middle">${LANG==='en' ? 'shelf' : 'полка'} ${f0(shelf.w)} × ${f0(shelf.h)}</text>`;
  s += `<line x1="${qx(0).toFixed(1)}" y1="${(qy(M.inD)+30).toFixed(1)}" x2="${qx(M.clear).toFixed(1)}" y2="${(qy(M.inD)+30).toFixed(1)}" stroke="#b3b9c4"/>`;
  s += `<text x="${qx(M.clear/2).toFixed(1)}" y="${(qy(M.inD)+44).toFixed(1)}" class="lbl" text-anchor="middle">${f0(M.clear)}</text>`;
  const dxl = qx(M.clear) + 18*sc2 + 16;
  s += `<line x1="${dxl.toFixed(1)}" y1="${qy(0).toFixed(1)}" x2="${dxl.toFixed(1)}" y2="${qy(M.inD).toFixed(1)}" stroke="#b3b9c4"/>`;
  s += `<text x="${(dxl+8).toFixed(1)}" y="${qy(M.inD/2).toFixed(1)}" class="lbl">${f0(M.inD)}</text>`;
  s += `<text x="538" y="404" class="lbl2">${LANG==='en' ? 'Pins — 50 mm from the edges.' : 'Цилиндры — 50 мм от кромок.'}</text>`;
  s += `<text x="538" y="422" class="lbl2">${LANG==='en' ? 'The shelf comes out without tools.' : 'Полка снимается без инструмента.'}</text>`;
  return svgWrap(W,Hh,s);
}

    cards = [
      ['NO₃ : PO₄', `<span class="${rc}">${rt}</span><small>: 1</small>`, L('норма 5–20', 'range 5–20'), true],

      ['Калий', `${v(k)}<small>${tstr('мг/л')}</small>`, goalTxt(k), false],
      ['Жёсткость', `${v(g)}<small>°dGH</small>`, L('норма 4–14', 'range 4–14'), false],

    ];

  ).join('');

    } else {
      kpiNote.innerHTML = '';
    }
  }
}

    ? `Deflection limit ${K.DEFL} mm, stress ${M.board.sig} MPa. Each span is treated as a separate beam —
      <b class="${okDefl && okSig ? 'badge-ok' : 'badge-warn'}">${okDefl && okSig ? 'factor OK' : 'deflection above norm'}</b>.`
    : `Норма прогиба ${K.DEFL} мм, напряжения ${M.board.sig} МПа. Каждый пролёт считается отдельной балкой —
      <b class="${okDefl && okSig ? 'badge-ok' : 'badge-warn'}">${okDefl && okSig ? 'запас есть' : 'прогиб выше нормы'}</b>.`;
  const weakNote = weak
    ? (M.modular
      ? (LANG==='en' ? ` <b class="badge-warn">The module is too wide for this board — reduce doors per module or add a centre support.</b>` : ` <b class="badge-warn">Модуль слишком широк для этого материала — уменьшите число дверей в модуле или добавьте центральную опору.</b>`)
      : (LANG==='en' ? ` <b class="badge-warn">The span is too wide for this material — use 18 mm, a stronger board or a double wall.</b>` : ` <b class="badge-warn">Пролёт слишком широк для этого материала — нужно 18 мм, более прочный материал или двойная стенка.</b>`))
    : (M.doubleWalls ? (LANG==='en' ? ` <b class="badge-ok">Stiffened double uprights.</b>` : ` <b class="badge-ok">Стойки сдвоенные, усиленные.</b>`) : '');
  const workNote = LANG==='en'
    ? ` Back panel: ${M.backWorks?'counted':'not counted'}; top: ${M.compTop?'glued composite':'not glued'}.`
    : ` Задняя стенка: ${M.backWorks?'учтена':'не учтена'}; столешница: ${M.compTop?'склеена, композит':'не склеена'}.`;
  $('#calcCard').innerHTML = `<h2 class="ct">${tstr('Крышка')} <span class="hint">${M.T} ${tstr('мм')} · ${matName} · ${tstr('пролёт между стойками')}</span></h2>
    <div class="chk">${items.map(([k,v])=>`<div><dt>${tstr(k)}</dt><dd>${v}</dd></div>`).join('')}</div>
    <p class="note" style="margin-top:14px">${note}${weakNote}${workNote}</p>`;
}

function sheetSVG(M, sh, idx){
  const W=520, Hh=300, pad=16;
  const sc = Math.min((W-2*pad)/M.SW, (Hh-2*pad-18)/M.SH);
  const w = M.SW*sc, h = M.SH*sc;
  const ox = (W-w)/2, oy = 8;
  let s = `<rect x="${ox}" y="${oy}" width="${w}" height="${h}" fill="#ffffff" stroke="#d8dae1" stroke-width="1.2"/>`;
  sh.items.forEach(it=>{
    const col = PAL[(it.id-1)%PAL.length];
    const x = ox + it.x*sc, y = oy + it.y*sc, ww = it.w*sc, hh = it.h*sc;
    s += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(1,ww-0.6).toFixed(1)}" height="${Math.max(1,hh-0.6).toFixed(1)}" fill="${col}" fill-opacity=".13" stroke="${col}" stroke-opacity=".9" stroke-width="1"/>`;
    if(ww > 30 && hh > 15)
      s += `<text x="${(x+ww/2).toFixed(1)}" y="${(y+hh/2+4).toFixed(1)}" text-anchor="middle" fill="${col}" font-size="12" font-weight="700" font-family="Segoe UI">${it.id}</text>`;
    if(ww > 80 && hh > 36)
      s += `<text x="${(x+ww/2).toFixed(1)}" y="${(y+hh/2+18).toFixed(1)}" text-anchor="middle" fill="#8b919b" font-size="9.5" font-family="Consolas">${Math.round(it.w)}×${Math.round(it.h)}</text>`;
  });
  s += `<text x="${ox+4}" y="${oy+h+13}" fill="#8b919b" font-size="10.5" font-family="Consolas">${M.SW} × ${M.SH} · ${LANG==='en' ? 'sheet' : 'лист'} ${idx+1}</text>`;
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;
}

function wavyLine(x1,y1,x2,y2,amp,step){
  amp = amp || 2.6; step = step || 7;
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len;
  const n=Math.max(2, Math.round(len/step));
  let d='';
  for(let i=0;i<=n;i++){
    const t=i/n, s=Math.sin(t*Math.PI*2*(n/2))*amp;
    const x=x1+dx*t+nx*s, y=y1+dy*t+ny*s;
    d += (i ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
  }
  return `<path d="${d}" fill="none" stroke="#d97706" stroke-width="2.4" stroke-linecap="round"/>`;
}

const edgeSides = mode => ({all:4, front_lr:3, front_l:2, front_r:2, front:1}[mode] || 0);
const fmtDim = v => Math.abs(v - Math.round(v)) < 0.05 ? f0(v) : f1(v);

/* ===================== присадка: модель отверстий и карты ===================== */
﻿/* =========================================================================
   ПРИСАДКА v2 — модель отверстий, проверка коллизий, карта детали
   -------------------------------------------------------------------------
   Узел описывается ОДИН раз: точка на оси каркаса + направление + толщины.
   Оба отверстия пары строятся из одной точки и лежат на одной оси, поэтому
   пара сходится по построению. Позиция вдоль ребра (t) — параметр узла;
   решатель двигает узел целиком, пока его ось не перестанет пересекаться
   с чужими осями.
   ========================================================================= */
(function (global) {
'use strict';

/* ---------- векторы ---------- */
const v3 = (x, y, z) => ({ x: x, y: y, z: z });
const add = (a, b) => v3(a.x + b.x, a.y + b.y, a.z + b.z);
const mul = (a, k) => v3(a.x * k, a.y * k, a.z * k);
const sub = (a, b) => v3(a.x - b.x, a.y - b.y, a.z - b.z);
const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const len = a => Math.sqrt(dot(a, a));
const AX = { x: v3(1, 0, 0), y: v3(0, 1, 0), z: v3(0, 0, 1) };

/* расстояние между отрезками p1q1 и p2q2 */
function segDist(p1, q1, p2, q2) {
  const d1 = sub(q1, p1), d2 = sub(q2, p2), r = sub(p1, p2);
  const a = dot(d1, d1), e = dot(d2, d2), f = dot(d2, r);
  const EPS = 1e-9;
  let s, t;
  if (a <= EPS && e <= EPS) return len(r);
  if (a <= EPS) { s = 0; t = Math.max(0, Math.min(1, f / e)); }
  else {
    const c = dot(d1, r);
    if (e <= EPS) { t = 0; s = Math.max(0, Math.min(1, -c / a)); }
    else {
      const b = dot(d1, d2), den = a * e - b * b;
      s = den !== 0 ? Math.max(0, Math.min(1, (b * f - c * e) / den)) : 0;
      t = (b * s + f) / e;
      if (t < 0) { t = 0; s = Math.max(0, Math.min(1, -c / a)); }
      else if (t > 1) { t = 1; s = Math.max(0, Math.min(1, (b - c) / a)); }
    }
  }
  const c1 = add(p1, mul(d1, s)), c2 = add(p2, mul(d2, t));
  return len(sub(c1, c2));
}

const CLEAR = 3;   /* минимальный мостик материала между стенками отверстий */

/* =========================== УЗЛЫ =========================== */

function buildBox(M, box) {
  const T = M.T, Lc = box.w, C = M.C, z0 = M.zBot, z1 = M.zBotTop, z2 = M.zIn0, z3 = M.zU;
  const joints = [];
  let id = 0;
  const bx0 = box.x0 || 0;

  /* доски в координатах корпуса: модуль считается от своего левого края */
  const boards = [];
  if (M.modular) {
    boards.push({ kind: 'side', x0: 0, x1: T });
    boards.push({ kind: 'side', x0: Lc - T, x1: Lc });
  } else {
    (M.uprights || []).forEach(u => {
      const n = Math.max(1, Math.round((u.x1 - u.x0) / T));
      for (let i = 0; i < n; i++) boards.push({ kind: u.kind, x0: u.x0 + i * T, x1: u.x0 + (i + 1) * T });
    });
  }
  const sides = boards.filter(b => b.kind === 'side');

  /* наружная пласть боковины: у модуля их две, и обе могут стоять на стыке */
  function sideFace(s) {
    const left = Math.abs(s.x0) < 0.5;
    return left
      ? { xFace: s.x0, dir: 1, inner: s.x0 + T }
      : { xFace: s.x1, dir: -1, inner: s.x1 - T };
  }

  const parts = boards.filter(b => b.kind !== 'side');

  /* дверцы этого корпуса, в его координатах */
  const doors = (M.doors || []).filter(d => {
    const c = (d.x0 + d.x1) / 2;
    return c >= bx0 - 0.5 && c < bx0 + Lc + 0.5;
  }).map(d => ({ x0: d.x0 - bx0, x1: d.x1 - bx0, hinge: d.hinge }));

  const SPEC = {
    confirmat: { dia: 5, cb: 8, dB: 32, op: 'confirmat', label: 'конфирмат' },
    dowel:     { dia: 8, cb: 0, dB: 12, op: 'dowel',     label: 'шкант' },
    pin:       { dia: 5, cb: 0, dB: 12, op: 'pin',       label: 'полкодержатель' },
    plate:     { dia: 5, cb: 0, dB: 13, op: 'plate',     label: 'планка петли' }
  };

  /* точки вдоль ребра: пара «конфирмат + шкант» у каждого торца,
     промежуточные пары через 352 мм; позиции ближе 40 мм не дублируются */
  function ts(L, dowel) {
    const out = [{ t: 32, op: 'confirmat' }];
    if (dowel !== false) out.push({ t: 64, op: 'dowel' });
    out.push({ t: L - 32, op: 'confirmat' });
    if (dowel !== false) out.push({ t: L - 64, op: 'dowel' });
    return out.sort((a, b) => a.t - b.t);
  }

  /**
   * Узел «насквозь через A в торец B».
   * run  — ребро, вдоль которого можно сдвигать узел
   * entry — точка входа на наружной пласти A при t=0
   * dir  — направление от A к B
   * th   — толщина A
   */
  function joint(o) {
    const sp = SPEC[o.spec];
    const P = add(o.run.o, mul(o.run.axis, o.t));
    const E = add(o.entry, sub(P, o.run.o));           /* точка входа */
    /* шкант сидит на 12 мм в каждой детали, а не проходит насквозь */
    const thA = (sp.op === 'dowel') ? sp.dB : o.th;
    const hA = {
      part: o.A, p0: E, dir: o.dir, depth: thA, dia: sp.dia, cb: sp.cb,
      op: sp.op, side: o.sideA || 'out', jid: ++id, role: 'A'
    };
    const hB = o.B ? {
      part: o.B, p0: add(E, mul(o.dir, o.th)), dir: o.dir, depth: sp.dB, dia: sp.dia,
      cb: 0, op: sp.op, side: o.sideB || 'in', jid: id, role: 'B'
    } : null;
    joints.push({ id: id, kind: o.kind, t: o.t, run: o.run, a: hA, b: hB, note: o.note });
    return joints[joints.length - 1];
  }

  /* 1. боковина стоит на дне: снизу через дно в торец боковины */
  sides.forEach(s => {
    const cx = (s.x0 + s.x1) / 2;
    ts(C).forEach(e => joint({
      kind: 'боковина—дно', spec: e.op, t: e.t, A: 'bottom', B: 'side', th: T,
      dir: AX.z, sideA: 'out', sideB: 'end',
      entry: v3(cx, T, z0),
      run: { o: v3(cx, T, 0), axis: AX.y, min: 24, max: C - 24 }
    }));
  });

  /* 2. задняя стенка стоит на дне */
  ts(Lc).forEach(e => joint({
    kind: 'дно—задняя', spec: e.op, t: e.t, A: 'bottom', B: 'back', th: T,
    dir: AX.z, sideA: 'out', sideB: 'end',
    entry: v3(0, C + T / 2, z0),
    run: { o: v3(0, C + T / 2, 0), axis: AX.x, min: 24, max: Lc - 24 }
  }));

  /* 3. боковина ↔ задняя: снаружи через боковину в торец задней */
  sides.forEach(s => {
    const cx = (s.x0 + s.x1) / 2;
    const F = sideFace(s);
    const outward = F.dir;
    const xFace = F.xFace;
    ts(M.Hu).forEach(e => joint({
      kind: 'боковина—задняя', spec: e.op, t: e.t, A: 'side', B: 'back', th: T,
      dir: v3(outward, 0, 0), sideA: 'out', sideB: 'end',
      entry: v3(xFace, C + T / 2, z1),
      run: { o: v3(cx, C + T / 2, z1), axis: AX.z, min: 24, max: M.Hu - 24 }
    }));
  });

  /* 4. боковина ↔ вкладная крышка */
  sides.forEach(s => {
    const cx = (s.x0 + s.x1) / 2;
    const F = sideFace(s);
    const outward = F.dir;
    const xFace = F.xFace;
    ts(C - T).forEach(e => joint({
      kind: 'боковина—крышка', spec: e.op, t: e.t, A: 'side', B: 'intop', th: T,
      dir: v3(outward, 0, 0), sideA: 'out', sideB: 'end',
      entry: v3(xFace, T, z3 - T / 2),
      run: { o: v3(cx, T, z3 - T / 2), axis: AX.y, min: 24, max: C - T - 24 }
    }));
  });

  /* 5. стойки: снизу в торец, сверху в торец */
  parts.forEach(p => {
    const cx = (p.x0 + p.x1) / 2;
    ts(C - T, false).forEach(e => {
      joint({
        kind: 'стойка—дно', spec: e.op, t: e.t, A: 'bottom', B: 'part', th: T,
        dir: AX.z, sideA: 'out', sideB: 'end',
        entry: v3(cx, T, z0),
        run: { o: v3(cx, T, 0), axis: AX.y, min: 24, max: C - T - 24 }
      });
      joint({
        kind: 'стойка—крышка', spec: e.op, t: e.t, A: 'intop', B: 'part', th: T,
        dir: v3(0, 0, -1), sideA: 'out', sideB: 'end',
        entry: v3(cx, T, z3),
        run: { o: v3(cx, T, 0), axis: AX.y, min: 24, max: C - T - 24 }
      });
    });
  });

  /* 6. стойка ↔ задняя: сзади через заднюю в торец стойки */
  parts.forEach(p => {
    const cx = (p.x0 + p.x1) / 2;
    ts(M.Hpart, false).forEach(e => joint({
      kind: 'стойка—задняя', spec: e.op, t: e.t, A: 'back', B: 'part', th: T,
      dir: v3(0, -1, 0), sideA: 'out', sideB: 'end',
      entry: v3(cx, M.D, z1),
      run: { o: v3(cx, 0, z1), axis: AX.z, min: 24, max: M.Hpart - 24 }
    }));
  });

  /* 7. полкодержатели — в каждой опоре секции, с внутренней пласти.
     Если одна стойка держит две секции (две полки на одной высоте), отверстие
     делается сквозным: два встречных по 12 мм в плите 18 мм встретятся. */
  const shelf = (M.parts || []).find(p => p.role === 'shelf');
  if (shelf) {
    const u = M.pinZ - z1;               /* высота от низа каркаса */
    const y1 = 48 + 50;                  /* полка: 48…482, по 50 мм от кромок */
    const y2 = C - 50;
    const sorted = boards.slice().sort((a, b) => a.x0 - b.x0);
    const pinAt = {};
    for (let i = 0; i < sorted.length - 1; i++) {
      const left = sorted[i], right = sorted[i + 1];
      if (right.x0 - left.x1 < 1) continue;
      [[left, left.x1, -1], [right, right.x0, +1]].forEach(pair => {
        const bd = pair[0], xf = pair[1], d = pair[2];
        const role = bd.kind === 'side' ? 'side' : 'part';
        [y1, y2].forEach(y => {
          const key = bd.x0 + '|' + Math.round(y) + '|' + Math.round(u);
          if (pinAt[key]) {                  /* та же доска, та же точка с другой стороны */
            pinAt[key].a.depth = T;
            pinAt[key].a.through = true;
            return;
          }
          const j = joint({
            kind: 'полкодержатель', spec: 'pin', t: u, A: role, B: null, th: 12,
            dir: v3(d, 0, 0), sideA: 'in',
            entry: v3(xf, y, z1),
            run: { o: v3(xf, y, z1), axis: AX.z, min: u, max: u },
            note: '50 мм от кромки полки'
          });
          j.a.op = 'pin';
          pinAt[key] = j;
        });
      });
    }
  }

  /* 8. петли: чашка в дверце + планка на ближайшей стойке/боковине */
  if ((M.parts || []).some(p => p.role === 'door')) {
    const hz = hingeZs(M);

    /* все пласти, на которых может стоять планка */
    const faces = [];
    boards.forEach(b => {
      faces.push({ x: b.x0, n: -1 });
      faces.push({ x: b.x1, n: +1 });
    });
    function plateFace(edge, left) {
      const want = left ? +1 : -1;               /* нормаль пласти — к дверце */
      const ok = faces.filter(f => f.n === want);
      const near = left
        ? ok.filter(f => f.x <= edge + 1).sort((a, b) => b.x - a.x)[0]
        : ok.filter(f => f.x >= edge - 1).sort((a, b) => a.x - b.x)[0];
      if (near) return near;
      return left ? ok.slice().sort((a, b) => a.x - b.x)[0]
                  : ok.slice().sort((a, b) => b.x - a.x)[0];
    }

    const usedPlate = {};
    doors.forEach((d, di) => {
      const left = d.hinge === 'L';
      const dx = left ? d.x0 + 22.5 : d.x1 - 22.5;
      const edge = left ? d.x0 : d.x1;
      const want = left ? 1 : -1;
      const cands = faces.filter(f => f.n === want)
        .sort((a, b) => Math.abs(a.x - edge) - Math.abs(b.x - edge));

      hz.forEach(z => {
        let pick = null, host = null;
        for (const c of cands) {
          const bd = boards.find(b => (c.n > 0 ? Math.abs(b.x1 - c.x) < 0.5 : Math.abs(b.x0 - c.x) < 0.5));
          if (!bd) continue;
          const key = bd.x0 + '|' + Math.round(z);
          if (usedPlate[key]) continue;          /* на этой доске уже есть планка на этой высоте */
          pick = c; host = bd; usedPlate[key] = 1; break;
        }
        if (!pick) return;
        if (Math.abs(pick.x - edge) > 50) {
          M.__prisWarn = M.__prisWarn || [];
          const msg = 'Дверь ' + (di + 1) + ': планка петли на ' + Math.round(Math.abs(pick.x - edge)) +
            ' мм от кромки — плечо петли не достанет. Нужна стойка у кромки или другая разбивка дверей.';
          if (M.__prisWarn.indexOf(msg) < 0) M.__prisWarn.push(msg);
        }
        const role = host.kind === 'side' ? 'side' : 'part';
        const j = { id: ++id, kind: 'петля', t: 0, nopair: true, run: { o: v3(dx, 0, z), axis: AX.x, min: 0, max: 0 } };
        j.a = { part: 'door', p0: v3(dx, T, z), dir: v3(0, -1, 0), depth: 13, dia: 35, cb: 0, op: 'cup', side: 'in', jid: j.id, role: 'A', ox: d.x0, hinge: d.hinge };
        j.b = { part: role, p0: v3(pick.x, 37, z), dir: v3(-pick.n, 0, 0), depth: 13, dia: 5, cb: 0, op: 'plate', side: 'in', jid: j.id, role: 'B' };
        joints.push(j);
      });
    });
  }

  /* привязка отверстий к конкретной доске (стойки бывают сдвоенными) */
  joints.forEach(j => {
    [j.a, j.b].forEach(h => {
      if (!h) return;
      if (h.part === 'side' || h.part === 'part') {
        const q = add(h.p0, mul(h.dir, 2));
        const b = boards.find(b => q.x >= b.x0 - 0.01 && q.x <= b.x1 + 0.01);
        h.bid = b ? b.x0 : -1;
      }
    });
  });

  return joints;
}

/* снаружи: список корпусов. В модульной тумбе каждый модуль считается отдельно,
   поэтому его присадка не зависит от соседей и от общей длины */
function build(M) {
  if (!M.modular) return [{ w: M.Lc, joints: buildBox(M, { x0: 0, x1: M.Lc, w: M.Lc }) }];
  const groups = [], seen = {};
  (M.modules || []).forEach(m => {
    const inner = (M.doors || []).filter(d => {
      const c = (d.x0 + d.x1) / 2;
      return c >= m.x0 - 0.5 && c < m.x1 + 0.5;
    }).map(d => d.hinge).join('');
    const key = Math.round(m.w) + '|' + inner;
    if (seen[key]) return;
    seen[key] = 1;
    groups.push({ w: m.w, joints: buildBox(M, { x0: m.x0, x1: m.x1, w: m.w }) });
  });
  return groups;
}

/* высоты петель: 100 от торцов, промежуточные не реже 600 */
function hingeZs(M) {
  const H = M.doorH, a = 100, b = H - 100, span = b - a;
  const k = Math.max(1, Math.ceil(span / 600));
  const out = [];
  for (let i = 0; i <= k; i++) out.push(a + span * i / k);
  return out;
}

/* ---------- коллизии ---------- */
function collide(j1, j2) {
  if (j1 === j2) return null;
  const s1 = [j1.a, j1.b].filter(Boolean);
  const s2 = [j2.a, j2.b].filter(Boolean);
  let worst = null;
  for (const h1 of s1) for (const h2 of s2) {
    if (h1.part !== h2.part) continue;
    if (h1.bid !== undefined && h2.bid !== undefined && h1.bid !== h2.bid) continue;
    const q1 = add(h1.p0, mul(h1.dir, h1.depth));
    const q2 = add(h2.p0, mul(h2.dir, h2.depth));
    const d = segDist(h1.p0, q1, h2.p0, q2);
    const need = (h1.dia + h2.dia) / 2 + CLEAR;
    if (d < need - 1e-6) {
      if (!worst || d / need < worst.ratio) worst = { d: d, need: need, ratio: d / need, a: h1.part };
    }
  }
  return worst;
}

function countJoints(joints) {
  let n = 0, list = [];
  for (let i = 0; i < joints.length; i++)
    for (let j = i + 1; j < joints.length; j++) {
      const c = collide(joints[i], joints[j]);
      if (c) { n++; list.push([joints[i], joints[j], c]); }
    }
  return { n: n, list: list };
}

function asGroups(data) {
  return Array.isArray(data) ? data : [{ w: 0, joints: data }];
}

function solve(data, log) {
  let moved = 0;
  asGroups(data).forEach(g => { moved += solveJoints(g.joints, log); });
  return moved;
}

function countCollisions(data) {
  let n = 0, list = [];
  asGroups(data).forEach(g => {
    const r = countJoints(g.joints);
    n += r.n;
    list = list.concat(r.list);
  });
  return { n: n, list: list };
}

function solveJoints(joints, log) {
  let moved = 0;
  for (let pass = 0; pass < 60; pass++) {
    let any = false;
    for (let i = 0; i < joints.length; i++) {
      for (let j = i + 1; j < joints.length; j++) {
        const c = collide(joints[i], joints[j]);
        if (!c) continue;
        const cand = [joints[i], joints[j]].filter(x => x.run.max - x.run.min > 1);
        if (!cand.length) continue;
        const J = cand[cand.length - 1];
        const step = (J.t + 16 <= J.run.max) ? 16 : -16;
        const nt = Math.min(J.run.max, Math.max(J.run.min, J.t + step));
        if (nt === J.t) continue;
        if (log) log.push(J.kind + ' #' + J.id + ': ' + J.t + ' -> ' + nt + '  (зазор ' + c.d.toFixed(1) + ' < ' + c.need.toFixed(1) + ')');
        J.t = nt;
        if (J.a) J.a.p0 = add(J.a.p0, mul(J.run.axis, step));
        if (J.b) J.b.p0 = add(J.b.p0, mul(J.run.axis, step));
        any = true; moved++;
      }
    }
    if (!any) break;
  }
  return moved;
}

/* ---------- локальные системы деталей ---------- */
function frame(part, M, boxW) {
  const T = M.T, C = M.C, Lc = (boxW == null ? M.Lc : boxW);
  if (part === 'bottom') return { o: v3(0, T, M.zBot), u: AX.x, v: AX.y, n: AX.z, w: Lc, h: C, flip: false, uName: 'длина', vName: 'глубина' };
  if (part === 'side')   return { o: v3(0, T, M.zBotTop), u: AX.z, v: AX.y, n: AX.x, w: M.Hu, h: C, flip: false, uName: 'высота', vName: 'глубина' };
  if (part === 'back')   return { o: v3(T, C, M.zBotTop), u: AX.x, v: AX.z, n: AX.y, w: Lc - 2 * T, h: M.Hu, flip: true, uName: 'длина', vName: 'высота' };
  if (part === 'intop')  return { o: v3(T, T, M.zU - T), u: AX.x, v: AX.y, n: AX.z, w: Lc - 2 * T, h: C - T, flip: false, uName: 'длина', vName: 'глубина' };
  if (part === 'part')   return { o: v3(0, T, M.zBotTop), u: AX.z, v: AX.y, n: AX.x, w: M.Hpart, h: C - T, flip: false, uName: 'высота', vName: 'глубина' };
  if (part === 'door')   return { o: v3(0, 0, M.doorZ0), u: AX.x, v: AX.z, n: AX.y, w: M.doorW, h: M.doorH, flip: true, uName: 'ширина', vName: 'высота' };
  return null;
}

/* имя ребра зависит от того, что отложено по оси:
   высота — низ/верх, глубина — перед/зад, длина/ширина — левый/правый */
function edgeName(axisName, low) {
  if (axisName === 'высота') return low ? 'низ' : 'верх';
  if (axisName === 'глубина') return low ? 'перед' : 'зад';
  return low ? 'левый' : 'правый';
}

function localize(h, F) {
  const rel = sub(h.p0, F.o);
  const u = dot(rel, F.u) - (h.ox || 0), v = dot(rel, F.v), w = dot(rel, F.n);
  const faceHole = Math.abs(dot(h.dir, F.n)) > 0.5;
  let edge = null, pos = 0, axisName = '', edgeAxis = null, edgeLow = false;
  if (!faceHole) {
    if (u < 1) { edgeAxis = 'u'; edgeLow = true; }
    else if (u > F.w - 1) { edgeAxis = 'u'; edgeLow = false; }
    else if (v < 1) { edgeAxis = 'v'; edgeLow = true; }
    else if (v > F.h - 1) { edgeAxis = 'v'; edgeLow = false; }
    else { edgeAxis = 'u'; edgeLow = true; }
    axisName = edgeAxis === 'u' ? F.vName : F.uName;
    pos = edgeAxis === 'u' ? v : u;
    edge = edgeName(edgeAxis === 'u' ? F.uName : F.vName, edgeLow);
  }
  return { u: u, v: v, w: w, faceHole: faceHole, edge: edge, pos: pos,
           axisName: axisName, edgeAxis: edgeAxis, edgeLow: edgeLow };
}

/* ---------- карта ---------- */
const OP_LABEL = {
  confirmat: 'конфирмат', dowel: 'шкант', pin: 'полкодержатель',
  plate: 'планка петли', cup: 'чашка петли'
};

/* отверстия одной детали: корпус выбирается по её ширине, дубли снимаются */
function holesFor(p, M, data, variant) {
  const T = M.T;
  const groups = asGroups(data);
  const wide = p.role === 'bottom' || p.role === 'back' || p.role === 'intop';
  const wantW = p.role === 'bottom' ? p.w : (wide ? p.w + 2 * T : null);
  let gs = groups;
  if (wide && wantW != null) {
    const f = groups.filter(g => Math.abs(g.w - wantW) < 1.5);
    if (f.length) gs = f;
  }
  const F = frame(p.role, M, gs[0] ? gs[0].w : M.Lc);
  const seen = {}, list = [];
  gs.forEach(g => g.joints.forEach(j => {
    [j.a, j.b].forEach(h => {
      if (!h || h.part !== p.role) return;
      if (p.role === 'door' && variant && h.hinge && h.hinge !== variant) return;
      const l = F ? localize(h, F) : null;
      const key = l
        ? [Math.round(l.u * 10), Math.round(l.v * 10), h.dia, h.op, h.side, l.faceHole ? 1 : 0].join('|')
        : [h.op, h.dia].join('|');
      if (seen[key]) return;
      seen[key] = 1;
      list.push({ h: h, l: l });
    });
  }));
  return { F: F, list: list };
}

/* сводка: сколько чего сверлить в торец и в пласть */
function stats(p, M, data, opts) {
  opts = opts || {};
  const r = holesFor(p, M, data, opts.variant || null);
  const out = { end: {}, face: {}, total: r.list.length };
  r.list.forEach(it => {
    const k = (it.l && it.l.faceHole) ? 'face' : 'end';
    out[k][it.h.op] = (out[k][it.h.op] || 0) + 1;
  });
  return out;
}

function render(p, M, data, opts) {
  opts = opts || {};
  const LANG = opts.lang || 'ru';
  const T = M.T;
  const pcs = LANG === 'en' ? 'pcs' : 'шт';
  const variant = opts.variant || null;
  const qty = opts.qty != null ? opts.qty : p.qty;

  const HF = holesFor(p, M, data, variant);
  const F = HF.F;
  const list = HF.list;

  const titleAdd = variant ? (LANG === 'en' ? (variant === 'L' ? ' — left hung' : ' — right hung')
                                            : (variant === 'L' ? ' — навеска слева' : ' — навеска справа')) : '';
  const EDGE_SIDES = {
    all: 'по периметру', front_lr: 'перед, лево, право', front_l: 'перед, лево',
    front_r: 'перед, право', front: 'перед'
  };
  const edgeTxt = p.edge
    ? 'кромка ' + f1(p.edge) + (EDGE_SIDES[p.edgeMode] ? ' · ' + EDGE_SIDES[p.edgeMode] : '')
    : 'без кромки';
  const noteAdd = p.note ? ' · ' + tstr(p.note) : '';
  const head = '<h2 class="ct" style="margin:26px 0 8px">' + p.id + '. ' + tstr(p.name) + noteAdd + titleAdd +
    ' <span class="hint">' + qty + ' ' + pcs + ' · ' + f0(p.w) + ' × ' + f0(p.h) + ' × ' + T + ' мм · ' + edgeTxt + '</span></h2>';

  if (!F || !list.length) {
    return '<div style="width:100%;margin:0 0 26px">' + head +
      '<svg viewBox="0 0 900 110" width="100%" xmlns="http://www.w3.org/2000/svg">' +
      '<rect x="330" y="14" width="240" height="70" fill="#f8f4ec" stroke="#7d6a50" stroke-width="1.2" rx="2"/>' +
      '<text x="450" y="54" text-anchor="middle" font-size="13" font-family="Segoe UI" fill="#8a7b66">' +
      (LANG === 'en' ? 'no drilling' : 'без присадки') + '</text></svg></div>';
  }

  list.forEach((it, i) => { it.no = i + 1; });
  list.sort((a, b) => (a.l.v - b.l.v) || (a.l.u - b.l.u));

  /* ---------- лист ---------- */
  const padL = 104, padR = 104, padT = 64, padB = 40;
  const iw = 900 - padL - padR, ih = 356;
  const sc = Math.min(iw / Math.max(F.w, 1), ih / Math.max(F.h, 1));
  const rw = F.w * sc, rh = F.h * sc;
  const ox = padL + (iw - rw) / 2, oy = padT + (ih - rh) / 2;
  const X = u => ox + u * sc;
  const Yv = v => F.flip ? (oy + rh - v * sc) : (oy + v * sc);

  const num = v => String(Math.round(v * 10) / 10);
  const line = (x1, y1, x2, y2, w, c) =>
    '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) +
    '" stroke="' + (c || '#3d3a35') + '" stroke-width="' + (w || 1) + '"/>';

  let s = '';
  s += '<rect x="' + ox.toFixed(1) + '" y="' + oy.toFixed(1) + '" width="' + rw.toFixed(1) + '" height="' + rh.toFixed(1) + '" fill="#f8f4ec" stroke="#7d6a50" stroke-width="1.2" rx="2"/>';

  /* кромкование: полоса + волнистая линия */
  if (p.edge && p.edgeMode) {
    const bandLine = (x1, y1, x2, y2) => {
      let o = '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) +
        '" stroke="#d97706" stroke-width="7" opacity=".22" stroke-linecap="round"/>';
      if (typeof wavyLine === 'function') o += wavyLine(x1, y1, x2, y2);
      return o;
    };
    const top = () => bandLine(ox, oy, ox + rw, oy);
    const left = () => bandLine(ox, oy, ox, oy + rh);
    const right = () => bandLine(ox + rw, oy, ox + rw, oy + rh);
    const bottom = () => bandLine(ox, oy + rh, ox + rw, oy + rh);
    const m = p.edgeMode;
    if (m === 'all') s += top() + right() + bottom() + left();
    else {
      s += top();
      if (m === 'front_lr') s += left() + right();
      else if (m === 'front_l') s += left();
      else if (m === 'front_r') s += right();
    }
  }

  /* ---------- отверстия ---------- */
  list.forEach(it => {
    const h = it.h, l = it.l;
    if (!l.faceHole) return;
    const cx = X(l.u), cy = Yv(l.v);
    const r = Math.max(2.6, Math.min(10, h.dia * sc / 2));
    const col = h.side === 'in' ? '#0f9d63' : '#7d6a50';
    s += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="#fff" stroke="' + col + '" stroke-width="1.1"/>';
    if (h.cb) s += '<circle cx="' + cx.toFixed(1) + '" cy="' + cy.toFixed(1) + '" r="' + (r * 1.5).toFixed(1) + '" fill="none" stroke="' + col + '" stroke-width=".7" stroke-dasharray="2 2"/>';
    s += '<text x="' + (cx + r + 2).toFixed(1) + '" y="' + (cy - r - 2).toFixed(1) + '" font-size="9" font-family="Consolas" fill="' + col + '">' + it.no + '</text>';
  });

  list.forEach(it => {
    const h = it.h, l = it.l;
    if (l.faceHole) return;
    const L = h.dia <= 5 ? 9 : 12;
    let x1, y1, x2, y2, tx, ty, anchor = 'start';
    if (l.edgeAxis === 'u') {
      const xx = X(l.edgeLow ? 0 : F.w);
      const right = xx > ox + rw / 2;
      x1 = xx - L / 2; y1 = Yv(l.pos); x2 = xx + L / 2; y2 = Yv(l.pos);
      tx = xx + (right ? -9 : 9); ty = Yv(l.pos) - 6;
      anchor = right ? 'end' : 'start';
    } else {
      const yy = Yv(l.edgeLow ? 0 : F.h);
      const below = yy > oy + rh / 2;
      x1 = X(l.pos); y1 = yy - L / 2; x2 = X(l.pos); y2 = yy + L / 2;
      tx = X(l.pos) + 6; ty = yy + (below ? 13 : -6);
      anchor = 'start';
    }
    s += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#7d6a50" stroke-width="2.8" stroke-linecap="round"/>';
    s += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" font-size="9" font-family="Consolas" fill="#7d6a50" text-anchor="' + anchor + '">' + it.no + '</text>';
  });

  /* ---------- размеры: цепочка от ближайшего края ---------- */
  const DIM = 30, OFF2 = 26;
  function sideOf(l) {
    if (l.edgeAxis === 'u') return l.edgeLow ? 'left' : 'right';
    const lowTop = Yv(0) < Yv(F.h);
    return (l.edgeLow === lowTop) ? 'top' : 'bottom';
  }
  const bySide = { left: [], right: [], top: [], bottom: [] };
  list.forEach(it => { if (it.l.faceHole === false) bySide[sideOf(it.l)].push(it.l.pos); });

  function chain(side) {
    const pts0 = bySide[side];
    if (!pts0.length) return '';
    const horizontal = (side === 'top' || side === 'bottom');
    const len = horizontal ? F.w : F.h;
    const pts = pts0.slice().sort((a, b) => a - b).filter((v, i, a) => i === 0 || v - a[i - 1] > 0.6);
    const all = [0].concat(pts).concat([len]);
    let o = '';
    if (side === 'left' || side === 'right') {
      const xd = side === 'left' ? ox - DIM : ox + rw + DIM;
      const dirIn = side === 'left' ? 1 : -1;
      all.forEach(t => { o += line(xd - dirIn * 4, Yv(t), ox + (side === 'left' ? 0 : rw), Yv(t), 0.6, '#b9b3a8'); });
      o += line(xd, Yv(0), xd, Yv(len), 0.9);
      for (let i = 0; i < all.length; i++) {
        const y = Yv(all[i]);
        o += line(xd - 3, y + 3, xd + 3, y - 3, 1.1);
        if (i < all.length - 1) {
          const d = all[i + 1] - all[i];
          if (d < 0.5) continue;
          const ym = (Yv(all[i]) + Yv(all[i + 1])) / 2;
          o += '<text transform="rotate(-90 ' + xd.toFixed(1) + ' ' + ym.toFixed(1) + ')" x="' + xd.toFixed(1) + '" y="' + (ym - 3).toFixed(1) +
            '" text-anchor="middle" font-size="10.5" font-family="Consolas" fill="#3d3a35">' + num(d) + '</text>';
        }
      }
    } else {
      const yd = side === 'top' ? oy - DIM : oy + rh + DIM;
      const dirIn = side === 'top' ? 1 : -1;
      all.forEach(t => { o += line(X(t), yd - dirIn * 4, X(t), oy + (side === 'top' ? 0 : rh), 0.6, '#b9b3a8'); });
      o += line(X(0), yd, X(len), yd, 0.9);
      for (let i = 0; i < all.length; i++) {
        const x = X(all[i]);
        o += line(x - 3, yd + 3, x + 3, yd - 3, 1.1);
        if (i < all.length - 1) {
          const d = all[i + 1] - all[i];
          if (d < 0.5) continue;
          const xm = (X(all[i]) + X(all[i + 1])) / 2;
          o += '<text x="' + xm.toFixed(1) + '" y="' + (yd - 4).toFixed(1) + '" text-anchor="middle" font-size="10.5" font-family="Consolas" fill="#3d3a35">' + num(d) + '</text>';
        }
      }
    }
    return o;
  }

  const hasTop = bySide.top.length > 0, hasLeft = bySide.left.length > 0;
  s += chain('top') + chain('bottom') + chain('left') + chain('right');

  /* габаритные размеры */
  const yTotal = oy - DIM - (hasTop ? OFF2 : 0);
  s += line(X(0), yTotal, X(F.w), yTotal, 0.9);
  s += line(X(0), yTotal - 4, X(0), oy - 2, 0.6, '#b9b3a8') + line(X(F.w), yTotal - 4, X(F.w), oy - 2, 0.6, '#b9b3a8');
  s += '<path d="M' + X(0) + ',' + yTotal + ' l6,-2.6 l0,5.2 z" fill="#3d3a35"/>';
  s += '<path d="M' + X(F.w) + ',' + yTotal + ' l-6,-2.6 l0,5.2 z" fill="#3d3a35"/>';
  s += '<text x="' + ((X(0) + X(F.w)) / 2).toFixed(1) + '" y="' + (yTotal - 4).toFixed(1) + '" text-anchor="middle" font-size="11" font-family="Consolas" fill="#3d3a35">' + f0(F.w) + '</text>';

  const xTotal = ox - DIM - (hasLeft ? OFF2 : 0);
  s += line(xTotal, Yv(0), xTotal, Yv(F.h), 0.9);
  s += line(xTotal - 4, Yv(0), ox - 2, Yv(0), 0.6, '#b9b3a8') + line(xTotal - 4, Yv(F.h), ox - 2, Yv(F.h), 0.6, '#b9b3a8');
  s += '<path d="M' + xTotal + ',' + Yv(0) + ' l-2.6,6 l5.2,0 z" fill="#3d3a35"/>';
  s += '<path d="M' + xTotal + ',' + Yv(F.h) + ' l-2.6,-6 l5.2,0 z" fill="#3d3a35"/>';
  s += '<text transform="rotate(-90 ' + xTotal.toFixed(1) + ' ' + ((Yv(0) + Yv(F.h)) / 2).toFixed(1) + ')" x="' + xTotal.toFixed(1) + '" y="' + (((Yv(0) + Yv(F.h)) / 2) - 4).toFixed(1) +
    '" text-anchor="middle" font-size="11" font-family="Consolas" fill="#3d3a35">' + f0(F.h) + '</text>';

  /* база */
  s += '<path d="M' + (ox - 12) + ',' + (oy + rh + 12) + ' L' + ox + ',' + (oy + rh) + ' L' + (ox - 12) + ',' + (oy + rh) + ' Z" fill="#4d6bfe" opacity=".85"/>';
  s += '<text x="' + (ox - 15) + '" y="' + (oy + rh + 15) + '" font-size="9" font-family="Consolas" fill="#3a55df" text-anchor="end">0,0 — база</text>';

  /* ---------- таблица в стиле Базиса ---------- */
  const OP_TITLE = { confirmat: 'конфирмат', dowel: 'шкант', pin: 'полкодержатель', plate: 'планка петли', cup: 'чашка Ø35' };
  const groups = [], gmap = {};
  list.forEach(it => {
    const h = it.h;
    const key = h.op + '|' + h.dia + '|' + h.depth;
    if (!gmap[key]) { gmap[key] = { op: h.op, dia: h.dia, depth: h.depth, items: [] }; groups.push(gmap[key]); }
    gmap[key].items.push(it);
  });
  const gOrder = { confirmat: 0, dowel: 1, pin: 2, plate: 3, cup: 4 };
  const gk = x => (gOrder[x.op] != null ? gOrder[x.op] : 9);
  groups.sort((a, b) => gk(a) - gk(b) || a.dia - b.dia);

  const edgeWord = (axisName, low) => edgeName(axisName, low);
  function nearText(it) {
    const l = it.l;
    const out = [];
    if (l.faceHole) {
      const du = l.u, dr = F.w - l.u;
      out.push(Math.round(du <= dr ? du : dr) + ' от ' + edgeWord(F.uName, du <= dr));
      const dv = l.v, db = F.h - l.v;
      out.push(Math.round(dv <= db ? dv : db) + ' от ' + edgeWord(F.vName, dv <= db));
    } else {
      const len = (l.axisName === F.uName) ? F.w : F.h;
      const d = Math.min(l.pos, len - l.pos);
      out.push(Math.round(d) + ' от ' + edgeWord(l.axisName, l.pos <= len - l.pos));
    }
    return out.join(', ');
  }

  const rowH = 18.5, tblTop = padT + ih + 52;
  const cols = [0, 34, 70, 108, 152, 188, 218, 282];
  const header = ['№', 'D', 'H', 'X', 'Y', 'Z', 'Тип', 'от края'];
  let table = '<g font-family="Consolas,monospace" font-size="11.5" fill="#3d3a35">';
  header.forEach((t, i) => {
    table += '<text x="' + (10 + cols[i]) + '" y="' + (tblTop - 9) + '" font-family="Segoe UI" font-size="9.5" fill="#8b919b">' + t + '</text>';
  });
  table += line(10, tblTop - 4, 890, tblTop - 4, 1, '#d8dae1');
  let y = tblTop + 12;
  groups.forEach(g => {
    const title = g.items.length + ' отв  Ø' + g.dia + '×' + g.depth + '  ' + (OP_TITLE[g.op] || g.op);
    table += '<rect x="6" y="' + (y - 12) + '" width="884" height="17" fill="#eef1f7"/>';
    table += '<text x="12" y="' + y + '" font-family="Segoe UI" font-size="10.5" fill="#3a55df">' + title + '</text>';
    y += 18;
    g.items.forEach(it => {
      const h = it.h, l = it.l;
      const x = l.faceHole ? l.u : l.pos;
      const yy = l.faceHole ? l.v : null;
      const z = l.faceHole ? '—' : Math.round(T / 2);
      const typ = l.faceHole ? 'пласть' : 'торец';
      table += '<text x="' + (10 + cols[0]) + '" y="' + y + '">' + it.no + '</text>';
      table += '<text x="' + (10 + cols[1]) + '" y="' + y + '">' + h.dia + '</text>';
      table += '<text x="' + (10 + cols[2]) + '" y="' + y + '">' + h.depth + '</text>';
      table += '<text x="' + (10 + cols[3]) + '" y="' + y + '">' + num(x) + '</text>';
      table += '<text x="' + (10 + cols[4]) + '" y="' + y + '">' + (yy === null ? '—' : num(yy)) + '</text>';
      table += '<text x="' + (10 + cols[5]) + '" y="' + y + '">' + z + '</text>';
      table += '<text x="' + (10 + cols[6]) + '" y="' + y + '" font-family="Segoe UI" font-size="10" fill="#7a828d">' + typ + '</text>';
      table += '<text x="' + (10 + cols[7]) + '" y="' + y + '" font-family="Segoe UI" font-size="10.5">' + nearText(it) + (h.through ? ' · сквозн.' : '') + '</text>';
      y += rowH;
    });
  });
  table += '</g>';
  const H = y + 26;

  const note = '<text x="10" y="' + (H - 8) + '" font-size="10" font-family="Segoe UI" fill="#8b919b">' +
    'X/Y — от базы 0,0 (для станка); «от края» — размер до ближайшей кромки (для разметки вручную). ' +
    'Зелёные отверстия — с внутренней пласти, коричневые — с наружной.</text>';

  return '<div style="width:100%;margin:0 0 30px">' + head +
    '<svg viewBox="0 0 900 ' + H + '" width="100%" xmlns="http://www.w3.org/2000/svg">' + s + table + note + '</svg></div>';
}

function drillPartsHtml(M){
  if(!M.__pris){
    M.__pris = PRIS.build(M);
    PRIS.solve(M.__pris);
  }
  const warn = (M.__prisWarn && M.__prisWarn.length)
    ? '<div class="warnbox">' + M.__prisWarn.map(w=>'<div>· '+w+'</div>').join('') + '</div>'
    : '';
  const doorsL = (M.doors || []).filter(d => d.hinge === 'L').length;
  const doorsR = (M.doors || []).length - doorsL;
  const cards = [];
  M.parts.forEach(p => {
    if(p.role === 'door'){
      if(doorsL) cards.push(PRIS.render(p, M, M.__pris, {lang:LANG, variant:'L', qty:doorsL}));
      if(doorsR) cards.push(PRIS.render(p, M, M.__pris, {lang:LANG, variant:'R', qty:doorsR}));
    } else {
      cards.push(PRIS.render(p, M, M.__pris, {lang:LANG}));
    }
  });
  return warn + '<div style="display:flex;flex-direction:column;gap:0;padding:10px 2px 0">'
    + cards.join('') + '</div>';
}

  const rows = M.parts.map(p => {

function downloadCSV(){
  const M = MODEL;
  const rows = [LANG==='en'
    ? ['№','Part','Finished length, mm','Finished width, mm','Cut length, mm','Cut width, mm','Edge, mm','Qty','Area, m²','Note']
    : ['№','Деталь','Длина, мм','Ширина, мм','Заготовка, длина, мм','Заготовка, ширина, мм','Кромка, мм','Кол-во','Площадь, м²','Примечание']];
  M.parts.forEach(p=>rows.push([p.id,tstr(p.name),Math.round(p.w),Math.round(p.h),p.cutW,p.cutH,
    p.edge ? `${p.edge}${edgeSides(p.edgeMode)>1?'×'+edgeSides(p.edgeMode):''}` : '',p.qty,(p.cutW*p.cutH*p.qty/1e6).toFixed(3),tstr(p.note)]));
  rows.push([]);
  rows.push([LANG==='en' ? 'Total area, m²' : 'Итого площади, м²', M.area.toFixed(3)]);
  rows.push([LANG==='en' ? `Sheets ${M.SW}x${M.SH}` : `Листов ${M.SW}x${M.SH}`, M.sheets.length]);
  rows.push([LANG==='en' ? 'Design weight, kg' : 'Расчётный вес, кг', Math.round(M.wDesign)]);
  const csv = String.fromCharCode(65279) + rows.map(r=>r.join(';')).join(String.fromCharCode(13,10));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = LANG==='en' ? 'cutting-stand.csv' : 'раскрой-тумба.csv';
  document.body.appendChild(a); a.click(); a.remove();
}

  addLeg(I.shelf, tstr('полка'));
  leg.sort((a,b)=>a[0]-b[0]);
  const legTxt = leg.map(x=>x[1]).join(' · ');

  const caps = {
    tumba: LANG==='en'
      ? `${M.modular ? `${M.modules.length} modules` : `${M.n} section${M.n===1?'':'s'} of ${f0(M.pitch)} mm`}. Doors ${f0(M.doorW)}×${f0(M.doorH)}. Top panel ${f0(M.topW)}×${f0(M.topD)}. Height ${M.H}.`
      : `${M.modular ? `${M.modules.length} модулей` : `${M.n} ${pl(M.n,'секция','секции','секций')} по ${f0(M.pitch)} мм`}. Дверцы ${f0(M.doorW)}×${f0(M.doorH)}. Крышка ${f0(M.topW)}×${f0(M.topD)}. Высота ${M.H}.`,
    frame: LANG==='en'
      ? `${legTxt}. Doors removed (${M.doorN} pcs), top raised, feet not shown.`
      : `${legTxt}. Сняты дверцы (${M.doorN} шт), крышка поднята, опоры не показаны.`,
    front: LANG==='en'
      ? `Bays ${f0(M.clear)}. Door gap ${K.DGAP} mm. Shadow line ${K.TGAP} mm. Height ${M.H}.`
      : `Секции ${f0(M.clear)}. Зазор дверец ${K.DGAP} мм. Теневая линия ${K.TGAP} мм. Высота ${M.H}.`,
    side: LANG==='en'
      ? `Depth ${f0(M.D)}. Door ${M.T}, carcass ${f0(M.C)}. Shelf ${f0(M.parts.find(p=>p.role==='shelf').w)}×${f0(M.parts.find(p=>p.role==='shelf').h)} at ${f0(M.shelfZ0)} mm.`
      : `Глубина ${f0(M.D)}. Дверца ${M.T}, корпус ${f0(M.C)}. Полка ${f0(M.parts.find(p=>p.role==='shelf').w)}×${f0(M.parts.find(p=>p.role==='shelf').h)} на ${f0(M.shelfZ0)} мм.`,
    detail: ``
  };
  $('#vtabs').innerHTML = tabs.map(([k,n])=>`<button data-tab="${k}" class="${state.tab===k?'on':''}">${n}</button>`).join('');
  $('#vtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.tab=b.dataset.tab;
    history.replaceState(null,'','#'+state.tab);
    renderView(MODEL);
  });
  const capTxt = caps[state.tab] || '';
  $('#vcap').innerHTML = capTxt;
  $('#vcap').style.display = capTxt ? '' : 'none';

  let svg='';
  if(state.tab==='tumba')      svg = drawIso(M, {feet:true, plinth:true, doors:true, tank:true, dims:true, color:state.color});
  else if(state.tab==='frame') svg = drawIso(M, {feet:true, plinth:true, doors:false, tank:false, badges:true, explode:240, color:state.color});
  else if(state.tab==='front') svg = drawFront(M, {color:state.color});
  else if(state.tab==='side')  svg = drawSide(M, {color:state.color});
  else                         svg = drawDetail(M);
  $('#stage').innerHTML = svg;
}

function drawTank(M){
  const W=1000, Hh=520;
  const g=M.glass;
  let s='';
  /* ---- фронт ---- */
  const sF = Math.min(430/M.L, 340/M.Ht);
  const ox = 90 + (470 - M.L*sF)/2, oy = 70 + (340 - M.Ht*sF)/2;
  const X=x=>ox+x*sF, Y=z=>oy+(M.Ht-z)*sF;
  const R=(x0,z0,x1,z1,at)=>`<rect x="${X(x0).toFixed(1)}" y="${Y(z1).toFixed(1)}" width="${((x1-x0)*sF).toFixed(1)}" height="${((z1-z0)*sF).toFixed(1)}" ${at}/>`;
  s += R(0,0,M.L,M.Ht,'fill="rgba(150,215,235,.18)" stroke="#4f9fbb" stroke-width="1.4"');
  s += R(g.w,g.b,M.L-g.w,M.hw,'fill="rgba(70,150,180,.26)"');
  s += R(g.w,g.b,M.L-g.w,M.soilD,'fill="#5c4b38"');
  if(g.ribs) s += R(0,M.Ht-22,M.L,M.Ht,'fill="none" stroke="#8d9096" stroke-width="2" stroke-dasharray="7 4"');
  if(g.braces){
    for(let i=1;i<=g.braces;i++){
      const x=M.L*i/(g.braces+1);
      s += `<line x1="${X(x).toFixed(1)}" y1="${Y(M.Ht).toFixed(1)}" x2="${X(x).toFixed(1)}" y2="${Y(M.Ht-34).toFixed(1)}" stroke="#5b6068" stroke-width="3"/>`;
    }
  }
  /* размеры */
  s += `<line x1="${X(0)}" y1="${Y(0)+30}" x2="${X(M.L)}" y2="${Y(0)+30}" stroke="#b3b9c4"/>`;
  s += `<text x="${(X(0)+X(M.L))/2}" y="${Y(0)+44}" class="lbl" text-anchor="middle">${f0(M.L)}</text>`;
  s += `<line x1="${X(0)-34}" y1="${Y(0)}" x2="${X(0)-34}" y2="${Y(M.Ht)}" stroke="#b3b9c4"/>`;
  s += `<text x="${X(0)-40}" y="${(Y(0)+Y(M.Ht))/2}" class="lbl" text-anchor="end">${f0(M.Ht)}</text>`;
  /* выноски */
  s += `<text x="${X(M.L)-4}" y="${Y(M.hw)-8}" class="lbl2" text-anchor="end">${LANG==='en' ? 'water' : 'вода'} ${f0(M.hw)}</text>`;

  /* ---- план ---- */
  const px=650, py=90, pw=300, ph=250;
  const sP = Math.min(pw/M.L, ph/M.D);
  const PX=x=>px+(pw-M.L*sP)/2+x*sP, PZ=y=>py+(ph-M.D*sP)/2+y*sP;
  const Q=(x0,y0,x1,y1,at)=>`<rect x="${PX(x0).toFixed(1)}" y="${PZ(y0).toFixed(1)}" width="${((x1-x0)*sP).toFixed(1)}" height="${((y1-y0)*sP).toFixed(1)}" ${at}/>`;
  s += `<text x="${px}" y="${py-16}" class="sub">${LANG==='en' ? 'plan' : 'план'}</text>`;
  s += Q(0,0,M.L,M.D,'fill="rgba(150,215,235,.10)" stroke="#4f9fbb" stroke-width="1.2"');
  s += Q(g.w,g.w,M.L-g.w,M.D-g.w,'fill="none" stroke="#7fc0d6" stroke-width="1" stroke-dasharray="4 3"');
  if(g.braces){
    for(let i=1;i<=g.braces;i++){
      const x=M.L*i/(g.braces+1);
      s += `<line x1="${PX(x).toFixed(1)}" y1="${PZ(0).toFixed(1)}" x2="${PX(x).toFixed(1)}" y2="${PZ(M.D).toFixed(1)}" stroke="#5b6068" stroke-width="2.5"/>`;
    }
  }
  s += `<text x="${PX(M.L/2)}" y="${PZ(M.D)+22}" class="lbl" text-anchor="middle">${f0(M.L)}</text>`;
  s += `<text x="${PX(M.L)+10}" y="${PZ(M.D/2)}" class="lbl">${f0(M.D)}</text>`;
  s += `<text x="${px}" y="${py+ph+48}" class="lbl2">${LANG==='en' ? `glass ${g.w} mm, bottom ${g.b} mm${g.braces ? ', braces '+g.braces : ''}` : `стекло ${g.w} мм, дно ${g.b} мм${g.braces ? ', стяжек '+g.braces : ''}`}</text>`;
  return svgWrap(W,Hh,s);
}

/* ---------- стеклянные детали: фронт + план ---------- */
function glassPartsHtml(M){
  const P = M.glassParts;
  const rows = P.rows.map(function(r){
    const k = Math.min(150 / Math.max(r.w, 1), 120 / Math.max(r.h, 1));
    const w = Math.max(24, Math.round(r.w * k));
    const h = Math.max(24, Math.round(r.h * k));
    const pcs = LANG === 'en' ? 'pcs' : 'шт';
    return '<div style="flex:0 0 auto;text-align:center;width:170px;margin-bottom:16px">'
      + '<div style="height:132px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:10px">'
      + '<div style="width:' + w + 'px;height:' + h + 'px;border:1.5px solid #7fc0d6;background:rgba(150,215,235,.16);border-radius:3px"></div>'
      + '</div>'
      + '<div style="font:600 13px/1.25 inherit;color:var(--tx)">' + r.key + '</div>'
      + '<div style="font:400 13px/1.25 var(--mono);color:var(--tx2);margin-top:3px">' + f0(r.w) + ' × ' + f0(r.h) + '</div>'
      + '<div style="font:400 11.5px/1.25 inherit;color:var(--tx3);margin-top:2px">' + r.qty + ' ' + pcs + '</div>'
      + '</div>';

  return '<div style="display:flex;gap:10px;flex-wrap:wrap;padding:14px 4px 0">' + rows + '</div>';
}

function drawGlass(M){
  const W=1000, Hh=640;
  const g=M.glass, P=M.glassParts;
  const tW=g.w, tB=g.b, sn=P.seam;

  /* ---- фронтальная проекция ---- */
  const fx=96, fw=560, fy=60, fh=290;
  const sF=Math.min(fw/M.L, fh/M.Ht);
  const ox=fx+(fw-M.L*sF)/2, oy=fy+(fh-M.Ht*sF)/2;
  const X=x=>ox+x*sF, Y=z=>oy+(M.Ht-z)*sF;
  const RX=(x0,z0,x1,z1,at)=>`<rect x="${X(x0).toFixed(1)}" y="${Y(z1).toFixed(1)}" width="${Math.max(.6,(x1-x0)*sF).toFixed(1)}" height="${Math.max(.6,(z1-z0)*sF).toFixed(1)}" ${at}/>`;
  const tck=(x1,y1,x2,y2)=>`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#b3b9c4"/>`;
  const swF=Math.max(1.5, sn*sF);

  let s='';
  s += `<text x="${fx}" y="${fy-18}" class="sub">${LANG==='en' ? 'front' : 'фронт'}</text>`;
  s += RX(0,0,M.L,M.Ht,'fill="rgba(150,215,235,.10)" stroke="#4f9fbb" stroke-width="1.2"');
  s += RX(0,0,M.L,tB,'fill="#c9e3ed" stroke="#7fb6c9" stroke-width=".9"');
  s += RX(0,tB,tW,M.Ht,'fill="#dceff6" stroke="#7fb6c9" stroke-width=".9"');
  s += RX(M.L-tW,tB,M.L,M.Ht,'fill="#dceff6" stroke="#7fb6c9" stroke-width=".9"');
  s += RX(tW+sn,tB,M.L-tW-sn,M.Ht,'fill="rgba(168,222,240,.34)" stroke="#4f9fbb" stroke-width="1"');
  s += `<rect x="${X(tW).toFixed(1)}" y="${Y(M.Ht).toFixed(1)}" width="${swF.toFixed(1)}" height="${Math.max(1,(M.Ht-tB)*sF).toFixed(1)}" fill="#d6dbe4"/>`;
  s += `<rect x="${(X(M.L-tW)-swF).toFixed(1)}" y="${Y(M.Ht).toFixed(1)}" width="${swF.toFixed(1)}" height="${Math.max(1,(M.Ht-tB)*sF).toFixed(1)}" fill="#d6dbe4"/>`;

  /* общая высота */
  const dL=X(0)-44, midY=(Y(0)+Y(M.Ht))/2;
  s += tck(dL,Y(0),dL,Y(M.Ht));
  s += tck(dL-4,Y(0),dL+4,Y(0));
  s += tck(dL-4,Y(M.Ht),dL+4,Y(M.Ht));
  s += `<text transform="rotate(-90 ${(dL-10).toFixed(1)} ${midY.toFixed(1)})" x="${(dL-10).toFixed(1)}" y="${midY.toFixed(1)}" class="lbl" text-anchor="middle">Ht ${f0(M.Ht)}</text>`;

  /* высота стенки */
  const dR=X(M.L)+46, midW=(Y(tB)+Y(M.Ht))/2;
  s += tck(dR,Y(tB),dR,Y(M.Ht));
  s += tck(dR-4,Y(tB),dR+4,Y(tB));
  s += tck(dR-4,Y(M.Ht),dR+4,Y(M.Ht));
  s += `<text x="${(dR+8).toFixed(1)}" y="${midW.toFixed(1)}" class="lbl" text-anchor="start" dominant-baseline="central">Ht−tB ${f0(P.wallH)}</text>`;

  /* длина передней/задней детали */
  const dy=Y(0)+32, xa=X(tW+sn), xb=X(M.L-tW-sn);
  s += tck(xa,dy,xb,dy);
  s += tck(xa,dy-4,xa,dy+4);
  s += tck(xb,dy-4,xb,dy+4);
  s += `<text x="${((xa+xb)/2).toFixed(1)}" y="${(dy+15).toFixed(1)}" class="lbl" text-anchor="middle">L−2tW−2g ${f0(P.frontW)}</text>`;

  /* ---- вид сверху ---- */
  const px=96, pw=430, py=430, ph=160;
  const sP=Math.min(pw/M.L, ph/M.D);
  const PX=x=>px+(pw-M.L*sP)/2+x*sP, PZ=y=>py+(ph-M.D*sP)/2+y*sP;
  const Q=(x0,y0,x1,y1,at)=>`<rect x="${PX(x0).toFixed(1)}" y="${PZ(y0).toFixed(1)}" width="${Math.max(.6,(x1-x0)*sP).toFixed(1)}" height="${Math.max(.6,(y1-y0)*sP).toFixed(1)}" ${at}/>`;
  const swP=Math.max(1.6, sn*sP), hP=Math.max(3, tW*sP);
  s += `<text x="${px}" y="${py-16}" class="sub">${LANG==='en' ? 'plan' : 'план'}</text>`;
  s += Q(0,0,M.L,M.D,'fill="rgba(150,215,235,.08)" stroke="#4f9fbb" stroke-width="1.2"');
  s += Q(0,0,tW,M.D,'fill="#dceff6" stroke="#7fb6c9" stroke-width=".9"');
  s += Q(M.L-tW,0,M.L,M.D,'fill="#dceff6" stroke="#7fb6c9" stroke-width=".9"');
  s += Q(tW+sn,0,M.L-tW-sn,tW,'fill="rgba(168,222,240,.34)" stroke="#4f9fbb" stroke-width="1"');
  s += Q(tW+sn,M.D-tW,M.L-tW-sn,M.D,'fill="rgba(168,222,240,.34)" stroke="#4f9fbb" stroke-width="1"');
  s += `<rect x="${PX(tW).toFixed(1)}" y="${PZ(0).toFixed(1)}" width="${swP.toFixed(1)}" height="${hP.toFixed(1)}" fill="#d6dbe4"/>`;
  s += `<rect x="${PX(tW).toFixed(1)}" y="${(PZ(M.D)-hP).toFixed(1)}" width="${swP.toFixed(1)}" height="${hP.toFixed(1)}" fill="#d6dbe4"/>`;
  s += `<rect x="${(PX(M.L-tW)-swP).toFixed(1)}" y="${PZ(0).toFixed(1)}" width="${swP.toFixed(1)}" height="${hP.toFixed(1)}" fill="#d6dbe4"/>`;
  s += `<rect x="${(PX(M.L-tW)-swP).toFixed(1)}" y="${(PZ(M.D)-hP).toFixed(1)}" width="${swP.toFixed(1)}" height="${hP.toFixed(1)}" fill="#d6dbe4"/>`;

  /* глубина боковины */
  const dX=PX(M.L)+24, dY0=PZ(0), dY1=PZ(M.D);
  s += tck(dX,dY0,dX,dY1);
  s += tck(dX-4,dY0,dX+4,dY0);
  s += tck(dX-4,dY1,dX+4,dY1);
  s += `<text x="${(dX+8).toFixed(1)}" y="${((dY0+dY1)/2).toFixed(1)}" class="lbl" text-anchor="start" dominant-baseline="central">D ${f0(M.D)}</text>`;

  /* длина */
  const yL=PZ(M.D)+26;
  s += tck(PX(0),yL,PX(M.L),yL);
  s += tck(PX(0),yL-4,PX(0),yL+4);
  s += tck(PX(M.L),yL-4,PX(M.L),yL+4);
  s += `<text x="${((PX(0)+PX(M.L))/2).toFixed(1)}" y="${(yL+15).toFixed(1)}" class="lbl" text-anchor="middle">L ${f0(M.L)}</text>`;

  /* условные обозначения */
  const lx=640;
  const lg=(y,fill,txt,st)=>`<rect x="${lx}" y="${y}" width="13" height="9" rx="2" fill="${fill}" stroke="${st||'#8fb9c9'}" stroke-width=".8"/><text x="${lx+19}" y="${y+8}" class="lbl2">${txt}</text>`;
  s += `<text x="${lx}" y="440" class="sub">${LANG==='en' ? 'parts' : 'детали'}</text>`;
  s += lg(452,'#c9e3ed',tstr('Дно'));
  s += lg(476,'#dceff6',tstr('Боковина'));
  s += lg(500,'rgba(168,222,240,.34)',LANG==='en' ? 'front & back' : 'передняя и задняя');
  s += lg(524,'#d6dbe4',LANG==='en' ? 'silicone seam' : 'силиконовый шов','#aab1bd');
  s += `<text x="${lx}" y="560" class="lbl2">${LANG==='en' ? 'wall height = Ht − tB' : 'высота стенки = Ht − tB'}</text>`;

  return svgWrap(W,Hh,s);
}

function renderTank(M){
  const g = M.glass;
  const gp = M.glassParts;
  const cell = (k,v) => `<div><dt>${tstr(k)}</dt><dd>${v}</dd></div>`;
  const gpNum = v => LANG === 'en' ? String(v) : String(v).replace('.', ',');
  const gpQty = n => `${n} ${LANG==='en' ? (n===1 ? 'pc' : 'pcs') : 'шт'}`;
  const gpRows = gp.rows.map(r=>{
    const note = r.seamNote
      ? `${tstr(r.note)}, ${LANG==='en' ? 'seam' : 'шов'} ${gpNum(gp.seam)} ${tstr('мм')}`
      : tstr(r.note);
    return `<tr><td>${tstr(r.key)}</td><td class="num">${f0(r.w)} × ${f0(r.h)}</td><td class="num">${gpQty(r.qty)}</td><td class="mut">${note}</td></tr>`;
  }).join('');
  const gpScheme = LANG === 'en'
    ? `Scheme: walls on the bottom${gp.big ? ', extra-strong bottom seam' : ''}`
    : `Схема: стенки на дне${gp.big ? ', шов по низу усиленный' : ''}`;
  const gpWarn = [];
  if(gp.big) gpWarn.push(LANG === 'en'
    ? 'Butt joints are not used: the edges are ground and the bottom sits on a tray.'
    : 'Встык не применяется — кромки шлифуются, низ сажается на поддон.');
  if(gp.huge) gpWarn.push(LANG === 'en'
    ? 'Top rim bracing and cross-braces are required; without them the lid and the walls will not hold.'
    : 'Требуется отбортовка по верху и стяжки; без них крышка и стенки не держат.');
  const gpWarnHtml = gpWarn.length ? `<div class="warnbox">${gpWarn.join('<br>')}</div>` : '';
  const soilRows = M.SOILS.map(([name, rho])=>{
    const cells = [30,50,70].map(d=>`<td class="num">${f0(M.soilV(d)*rho)} ${tstr('кг')}</td>`).join('');
    return `<tr><td>${tstr(name)}<span class="mut"> · ${f1(rho)} ${tstr('кг/л')}</span></td>${cells}</tr>`;
  }).join('');

  const specHtml = LANG === 'en' ? `<p><b>How to read.</b> Below is the full glass calculation. First the meaning and assumptions, then the formulas. Dimensions are in mm, stresses in MPa, masses in kg. Symbols: L, D, Ht — external length, depth and height; t<sub>w</sub> — wall thickness; t<sub>b</sub> — bottom thickness; h<sub>w</sub> — water level; s<sub>s</sub> — seam; β — shape coefficient; σ — stress; n — safety factor.</p>

<h3>1. Water and dimensions.</h3><p> Water level h<sub>w</sub> = max(120, Ht − 30) mm. The 30 mm is freeboard: water must not reach the rim. Internal dimensions: L<sub>i</sub> = L − 2t<sub>w</sub>, D<sub>i</sub> = D − 2t<sub>w</sub>. Water pressure grows with depth, so the calculation uses h<sub>w</sub>, not the full height Ht. Densities: glass 2500 kg/m³, water 1000 kg/m³, substrate from the table; g = 9.81 m/s².</p>

<h3>2. Where the stress comes from.</h3><p> The wall is treated as a plate supported on three sides: the bottom and the two side edges. The longer the span and the deeper the water, the greater the bending moment. The bending strength of sheet glass is σ<sub>b</sub> = 40 MPa. The safety factor n = 3.8 is an engineering margin: it covers the error of the empirical formula, load unevenness and ageing; it is not a manufacturer's datasheet. Allowable stress σ<sub>a</sub> = 40 / 3.8 = 10.53 MPa = 10.53·10<sup>6</sup> Pa. Empirical coefficient β<sub>0</sub> = 0.15. Required thickness without reinforcement:</p>
<p><code>s<sub>0</sub> = (L/1000) · √(β<sub>0</sub> · 1000 · g · (h<sub>w</sub>/1000) / σ<sub>a</sub>) · 1000</code></p>
<p>With rim bracing and cross-braces: β = β<sub>0</sub> · k<sub>r</sub> · k<sub>b</sub>, k<sub>r</sub> = 0.8, k<sub>b</sub> = 0.7. Then s<sub>req</sub> is the same formula with β. Actual stress at the selected t<sub>w</sub>:</p>
<p><code>σ = β · 1000 · g · (h<sub>w</sub>/1000) · (L/1000)<sup>2</sup> / (t<sub>w</sub>/1000)<sup>2</sup></code></p>
<p>σ is in Pa; divide by 10<sup>6</sup> for MPa. Actual safety n<sub>f</sub> = 40 / σ. If n<sub>f</sub> &lt; 3.8, the thickness is insufficient. Glass deflection is not calculated separately in this model: the criterion is stress.</p>

<h3>3. Thickness selection.</h3><p> Standard thickness series: 4, 5, 6, 8, 10, 12, 15, 19, 24 mm; thinner sheets are not considered. t<sub>w</sub> is the first value ≥ s<sub>req</sub>. t<sub>b</sub> is the first ≥ max(t<sub>w</sub> + 2, s<sub>req</sub> + 2). Why the bottom is thicker: the walls stand on it, the lower seam is more loaded and the bending moment near the bottom is higher. Why a series rather than an arbitrary number: sheet glass is made in standard thicknesses. If s<sub>req</sub> > 24 mm, the calculation is capped at 24 mm — a technologist is needed.</p>

<h3>4. Rim bracing, cross-braces, partitions.</h3><p> Rim bracing is a 60 mm strip around the top perimeter; it is enabled when L > 800 mm or h<sub>w</sub> > 400 mm: two strips front/back and two at the sides. Cross-braces are transverse 60 mm braces; they are enabled when L ≥ 900 mm, count n<sub>b</sub> = max(1, round(L/700) − 1). They tie the top and reduce the design span, hence k<sub>r</sub> = 0.8 and k<sub>b</sub> = 0.7. Internal partitions are not part of the model: they do not affect thickness selection; their mass and local loads are calculated separately.</p>

<h3>5. Seam and parts.</h3><p> Seam s<sub>s</sub>: 1.5 mm for t<sub>w</sub> ≤ 8; 2 mm for t<sub>w</sub> ≤ 12; 2.5 mm for t<sub>w</sub> > 12; 3 mm when L ≥ 2000 or Ht ≥ 700. The seam depends on glass thickness and size: a thicker sheet and a larger tank need a wider silicone layer. Parts: bottom L × D; sides D × (Ht − t<sub>b</sub>); front and back (L − 2t<sub>w</sub> − 2s<sub>s</sub>) × (Ht − t<sub>b</sub>). The seam is already deducted from the front/back width; do not subtract it again. Wall height is Ht minus bottom thickness.</p>

<h3>6. Weight.</h3><p> Glass mass: m<sub>g</sub> = ((2LHt + 2DHt)t<sub>w</sub> + LD·t<sub>b</sub>) · 10<sup>−9</sup> · 2500. This is an upper estimate: the seam and edges are not deducted. Water volume: V<sub>w</sub> = L<sub>i</sub>D<sub>i</sub>(h<sub>w</sub> − h<sub>s</sub>) · 10<sup>−6</sup> l; water mass equals V<sub>w</sub> in kg. Substrate: V<sub>s</sub> = L<sub>i</sub>D<sub>i</sub>h<sub>s</sub> · 10<sup>−6</sup> l, m<sub>s</sub> = V<sub>s</sub>ρ<sub>s</sub>. Actual weight M = m<sub>g</sub> + V<sub>w</sub> + m<sub>s</sub>. For loads M<sub>design</sub> = 1.1 · M(5 cm substrate) — the maximum; glass and stand use M<sub>design</sub> even when another layer is selected. The 10 % covers hardware, reinforcement and uneven load.</p>

<h3>7. Tolerances and limits.</h3><p> This is an engineering estimate, not a manufacturer's datasheet. Included: safety factor 3.8; +10 % weight; nominal thickness; 30 mm freeboard. Not included: impact and thermal loads, edge quality, silicone strength, sheet thickness tolerance, internal partitions and water dynamics. For L > 1500 mm, have the calculation checked by a glass workshop.</p>

<h3>8. Example 1200 × 500 × 500.</h3><p> The same steps on concrete numbers.</p>

<tr><td>σ / n<sub>f</sub></td><td>8.71 MPa / ×4.59</td></tr>
<tr><td>Seam</td><td>1.5 mm</td></tr>

<tr><td>Glass / water / substrate</td><td>49 / 241 / 43 kg</td></tr>
<tr><td>M / M<sub>design</sub></td><td>333 / 366 kg</td></tr>
</tbody></table>

<h3>9. Calculation order.</h3><p> 1) h<sub>w</sub>; 2) β and s<sub>0</sub>/s<sub>req</sub>; 3) t<sub>w</sub>/t<sub>b</sub>; 4) seam and parts; 5) masses; 6) M and M<sub>design</sub>. If length or water height changes, all steps are recalculated; the thickness may move to the next standard value.</p>` : `<p><b>Как читать.</b> Ниже — полный расчёт стекла. Сначала смысл и допущения, затем формулы. Размеры в мм, напряжения в МПа, массы в кг. Обозначения: L, D, Ht — наружные длина, глубина и высота; t<sub>w</sub> — толщина стенки; t<sub>b</sub> — толщина дна; h<sub>w</sub> — уровень воды; s<sub>ш</sub> — шов; β — коэффициент формы; σ — напряжение; n — запас.</p>

<h3>1. Вода и размеры.</h3><p> Уровень воды h<sub>w</sub> = max(120, Ht − 30) мм. 30 мм — свободный борт: вода не должна доходить до кромки. Внутренние размеры: L<sub>i</sub> = L − 2t<sub>w</sub>, D<sub>i</sub> = D − 2t<sub>w</sub>. Вода давит на стенку тем сильнее, чем глубже, поэтому в расчёт идёт h<sub>w</sub>, а не полная высота Ht. Плотности: стекло 2500 кг/м³, вода 1000 кг/м³, грунт — по таблице; g = 9,81 м/с².</p>

<h3>2. Откуда напряжение.</h3><p> Стенка рассматривается как пластина, опёртая по трём сторонам: низ и две боковые кромки. Чем длиннее пролёт и глубже вода, тем больше изгибающий момент. Предел изгиба листового стекла σ<sub>изг</sub> = 40 МПа. Запас n = 3,8 — инженерный: он покрывает неточность эмпирической формулы, неравномерность нагрузки и старение; это не паспорт производителя. Допускаемое напряжение σ<sub>доп</sub> = 40 / 3,8 = 10,53 МПа = 10,53·10<sup>6</sup> Па. Эмпирический коэффициент β<sub>0</sub> = 0,15. Требуемая толщина без усиления:</p>
<p><code>s<sub>без</sub> = (L/1000) · √(β<sub>0</sub> · 1000 · g · (h<sub>w</sub>/1000) / σ<sub>доп</sub>) · 1000</code></p>
<p>С отбортовкой и стяжками: β = β<sub>0</sub> · k<sub>отб</sub> · k<sub>стяж</sub>, k<sub>отб</sub> = 0,8, k<sub>стяж</sub> = 0,7. Тогда s<sub>нуж</sub> — та же формула с β. Фактическое напряжение при выбранной t<sub>w</sub>:</p>
<p><code>σ = β · 1000 · g · (h<sub>w</sub>/1000) · (L/1000)<sup>2</sup> / (t<sub>w</sub>/1000)<sup>2</sup></code></p>
<p>σ получается в Па; в МПа — делить на 10<sup>6</sup>. Фактический запас n<sub>ф</sub> = 40 / σ. Если n<sub>ф</sub> &lt; 3,8, толщина недостаточна. Прогиб стекла в этой модели отдельно не считается: критерий — напряжение.</p>

<h3>3. Выбор толщины.</h3><p> Ряд стандартных толщин: 4, 5, 6, 8, 10, 12, 15, 19, 24 мм; более тонкие листы не рассматриваются. t<sub>w</sub> — первый элемент ряда ≥ s<sub>нуж</sub>. t<sub>b</sub> — первый ≥ max(t<sub>w</sub> + 2, s<sub>нуж</sub> + 2). Почему дно толще: на нём лежат стенки, нижний шов нагружен сильнее, а изгибающий момент у дна больше. Почему ряд, а не произвольное число: листовое стекло выпускается стандартных толщин. Если s<sub>нуж</sub> > 24 мм, расчёт упирается в 24 мм — нужен технолог.</p>

<h3>4. Отбортовка, стяжки, перегородки.</h3><p> Отбортовка — полоса 60 мм по верхнему периметру; включается при L > 800 мм или h<sub>w</sub> > 400 мм: две полосы спереди/сзади и две по бокам. Стяжки — поперечные распорки 60 мм; включаются при L ≥ 900 мм, количество n<sub>с</sub> = max(1, round(L/700) − 1). Они стягивают верх и уменьшают расчётный пролёт, поэтому k<sub>отб</sub> = 0,8 и k<sub>стяж</sub> = 0,7. Внутренние перегородки в модель не входят: они не участвуют в выборе толщины; их масса и локальные нагрузки считаются отдельно.</p>

<h3>5. Шов и детали.</h3><p> Шов s<sub>ш</sub>: 1,5 мм при t<sub>w</sub> ≤ 8; 2 мм при t<sub>w</sub> ≤ 12; 2,5 мм при t<sub>w</sub> > 12; 3 мм при L ≥ 2000 или Ht ≥ 700. Шов зависит от толщины стекла и размера: чем толще лист и больше аквариум, тем шире слой силикона. Детали: дно L × D; боковины D × (Ht − t<sub>b</sub>); передняя и задняя (L − 2t<sub>w</sub> − 2s<sub>ш</sub>) × (Ht − t<sub>b</sub>). Шов уже вычтен из ширины передней/задней; не вычитайте его повторно. Высота стенки — Ht минус толщина дна.</p>

<h3>6. Вес.</h3><p> Масса стекла: m<sub>g</sub> = ((2LHt + 2DHt)t<sub>w</sub> + LD·t<sub>b</sub>) · 10<sup>−9</sup> · 2500. Это верхняя оценка: шов и кромки не вычитаются. Объём воды: V<sub>w</sub> = L<sub>i</sub>D<sub>i</sub>(h<sub>w</sub> − h<sub>s</sub>) · 10<sup>−6</sup> л; масса воды численно равна V<sub>w</sub> в кг. Грунт: V<sub>s</sub> = L<sub>i</sub>D<sub>i</sub>h<sub>s</sub> · 10<sup>−6</sup> л, m<sub>s</sub> = V<sub>s</sub>ρ<sub>s</sub>. Фактический вес M = m<sub>g</sub> + V<sub>w</sub> + m<sub>s</sub>. Для нагрузок M<sub>расч</sub> = 1,1 · M(5 см грунта) — максимум; стекло и тумба считаются по M<sub>расч</sub>, даже если выбран другой слой. 10 % — запас на крепёж, арматуру и неравномерность.</p>

<h3>7. Допуски и ограничения.</h3><p> Это инженерная оценка, не паспорт производителя. Учитываются: запас 3,8; +10 % веса; номинальная толщина; 30 мм свободного борта. Не учитываются: ударные и температурные нагрузки, качество кромки, прочность силикона, отклонение толщины листа, внутренние перегородки и динамика воды. Для L > 1500 мм расчёт нужно проверить у технолога.</p>

        <thead><tr><th>${tstr('Бренд')}</th><th>${tstr('Тип')}</th><th>${tstr('Модель')}</th><th>${tstr('Паспорт, л/ч')}</th><th>${tstr('Реально, л/ч')}</th><th>${tstr('Мощность, Вт')}</th><th>${tstr('Засыпка, л')}</th></tr></thead>
